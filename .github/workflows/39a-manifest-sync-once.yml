name: 39A one-shot final manifest sync

on:
  push:
    branches:
      - iteration/39a-a33-rebased-packaging-hygiene-20260904

permissions:
  contents: write

jobs:
  sync-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: iteration/39a-a33-rebased-packaging-hygiene-20260904
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install repository runtime requirements
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements.txt
      - name: Remove helper and generate exact final manifest
        run: |
          set -Eeuo pipefail
          rm .github/workflows/39a-manifest-sync-once.yml
          PYTHONPATH=src python scripts/build_release_manifest.py
          PYTHONPATH=src python scripts/build_release_manifest.py --check --json
          PYTHONPATH=src python scripts/validate_release_manifest.py
          git diff --check
      - name: Commit canonical manifest
        run: |
          set -Eeuo pipefail
          git config user.name 'provoware-release-orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --name-status
          git diff --cached --quiet && { echo 'Kein Manifest-Drift vorhanden.'; exit 0; }
          git commit -m '39A: synchronize final canonical release manifest'
          git push origin HEAD:iteration/39a-a33-rebased-packaging-hygiene-20260904
