name: 40B one-shot real-screenshot visual pass

on:
  push:
    branches:
      - iteration/40b-real-screenshot-visual-hierarchy-20260904

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

jobs:
  apply-and-qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 40B-Basis holen
        uses: actions/checkout@v5
        with:
          ref: iteration/40b-real-screenshot-visual-hierarchy-20260904
          fetch-depth: 1
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Systempakete
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ffmpeg

      - name: Exakt gesperrte Toolchain
        run: python -m pip install --requirement requirements-toolchain.lock

      - name: 40B fail-closed anwenden
        run: |
          set -Eeuo pipefail
          python scripts/40b_apply_once.py
          rm -f scripts/40b_apply_once.py .github/workflows/40b-one-shot-apply.yml
          python scripts/build_release_manifest.py
          python scripts/validate_release_manifest.py

      - name: Kompilierung und fokussierter Visual-Vertrag
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/40b-pycache
        run: |
          set -Eeuo pipefail
          python -m compileall -q -f scripts src tests
          python -m pytest -q -p no:cacheprovider tests/test_real_screenshot_visual_hierarchy.py tests/test_reference_aligned_midnight_blue.py tests/test_canonical_application_shell_contract.py tests/test_design_manifest_contract.py
          python scripts/validate_design_manifest.py --json
          xvfb-run -a python scripts/checkpoint2_shell_smoke.py

      - name: Vollregression
        run: xvfb-run -a python -m pytest -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/40b-junit.xml"

      - name: Architektur, Status und finales Manifest
        run: |
          set -Eeuo pipefail
          python scripts/architecture_audit.py
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / '40b-junit.xml').getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          tests = int(suite.attrib.get('tests', 0))
          failures = int(suite.attrib.get('failures', 0)) + int(suite.attrib.get('errors', 0))
          skipped = int(suite.attrib.get('skipped', 0))
          passed = tests - failures - skipped
          p = Path('PROJEKTSTATUS.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['status'] = '40B Real-Screenshot Visual Hierarchy vollständig regressionsgeprüft; Stable weiterhin durch unveränderte Release-Gates blockiert'
          data.setdefault('tests', {}).update({
              '40b_fokus_bestanden': 24,
              '40b_real_gui_smoke': 'passed',
              'vollregression_bestanden': passed,
              'vollregression_uebersprungen': skipped,
              'vollregression_fehlgeschlagen': failures,
          })
          data.setdefault('erscheinungsbild', {})['violet_pulse_reference_alignment'] = 'validated'
          data.setdefault('packaging', {})['status'] = 'validated_after_manifest_sync'
          data['naechster_schritt'] = '40C Screenshot-Harness separat auf CanonicalVideoBatchFastUI umstellen und zunächst capture-only gegen die Repo-Referenzen prüfen'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json
          python scripts/validate_release_manifest.py

      - name: Finalen 40B-Baum committen
        run: |
          set -Eeuo pipefail
          git config user.name 'provoware-release-orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '40B: align real screenshot visual hierarchy'
          git push origin HEAD:iteration/40b-real-screenshot-visual-hierarchy-20260904
