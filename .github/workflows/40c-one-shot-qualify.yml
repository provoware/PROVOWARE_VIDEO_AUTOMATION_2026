name: 40C one-shot workspace geometry stability

on:
  push:
    branches:
      - iteration/40c-workspace-geometry-stability-20260904

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 40C-Basis holen
        uses: actions/checkout@v5
        with:
          ref: iteration/40c-workspace-geometry-stability-20260904
          fetch-depth: 1
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Systempakete
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ffmpeg

      - name: Exakt gesperrte Toolchain
        run: python -m pip install --requirement requirements-toolchain.lock

      - name: 40B und 40C fail-closed anwenden
        run: |
          set -Eeuo pipefail
          python scripts/40b_apply_once.py
          python scripts/40c_apply_once.py
          python scripts/validate_version_contract.py

      - name: Kompilierung und fokussierter 40C-Vertrag
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/40c-pycache
        run: |
          set -Eeuo pipefail
          python -m compileall -q -f scripts src tests
          xvfb-run -a -s '-screen 0 1920x1200x24' python -m pytest -q -p no:cacheprovider \
            tests/test_iteration40c_workspace_geometry.py \
            tests/test_real_screenshot_visual_hierarchy.py \
            tests/test_reference_aligned_midnight_blue.py \
            tests/test_canonical_application_shell_contract.py \
            tests/test_design_manifest_contract.py \
            tests/test_rc22_responsive_workflow.py
          python scripts/validate_design_manifest.py --json
          xvfb-run -a -s '-screen 0 1920x1200x24' python scripts/checkpoint2_shell_smoke.py
          xvfb-run -a -s '-screen 0 1920x1200x24' python scripts/iteration40c_layout_smoke.py

      - name: Vollregression
        run: xvfb-run -a -s '-screen 0 1920x1200x24' python -m pytest -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/40c-junit.xml"

      - name: Architektur, Evidence und Status
        run: |
          set -Eeuo pipefail
          python scripts/architecture_audit.py
          python scripts/validate_version_contract.py
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ['RUNNER_TEMP']) / '40c-junit.xml'
          root = ET.parse(report).getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          tests = sum(int(s.attrib.get('tests', 0)) for s in suites)
          failures = sum(int(s.attrib.get('failures', 0)) + int(s.attrib.get('errors', 0)) for s in suites)
          skipped = sum(int(s.attrib.get('skipped', 0)) for s in suites)
          passed = tests - failures - skipped

          status_path = Path('PROJEKTSTATUS.json')
          data = json.loads(status_path.read_text(encoding='utf-8'))
          data['status'] = '40C Workspace Geometry Stability vollständig regressionsgeprüft; Stable bleibt durch unveränderte Release-Gates blockiert'
          data.setdefault('tests', {}).update({
              '40c_workspace_geometry_contract': 'passed',
              '40c_real_size_gui_smoke': 'passed',
              '40c_checkpoint2_shell_smoke': 'passed',
              'vollregression_bestanden': passed,
              'vollregression_uebersprungen': skipped,
              'vollregression_fehlgeschlagen': failures,
          })
          data.setdefault('erscheinungsbild', {})['workspace_geometry'] = 'validated'
          data['naechster_schritt'] = 'Screenshot-Harness separat auf CanonicalVideoBatchFastUI umstellen und capture-only gegen die Repo-Referenzen prüfen'
          status_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          evidence = Path('ITERATION_40C_TEST_EVIDENCE_2026-09-04.md')
          evidence.write_text(
              '# Iteration 40C · Test Evidence\n\n'
              '- Workspace-Geometrievertrag: PASS\n'
              '- 1858×1080-Xvfb-Produktions-Smoke bei 70 % Bereichszoom: PASS\n'
              '- Canonical-Shell-Smoke: PASS\n'
              f'- Vollregression: {passed} bestanden, {skipped} übersprungen, {failures} fehlgeschlagen\n'
              '- Architektur-Audit: PASS\n'
              '- Versionsvertrag: PASS\n\n'
              'Stable bleibt separat blockiert durch Coverage 80/65, physische KDE-X11/Wayland-Abnahme und realen Large-Media-/Slow-Target-Soak.\n',
              encoding='utf-8',
          )
          PY

      - name: Staging entfernen und finales Manifest erzeugen
        run: |
          set -Eeuo pipefail
          rm -f scripts/40b_apply_once.py scripts/40c_apply_once.py
          rm -f .github/workflows/40b-one-shot-apply.yml .github/workflows/40c-one-shot-qualify.yml
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json
          python scripts/validate_release_manifest.py
          python scripts/validate_version_contract.py

      - name: Finalen 40C-Baum committen
        run: |
          set -Eeuo pipefail
          git config user.name 'provoware-release-orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '40C: stabilize workspace geometry and scroll anchor'
          git push origin HEAD:iteration/40c-workspace-geometry-stability-20260904

      - name: Deterministisches 40C-Release-ZIP
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          python scripts/package_release.py --output dist/PROVOWARE_VideoBatch_Fast_2.8.3-rc25_ITER40C_WORKSPACE_GEOMETRY.zip
          python scripts/verify_release_zip.py dist/PROVOWARE_VideoBatch_Fast_2.8.3-rc25_ITER40C_WORKSPACE_GEOMETRY.zip
          sha256sum dist/PROVOWARE_VideoBatch_Fast_2.8.3-rc25_ITER40C_WORKSPACE_GEOMETRY.zip > dist/PROVOWARE_VideoBatch_Fast_2.8.3-rc25_ITER40C_WORKSPACE_GEOMETRY.zip.sha256

      - name: 40C-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PROVOWARE-VideoBatch-Fast-40C-rc25
          path: |
            dist/PROVOWARE_VideoBatch_Fast_2.8.3-rc25_ITER40C_WORKSPACE_GEOMETRY.zip
            dist/PROVOWARE_VideoBatch_Fast_2.8.3-rc25_ITER40C_WORKSPACE_GEOMETRY.zip.sha256
          if-no-files-found: error
          retention-days: 14
