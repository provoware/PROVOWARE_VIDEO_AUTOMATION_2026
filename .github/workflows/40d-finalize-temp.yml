name: 40D one-shot final repository closure

on:
  push:
    branches: [iteration/40d-coverage-contract-20260904]
  workflow_dispatch:

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: System packages
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ffmpeg

      - name: Install exact toolchain
        run: |
          set -Eeuo pipefail
          python -m pip install --requirement requirements-toolchain.lock

      - name: Compile final product surface
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/40d-pycache
        run: |
          set -Eeuo pipefail
          python -m compileall -q -f scripts src tests
          python scripts/validate_design_manifest.py --json

      - name: Create provisional consistent rc25 evidence
        run: |
          set -Eeuo pipefail
          VIDEOBATCH_DIAGNOSTICS_DIR="$RUNNER_TEMP/pre-arch" python scripts/architecture_audit.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('.')
          path = root/'diagnostics/release_readiness/RELEASE_EVIDENCE.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          report_name = 'VideoBatch_Fast_2.8.3-rc25_BUILD_REPORT_save_.json'
          data['approved_quality_report'] = report_name
          manifest = json.loads((root/'RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          data['manifest'] = {'path':'RELEASE_MANIFEST.json','file_count':int(manifest['file_count']),'status':'passed'}
          provenance = data.setdefault('provenance', {})
          legacy = provenance.get('legacy_a32_full_regression') or {
              'status': 'historical_superseded',
              'artifact_name': provenance.get('full_regression_artifact_name',''),
              'artifact_id': provenance.get('full_regression_artifact_id',0),
              'artifact_sha256': provenance.get('full_regression_artifact_sha256',''),
          }
          legacy['status'] = 'historical_superseded'
          provenance['legacy_a32_full_regression'] = legacy
          for key in ('full_regression_artifact_name','full_regression_artifact_id','full_regression_artifact_sha256'):
              provenance.pop(key, None)
          provenance['full_regression_run_id'] = int(os.environ['GITHUB_RUN_ID'])
          provenance['full_regression_verified_commit'] = os.environ['GITHUB_SHA']
          provenance['evidence_normalization_run_id'] = int(os.environ['GITHUB_RUN_ID'])
          quality = data.setdefault('internal_quality', {})
          quality['measurement_source'] = 'scripts/internal_quality_gate.py'
          quality['measurement_scope'] = 'src+scripts+tests'
          arch = json.loads((Path(os.environ['RUNNER_TEMP'])/'pre-arch/architecture_audit_latest.json').read_text(encoding='utf-8'))
          quality['current_architecture'] = {
              'modules_checked': int(arch['modules']),
              'function_count': int(arch['functions']),
              'class_count': int(arch['classes']),
              'largest_python_file': str(arch['max_file']['name']),
              'largest_python_file_lines': int(arch['max_file']['lines']),
              'architecture_findings': len(arch['findings']),
          }
          ready = data['release_files']['ready']
          for item in ready:
              if item.get('path') == 'VideoBatch_Fast_2.8.3-rc24_BUILD_REPORT_save_.json':
                  item.update(path=report_name, label='Maschinenlesbarer Buildbericht', evidence='Aus der aktuellen 40D-/rc25-Evidence erzeugt')
              elif item.get('path') in {'RELEASE_NOTES_save_.md','TEST_REPORT_save_.md','FRESH_PACKAGE_REPORT_save_.md'}:
                  item['evidence'] = 'Aktueller 40D-/rc25-Stand; wird im Abschlusslauf frisch synchronisiert'
              elif '2.8.3-rc24' in str(item.get('path','')):
                  item['evidence'] = 'Historischer RC24-Nachweis; unverändert zur Rückverfolgbarkeit aufbewahrt'
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          python diagnostics/release_readiness/generate_from_evidence.py --write
          python scripts/render_release_docs.py --write
          xvfb-run -a python -m pytest -q -p no:cacheprovider tests/test_current_release_evidence_contract.py tests/test_release_docs.py

      - name: Initial full regression with branch coverage
        run: |
          set -Eeuo pipefail
          xvfb-run -a python -m pytest -q -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/initial-junit.xml" \
            --cov=videobatch_fast --cov-branch --cov-fail-under=0 \
            --cov-report=term --cov-report=json:"$RUNNER_TEMP/initial-coverage.json" \
            | tee "$RUNNER_TEMP/initial-full.log"
          python scripts/coverage_policy.py "$RUNNER_TEMP/initial-coverage.json" 80 65

      - name: Remove one-shot workflow from candidate tree
        run: |
          set -Eeuo pipefail
          rm .github/workflows/40d-finalize-temp.yml
          test ! -e .github/workflows/40d-resource-verify-temp.yml
          test ! -e .github/workflows/40d-finalize-temp.yml

      - name: Fresh quality and architecture on workflow-free tree
        run: |
          set -Eeuo pipefail
          python scripts/internal_quality_gate.py
          python scripts/architecture_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          quality=json.loads(Path('diagnostics/internal_quality_latest.json').read_text(encoding='utf-8'))
          arch=json.loads(Path('diagnostics/architecture_audit_latest.json').read_text(encoding='utf-8'))
          assert quality['status']=='pass', quality
          assert quality['findings']==[], quality
          assert quality['metrics']['max_complexity'] <= 30, quality
          assert arch['findings']==[], arch
          print('QUALITY_AND_ARCHITECTURE_PASS')
          PY

      - name: Synchronize final 40D evidence and reports from measurements
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, platform, xml.etree.ElementTree as ET
          from pathlib import Path

          def junit_counts(path: Path) -> tuple[int, int, int, int]:
              root = ET.parse(path).getroot()
              tag = root.tag.rsplit('}', 1)[-1]
              if tag == 'testsuite':
                  suites = [root]
              elif tag == 'testsuites':
                  suites = [child for child in root if child.tag.rsplit('}', 1)[-1] == 'testsuite']
              else:
                  raise AssertionError(f'Unerwarteter JUnit-Root: {root.tag}')
              if not suites:
                  raise AssertionError('JUnit enthält keine testsuite')
              names = ('tests', 'failures', 'errors', 'skipped')
              return tuple(sum(int(suite.attrib.get(name, 0)) for suite in suites) for name in names)

          root=Path('.')
          runner=Path(os.environ['RUNNER_TEMP'])
          evidence_path=root/'diagnostics/release_readiness/RELEASE_EVIDENCE.json'
          data=json.loads(evidence_path.read_text(encoding='utf-8'))
          cov=json.loads((runner/'initial-coverage.json').read_text(encoding='utf-8'))['totals']
          total, failures, errors, skipped = junit_counts(runner/'initial-junit.xml')
          passed=total-failures-errors-skipped
          statements=int(cov.get('num_statements',0)); covered=int(cov.get('covered_lines',0)); branches=int(cov.get('num_branches',0)); covered_branches=int(cov.get('covered_branches',0))
          line=covered/statements*100 if statements else 0.0
          branch=covered_branches/branches*100 if branches else 100.0
          combined=float(cov.get('percent_covered',0.0))
          assert total > 0 and passed > 0 and failures==0 and errors==0 and line >= 80 and branch >= 65
          tests=data['tests']
          tests.update({
              'passed':passed,'failed':failures+errors,'skipped':skipped,'collected':total,
              'line_coverage_percent':round(line,2),'branch_coverage_percent':round(branch,2),
              'combined_coverage_percent':round(combined,2),
              'full_regression':f'{passed} passed / {skipped} skipped / {total} collected',
              'test_environment':f'Ubuntu 24.04 · Python {platform.python_version()} · Xvfb',
          })
          provenance=data['provenance']
          provenance['current_40d_head']=os.environ['GITHUB_SHA']
          provenance['full_regression_run_id']=int(os.environ['GITHUB_RUN_ID'])
          provenance['full_regression_verified_commit']=os.environ['GITHUB_SHA']
          provenance['evidence_normalization_run_id']=int(os.environ['GITHUB_RUN_ID'])
          provenance['coverage_contract_run_id']=int(os.environ['GITHUB_RUN_ID'])
          provenance['coverage_contract_verified_commit']=os.environ['GITHUB_SHA']
          provenance['coverage_contract_verified_at']='2026-09-04'
          quality_report=json.loads((root/'diagnostics/internal_quality_latest.json').read_text(encoding='utf-8'))
          arch=json.loads((root/'diagnostics/architecture_audit_latest.json').read_text(encoding='utf-8'))
          qm=quality_report['metrics']
          data['internal_quality']={
              'architecture_findings':len(arch['findings']),
              'internal_files_checked':int(qm['files']),
              'internal_findings':len(quality_report['findings']),
              'internal_function_count':int(qm['functions']),
              'largest_python_file_lines':int(qm['max_lines']),
              'maximum_complexity':int(qm['max_complexity']),
              'measurement_source':'scripts/internal_quality_gate.py',
              'measurement_scope':'src+scripts+tests',
              'current_architecture':{
                  'modules_checked':int(arch['modules']),
                  'function_count':int(arch['functions']),
                  'class_count':int(arch['classes']),
                  'largest_python_file':str(arch['max_file']['name']),
                  'largest_python_file_lines':int(arch['max_file']['lines']),
                  'architecture_findings':len(arch['findings']),
              },
          }
          gate=next(item for item in data['stable_gates'] if item['id']=='coverage_80_65')
          gate['status']='passed'
          gate['reason']=f"{line:.2f} % Zeilenabdeckung und {branch:.2f} % Branch-Abdeckung; scripts/coverage_policy.py bestanden · Workflow {os.environ['GITHUB_RUN_ID']} · Python {platform.python_version()}."
          data['release_cleanup'].update({
              'temporary_40d_workflows_removed':2,
              'tracked_temp_leftovers':0,
              'repo_cleanup_status':'passed',
          })
          data['approved_quality_report']='VideoBatch_Fast_2.8.3-rc25_BUILD_REPORT_save_.json'
          evidence_path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          marker_start='<!-- 40d-final:start -->'; marker_end='<!-- 40d-final:end -->'
          def managed(path: Path, block: str):
              old=path.read_text(encoding='utf-8') if path.exists() else ''
              if marker_start in old and marker_end in old:
                  before=old.split(marker_start,1)[0]
                  after=old.split(marker_end,1)[1]
                  text=before+block+after
              else:
                  text=block+'\n\n'+old
              path.write_text(text, encoding='utf-8')
          metric=f"{passed}/{total} Tests bestanden, {skipped} übersprungen · Coverage {line:.2f}% Zeilen / {branch:.2f}% Branch · max. Komplexität {qm['max_complexity']} · Qualitätsbefunde 0."
          managed(root/'RELEASE_NOTES_save_.md', f"{marker_start}\n## 2.8.3-rc25 · 40D Abschlussstand\n\n{metric}\n\nNeu: kompakte doppelte Fortschrittsanzeige, CPU/RAM/SWAP/ZRAM/Freiplatz live, CPU-50%-Begrenzung, RAM-Presets 1/1,5/2/2,5 GB sowie Pause/Fortsetzen des laufenden FFmpeg-Prozesses am gehaltenen Prozesszustand.\n{marker_end}")
          managed(root/'TEST_REPORT_save_.md', f"{marker_start}\n## 40D · aktueller Testnachweis\n\n{metric}\n\nDesignvertrag, Ressourcensteuerung, Prozesspause/-fortsetzung, Qualitätsgate und Architektur-Audit bestanden. Stable bleibt ausschließlich durch physische KDE-X11/Wayland-Abnahme und Large-Media-Soak gesperrt.\n{marker_end}")
          managed(root/'FRESH_PACKAGE_REPORT_save_.md', f"{marker_start}\n## 2.8.3-rc25 · Paketstatus\n\nKandidat wird aus dem workflowfreien, manifestierten Endbaum deterministisch erzeugt. {metric}\n\nTemporäre 40D-Prüfworkflows und bekannte Cache-/coverage-/tmp-Überbleibsel sind nicht Bestandteil des Releasebaums.\n{marker_end}")
          managed(root/'TODO.md', f"{marker_start}\n## 40D RC-Abschluss · aktueller Status\n\n- [x] Komplexitätsgate ≤30; aktuell {qm['max_complexity']}.\n- [x] Interne Qualitätsprüfung: 0 Befunde.\n- [x] Ressourcenmonitor: CPU, RAM, SWAP, ZRAM, freier Speicher.\n- [x] CPU-50%-Schalter und exklusive RAM-Presets 1/1,5/2/2,5 GB.\n- [x] Laufenden FFmpeg-Prozess pausieren und am gehaltenen Zustand fortsetzen.\n- [x] 40D-Evidence und realer rc25-Buildreport werden aus demselben Abschlusslauf erzeugt.\n- [ ] Physische KDE-X11-/Wayland-Abnahme auf finalem Kandidaten.\n- [ ] Large-Media-Soak auf langsamem externem Ziel.\n\n**Stable bleibt fail-closed; diese beiden physischen Gates werden nicht durch CI ersetzt.**\n{marker_end}")
          PY
          python diagnostics/release_readiness/generate_from_evidence.py --write
          python scripts/render_release_docs.py --write

      - name: Build preliminary workflow-free manifest and bind evidence count
        run: |
          set -Eeuo pipefail
          python scripts/build_release_manifest.py
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          path=Path('diagnostics/release_readiness/RELEASE_EVIDENCE.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['manifest']={'path':'RELEASE_MANIFEST.json','file_count':int(manifest['file_count']),'status':'passed'}
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          python diagnostics/release_readiness/generate_from_evidence.py --write
          python scripts/render_release_docs.py --write
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json
          python scripts/validate_release_manifest.py

      - name: Final full regression and coverage on exact final candidate
        run: |
          set -Eeuo pipefail
          xvfb-run -a python -m pytest -q -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/final-junit.xml" \
            --cov=videobatch_fast --cov-branch --cov-fail-under=0 \
            --cov-report=term --cov-report=json:"$RUNNER_TEMP/final-coverage.json" \
            | tee "$RUNNER_TEMP/final-full.log"
          python scripts/coverage_policy.py "$RUNNER_TEMP/final-coverage.json" 80 65

      - name: Prove final measurements equal canonical evidence
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          import os

          def junit_counts(path: Path) -> tuple[int, int, int, int]:
              root = ET.parse(path).getroot()
              tag = root.tag.rsplit('}', 1)[-1]
              if tag == 'testsuite':
                  suites = [root]
              elif tag == 'testsuites':
                  suites = [child for child in root if child.tag.rsplit('}', 1)[-1] == 'testsuite']
              else:
                  raise AssertionError(f'Unerwarteter JUnit-Root: {root.tag}')
              if not suites:
                  raise AssertionError('JUnit enthält keine testsuite')
              names = ('tests', 'failures', 'errors', 'skipped')
              return tuple(sum(int(suite.attrib.get(name, 0)) for suite in suites) for name in names)

          runner=Path(os.environ['RUNNER_TEMP'])
          data=json.loads(Path('diagnostics/release_readiness/RELEASE_EVIDENCE.json').read_text(encoding='utf-8'))
          totals=json.loads((runner/'final-coverage.json').read_text(encoding='utf-8'))['totals']
          total, failures, errors, skipped = junit_counts(runner/'final-junit.xml')
          passed=total-failures-errors-skipped
          statements=int(totals.get('num_statements',0)); covered=int(totals.get('covered_lines',0)); branches=int(totals.get('num_branches',0)); covered_branches=int(totals.get('covered_branches',0))
          line=round(covered/statements*100 if statements else 0.0,2); branch=round(covered_branches/branches*100 if branches else 100.0,2); combined=round(float(totals.get('percent_covered',0.0)),2)
          expected=data['tests']
          actual={'passed':passed,'failed':failures+errors,'skipped':skipped,'collected':total,'line_coverage_percent':line,'branch_coverage_percent':branch,'combined_coverage_percent':combined}
          assert total > 0 and passed > 0
          for key,value in actual.items():
              assert expected[key]==value, (key, expected[key], value)
          assert line >= 80 and branch >= 65 and failures+errors == 0
          print(json.dumps(actual, ensure_ascii=False, indent=2))
          PY

      - name: Final read-only evidence design manifest and quality checks
        run: |
          set -Eeuo pipefail
          python diagnostics/release_readiness/generate_from_evidence.py --check
          python scripts/render_release_docs.py --check
          python scripts/validate_design_manifest.py --json
          python scripts/build_release_manifest.py --check --json
          python scripts/validate_release_manifest.py
          cp diagnostics/internal_quality_latest.json "$RUNNER_TEMP/final-quality-before.json"
          python scripts/internal_quality_gate.py
          cmp -s diagnostics/internal_quality_latest.json "$RUNNER_TEMP/final-quality-before.json"
          cp diagnostics/architecture_audit_latest.json "$RUNNER_TEMP/final-arch-before.json"
          python scripts/architecture_audit.py
          cmp -s diagnostics/architecture_audit_latest.json "$RUNNER_TEMP/final-arch-before.json"

      - name: Build and prove deterministic rc25 ZIP
        run: |
          set -Eeuo pipefail
          ZIP1="$RUNNER_TEMP/VideoBatch_Fast_2.8.3-rc25_40D_FINAL.zip"
          ZIP2="$RUNNER_TEMP/VideoBatch_Fast_2.8.3-rc25_40D_REPRO.zip"
          python scripts/package_release.py --output "$ZIP1"
          python scripts/verify_release_zip.py "$ZIP1"
          python scripts/package_release.py --output "$ZIP2"
          cmp -s "$ZIP1" "$ZIP2"
          sha256sum "$ZIP1" | tee "$RUNNER_TEMP/VideoBatch_Fast_2.8.3-rc25_40D_FINAL.zip.sha256.txt"
          echo "FINAL_ZIP=$ZIP1" >> "$GITHUB_ENV"

      - name: Strict final scope and repository hygiene audit
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/40d-resource-verify-temp.yml
          test ! -e .github/workflows/40d-finalize-temp.yml
          test ! -e coverage.json
          test ! -e .coverage
          find . -path ./.git -prune -o \( -name '__pycache__' -o -name '*.pyc' -o -name '*.pyo' -o -name '*.tmp' \) -print | tee "$RUNNER_TEMP/hygiene.txt"
          test ! -s "$RUNNER_TEMP/hygiene.txt"
          python - <<'PY'
          import subprocess
          allowed={
              '.github/workflows/40d-finalize-temp.yml',
              'DEVELOPMENT_STATUS.json','QUALITY_ENVIRONMENT_STATUS.json','RELEASE_FILE_STATUS.json',
              'README.md','STATUS.md','TODO.md','RELEASE_NOTES_save_.md','TEST_REPORT_save_.md','FRESH_PACKAGE_REPORT_save_.md',
              'RELEASE_MANIFEST.json','VideoBatch_Fast_2.8.3-rc25_BUILD_REPORT_save_.json',
              'diagnostics/release_readiness/RELEASE_EVIDENCE.json','diagnostics/internal_quality_latest.json','diagnostics/architecture_audit_latest.json',
          }
          lines=subprocess.check_output(['git','status','--porcelain','--untracked-files=all'], text=True).splitlines()
          paths=[]
          for line in lines:
              raw=line[3:]
              if ' -> ' in raw:
                  raw=raw.split(' -> ',1)[1]
              paths.append(raw.strip('"'))
          unexpected=sorted(set(paths)-allowed)
          if unexpected:
              raise SystemExit('UNEXPECTED_SCOPE: '+', '.join(unexpected))
          print('SCOPE_PASS')
          for line in lines:
              print(line)
          PY

      - name: Commit and push final workflow-free tree
        run: |
          set -Eeuo pipefail
          git config user.name 'provoware-40d-finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'release(40d): finalize rc25 resource controls and evidence'
          git push origin HEAD:iteration/40d-coverage-contract-20260904
          git rev-parse HEAD | tee "$RUNNER_TEMP/final-commit.txt"

      - name: Upload final verified package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: VideoBatch_Fast_2.8.3-rc25_40D_FINAL
          path: |
            ${{ env.FINAL_ZIP }}
            ${{ runner.temp }}/VideoBatch_Fast_2.8.3-rc25_40D_FINAL.zip.sha256.txt
            ${{ runner.temp }}/final-full.log
            ${{ runner.temp }}/final-coverage.json
            ${{ runner.temp }}/final-junit.xml
            ${{ runner.temp }}/final-commit.txt
          if-no-files-found: error
