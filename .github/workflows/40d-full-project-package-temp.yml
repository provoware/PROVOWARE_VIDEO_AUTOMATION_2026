name: 40D final full-project package

on:
  push:
    branches: [iteration/40d-coverage-contract-20260904]
  workflow_dispatch:

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  finalize-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: System packages
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ffmpeg

      - name: Install exact toolchain
        run: |
          set -Eeuo pipefail
          python -m pip install --requirement requirements-toolchain.lock

      - name: Apply final gate policy and provisional evidence
        run: |
          set -Eeuo pipefail
          python scripts/internal_quality_gate.py
          VIDEOBATCH_DIAGNOSTICS_DIR="$RUNNER_TEMP/arch" python scripts/architecture_audit.py
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path('.')
          evidence_path = root / 'diagnostics/release_readiness/RELEASE_EVIDENCE.json'
          data = json.loads(evidence_path.read_text(encoding='utf-8'))

          # User-approved release policy, 2026-09-04:
          # Wayland is not required. Large-media soak is explicitly waived,
          # not falsely recorded as passed. Physical KDE/X11 remains the only blocker.
          physical = next(item for item in data['stable_gates'] if item['id'] == 'physical_kde_x11_wayland')
          physical.update({
              'label': 'Physische KDE-X11-Abnahme',
              'status': 'open',
              'reason': 'Reale KDE-X11-Zielsystem-Abnahme fehlt; Wayland ist gemäß Freigabeentscheidung vom 2026-09-04 nicht erforderlich.',
          })
          soak = next(item for item in data['stable_gates'] if item['id'] == 'large_media_soak')
          data['stable_gates'] = [item for item in data['stable_gates'] if item['id'] != 'large_media_soak']
          data['waived_gates'] = [
              {
                  'id': 'large_media_soak',
                  'label': soak.get('label', 'Langzeitrender mit großer Medienauswahl'),
                  'status': 'waived',
                  'reason': 'Gemäß Freigabeentscheidung vom 2026-09-04 bewusst übersprungen; nicht als bestanden gewertet und kein Stable-Blocker.',
              },
              {
                  'id': 'physical_kde_wayland',
                  'label': 'Physische KDE-Wayland-Abnahme',
                  'status': 'not_required',
                  'reason': 'Wayland ist gemäß Freigabeentscheidung vom 2026-09-04 kein Ziel- oder Pflicht-Gate.',
              },
          ]
          data['stable_ready'] = False
          data['progress'] = {
              'percent': 97,
              'completed': 29,
              'open': 1,
              'total': 30,
              'current_todo': 'Physische KDE-X11-Abnahme auf dem finalen Kandidaten durchführen.',
          }
          data['approved_quality_report'] = 'VideoBatch_Fast_2.8.3-rc25_BUILD_REPORT_save_.json'
          data['manifest']['file_count'] = int(json.loads((root/'RELEASE_MANIFEST.json').read_text(encoding='utf-8'))['file_count'])

          provenance = data.setdefault('provenance', {})
          provenance['full_regression_run_id'] = int(os.environ['GITHUB_RUN_ID'])
          provenance['full_regression_verified_commit'] = os.environ['GITHUB_SHA']
          provenance['current_40d_head'] = os.environ['GITHUB_SHA']
          provenance['coverage_contract_run_id'] = int(os.environ['GITHUB_RUN_ID'])
          provenance['coverage_contract_verified_commit'] = os.environ['GITHUB_SHA']
          provenance['coverage_contract_verified_at'] = '2026-09-04'
          provenance['evidence_normalization_run_id'] = int(os.environ['GITHUB_RUN_ID'])
          provenance.setdefault('legacy_a32_full_regression', {'status': 'historical_superseded'})['status'] = 'historical_superseded'
          for key in ('full_regression_artifact_name','full_regression_artifact_id','full_regression_artifact_sha256'):
              provenance.pop(key, None)

          quality = json.loads((root/'diagnostics/internal_quality_latest.json').read_text(encoding='utf-8'))
          arch = json.loads((Path(os.environ['RUNNER_TEMP'])/'arch/architecture_audit_latest.json').read_text(encoding='utf-8'))
          qm = quality['metrics']
          data['internal_quality'] = {
              'architecture_findings': len(arch['findings']),
              'internal_files_checked': int(qm['files']),
              'internal_findings': len(quality['findings']),
              'internal_function_count': int(qm['functions']),
              'largest_python_file_lines': int(qm['max_lines']),
              'maximum_complexity': int(qm['max_complexity']),
              'measurement_source': 'scripts/internal_quality_gate.py',
              'measurement_scope': 'src+scripts+tests',
              'current_architecture': {
                  'modules_checked': int(arch['modules']),
                  'function_count': int(arch['functions']),
                  'class_count': int(arch['classes']),
                  'largest_python_file': str(arch['max_file']['name']),
                  'largest_python_file_lines': int(arch['max_file']['lines']),
                  'architecture_findings': len(arch['findings']),
              },
          }

          for item in data['release_files']['unfinished']:
              path = item.get('path','')
              if path == 'docs/LONG_RENDER_2.8.3-rc24.md':
                  item['reason'] = 'Large-Media-/Slow-Target-Soak wurde am 2026-09-04 bewusst übersprungen und ist kein Stable-Blocker.'
              elif path == 'docs/STABLE_ACCEPTANCE_EVIDENCE.md':
                  item['reason'] = 'Nur die physische KDE-X11-Zielsystem-Abnahme bleibt als Stable-Gate offen.'
              elif path == 'VISUAL_DESKTOP_APPROVAL.md':
                  item['reason'] = 'Physische KDE-X11-Abnahme bleibt offen; Wayland ist nicht erforderlich.'
              elif path == 'VISUAL_INSPECTION_MANIFEST.json':
                  item['reason'] = 'Physischer X11-Lauf ist noch nicht vollständig bestätigt; Wayland ist nicht erforderlich.'

          evidence_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = root/'tests/test_current_release_evidence_contract.py'
          text = test_path.read_text(encoding='utf-8')
          text = text.replace(
              '"percent": 93,\n        "completed": 28,\n        "open": 2,\n        "total": 30,\n        "current_todo": "Physische KDE-X11-/Wayland-Abnahme und Large-Media-Soak auf demselben finalen Kandidaten durchführen.",',
              '"percent": 97,\n        "completed": 29,\n        "open": 1,\n        "total": 30,\n        "current_todo": "Physische KDE-X11-Abnahme auf dem finalen Kandidaten durchführen.",'
          )
          text = text.replace(
              'assert [item["id"] for item in data["stable_gates"] if item["status"] == "open"] == [\n        "physical_kde_x11_wayland",\n        "large_media_soak",\n    ]',
              'assert [item["id"] for item in data["stable_gates"] if item["status"] == "open"] == [\n        "physical_kde_x11_wayland",\n    ]\n    waived = {item["id"]: item for item in data["waived_gates"]}\n    assert waived["large_media_soak"]["status"] == "waived"\n    assert waived["physical_kde_wayland"]["status"] == "not_required"'
          )
          test_path.write_text(text, encoding='utf-8')
          PY
          python diagnostics/release_readiness/generate_from_evidence.py --write
          python scripts/render_release_docs.py --write
          xvfb-run -a python -m pytest -q -p no:cacheprovider tests/test_current_release_evidence_contract.py tests/test_release_docs.py

      - name: Full regression A with branch coverage
        run: |
          set -Eeuo pipefail
          xvfb-run -a python -m pytest -q -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/a-junit.xml" \
            --cov=videobatch_fast --cov-branch --cov-fail-under=0 \
            --cov-report=json:"$RUNNER_TEMP/a-coverage.json"
          python scripts/coverage_policy.py "$RUNNER_TEMP/a-coverage.json" 80 65

      - name: Synchronize exact measurements and documentation
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, platform, xml.etree.ElementTree as ET
          from pathlib import Path

          def counts(path: Path):
              root = ET.parse(path).getroot()
              tag = root.tag.rsplit('}',1)[-1]
              suites = [root] if tag == 'testsuite' else [x for x in root if x.tag.rsplit('}',1)[-1] == 'testsuite']
              assert suites
              names = ('tests','failures','errors','skipped')
              return tuple(sum(int(s.attrib.get(n,0)) for s in suites) for n in names)

          root=Path('.'); runner=Path(os.environ['RUNNER_TEMP'])
          path=root/'diagnostics/release_readiness/RELEASE_EVIDENCE.json'
          data=json.loads(path.read_text(encoding='utf-8'))
          cov=json.loads((runner/'a-coverage.json').read_text(encoding='utf-8'))['totals']
          total, failures, errors, skipped=counts(runner/'a-junit.xml')
          passed=total-failures-errors-skipped
          statements=int(cov['num_statements']); covered=int(cov['covered_lines'])
          branches=int(cov.get('num_branches',0)); covered_branches=int(cov.get('covered_branches',0))
          line=covered/statements*100 if statements else 0.0
          branch=covered_branches/branches*100 if branches else 100.0
          combined=float(cov.get('percent_covered',0.0))
          assert passed > 0 and failures == 0 and errors == 0 and line >= 80 and branch >= 65
          data['tests'].update({
              'passed': passed, 'failed': failures+errors, 'skipped': skipped, 'collected': total,
              'line_coverage_percent': round(line,2), 'branch_coverage_percent': round(branch,2),
              'combined_coverage_percent': round(combined,2),
              'full_regression': f'{passed} passed / {skipped} skipped / {total} collected',
              'test_environment': f'Ubuntu 24.04 · Python {platform.python_version()} · Xvfb',
          })
          gate=next(x for x in data['stable_gates'] if x['id']=='coverage_80_65')
          gate['status']='passed'
          gate['reason']=f'{line:.2f} % Zeilenabdeckung und {branch:.2f} % Branch-Abdeckung; scripts/coverage_policy.py bestanden · Workflow {os.environ["GITHUB_RUN_ID"]} · Python {platform.python_version()}.'
          data['provenance']['full_regression_run_id']=int(os.environ['GITHUB_RUN_ID'])
          data['provenance']['coverage_contract_run_id']=int(os.environ['GITHUB_RUN_ID'])
          data['release_cleanup'].update({'tracked_temp_leftovers':0,'repo_cleanup_status':'passed'})
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          start='<!-- 40d-final:start -->'; end='<!-- 40d-final:end -->'
          metric=f'{passed}/{total} Tests bestanden, {skipped} übersprungen · Coverage {line:.2f}% Zeilen / {branch:.2f}% Branch.'
          def managed(file: str, body: str):
              p=root/file; old=p.read_text(encoding='utf-8') if p.exists() else ''
              if start in old and end in old:
                  before=old.split(start,1)[0]; after=old.split(end,1)[1]
                  new=before+start+'\n'+body+'\n'+end+after
              else:
                  new=start+'\n'+body+'\n'+end+'\n\n'+old
              p.write_text(new, encoding='utf-8')
          managed('TEST_REPORT_save_.md', f'## 40D · finaler automatisierter Nachweis\n\n{metric}\n\nWayland ist gemäß Freigabeentscheidung nicht erforderlich. Der Large-Media-/Slow-Target-Soak wurde bewusst übersprungen und nicht als bestanden gewertet. Als einziges physisches Stable-Gate bleibt die KDE-X11-Zielsystem-Abnahme offen.')
          managed('TODO.md', '## 40D · finale Freigabepolitik\n\n- [x] Coverage-Vertrag 80/65.\n- [x] Interne Qualität und Architektur.\n- [x] Wayland: nicht erforderlich.\n- [x] Large-Media-/Slow-Target-Soak: bewusst übersprungen (Waiver, kein PASS).\n- [ ] Physische KDE-X11-Abnahme auf dem finalen Kandidaten.\n\n**Stable bleibt bis zur realen KDE-X11-Abnahme fail-closed.**')
          managed('RELEASE_NOTES_save_.md', f'## 2.8.3-rc25 · 40D Abschlussstand\n\n{metric}\n\nFreigabepolitik: Wayland ist nicht erforderlich; der Large-Media-/Slow-Target-Soak ist ausdrücklich waived. Physische KDE-X11-Abnahme bleibt offen.')
          PY
          python diagnostics/release_readiness/generate_from_evidence.py --write
          python scripts/render_release_docs.py --write

      - name: Remove temporary workflow and build final manifest
        run: |
          set -Eeuo pipefail
          rm .github/workflows/40d-full-project-package-temp.yml
          chmod +x schnellstart.sh
          python scripts/build_release_manifest.py
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          p=Path('diagnostics/release_readiness/RELEASE_EVIDENCE.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data['manifest']={'path':'RELEASE_MANIFEST.json','file_count':int(manifest['file_count']),'status':'passed'}
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          python diagnostics/release_readiness/generate_from_evidence.py --write
          python scripts/render_release_docs.py --write
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check
          python diagnostics/release_readiness/generate_from_evidence.py --check
          python scripts/render_release_docs.py --check
          python scripts/validate_design_manifest.py --json
          python scripts/internal_quality_gate.py
          python scripts/architecture_audit.py

      - name: Full regression B and strict measurement equality
        run: |
          set -Eeuo pipefail
          xvfb-run -a python -m pytest -q -p no:cacheprovider \
            --junitxml="$RUNNER_TEMP/b-junit.xml" \
            --cov=videobatch_fast --cov-branch --cov-fail-under=0 \
            --cov-report=json:"$RUNNER_TEMP/b-coverage.json"
          python scripts/coverage_policy.py "$RUNNER_TEMP/b-coverage.json" 80 65
          python - <<'PY'
          import json, xml.etree.ElementTree as ET, os
          from pathlib import Path
          r=Path(os.environ['RUNNER_TEMP'])
          def counts(p):
              root=ET.parse(p).getroot(); tag=root.tag.rsplit('}',1)[-1]
              suites=[root] if tag=='testsuite' else [x for x in root if x.tag.rsplit('}',1)[-1]=='testsuite']
              names=('tests','failures','errors','skipped')
              return tuple(sum(int(s.attrib.get(n,0)) for s in suites) for n in names)
          assert counts(r/'a-junit.xml') == counts(r/'b-junit.xml')
          def metrics(p):
              t=json.loads(p.read_text())['totals']
              line=int(t['covered_lines'])/int(t['num_statements'])*100
              branches=int(t.get('num_branches',0)); branch=int(t.get('covered_branches',0))/branches*100 if branches else 100.0
              return round(line,2), round(branch,2), round(float(t.get('percent_covered',0.0)),2)
          a=metrics(r/'a-coverage.json'); b=metrics(r/'b-coverage.json')
          assert a == b, (a,b)
          evidence=json.loads(Path('diagnostics/release_readiness/RELEASE_EVIDENCE.json').read_text(encoding='utf-8'))
          assert (evidence['tests']['line_coverage_percent'], evidence['tests']['branch_coverage_percent'], evidence['tests']['combined_coverage_percent']) == a
          print('FINAL_MEASUREMENTS_IDENTICAL', a)
          PY

      - name: Final repository hygiene and contract checks
        run: |
          set -Eeuo pipefail
          test ! -e .github/workflows/40d-finalize-temp.yml
          test ! -e .github/workflows/40d-full-project-package-temp.yml
          test -f schnellstart.sh
          test -x schnellstart.sh
          test -f requirements.txt
          test -f requirements.lock
          test -f requirements-quality.lock
          test -f requirements-toolchain.lock
          if git ls-files | grep -E '(^|/)(__pycache__/|.*\.(pyc|pyo|tmp)$|\.coverage$)' ; then
            echo 'TRACKED_TRANSIENT_FILE_FOUND' >&2
            exit 1
          fi
          xvfb-run -a python -m pytest -q -p no:cacheprovider tests/test_current_release_evidence_contract.py tests/test_release_docs.py
          git status --short

      - name: Commit and push verified final tree
        run: |
          set -Eeuo pipefail
          git config user.name 'pppoppi'
          git config user.email 'provoware.one@gmail.com'
          git add -A
          git commit -m 'release(40d): finalize rc25 gate policy and full project'
          git push origin HEAD:iteration/40d-coverage-contract-20260904
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build complete project ZIP from final HEAD
        run: |
          set -Eeuo pipefail
          ZIP="$RUNNER_TEMP/PROVOWARE_VideoBatch_Fast_2.8.3-rc25_40D_FULL.zip"
          git archive --format=zip --prefix='PROVOWARE_VideoBatch_Fast_2.8.3-rc25_40D_FULL/' -o "$ZIP" HEAD
          sha256sum "$ZIP" | tee "$RUNNER_TEMP/PROVOWARE_VideoBatch_Fast_2.8.3-rc25_40D_FULL.zip.sha256"
          unzip -t "$ZIP" >/dev/null
          echo 'FULL_PROJECT_ZIP_VALID'

      - name: Upload complete project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PROVOWARE_VideoBatch_Fast_2.8.3-rc25_40D_FULL
          path: |
            ${{ runner.temp }}/PROVOWARE_VideoBatch_Fast_2.8.3-rc25_40D_FULL.zip
            ${{ runner.temp }}/PROVOWARE_VideoBatch_Fast_2.8.3-rc25_40D_FULL.zip.sha256
          if-no-files-found: error
          retention-days: 14
