name: 40D temporary resource control verification

on:
  push:
    branches: [iteration/40d-coverage-contract-20260904]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 40d-resource-verify-temp
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock
      - name: Install locked toolchain
        run: python -m pip install --disable-pip-version-check --requirement requirements-toolchain.lock
      - name: Compile modified surface
        run: |
          python -m compileall -q -f \
            src/videobatch_fast/execution_control.py \
            src/videobatch_fast/system_resources.py \
            src/videobatch_fast/resource_process.py \
            src/videobatch_fast/controlled_runner.py \
            src/videobatch_fast/ui_resource_controls_mixin.py \
            src/videobatch_fast/canonical_resource_control_mixin.py \
            src/videobatch_fast/canonical_ui.py \
            src/videobatch_fast/canonical_kpi.py \
            scripts/checkpoint2_shell_smoke.py \
            scripts/validate_design_manifest.py
      - name: Run focused regression
        run: |
          python -m pytest -q \
            tests/test_resource_controls_40d.py \
            tests/test_canonical_kpi_contract.py \
            tests/test_design_manifest_contract.py
      - name: Run design contract
        run: python scripts/validate_design_manifest.py --json
      - name: Run fresh internal quality gate
        run: python scripts/internal_quality_gate.py --json
      - name: Keep verification read-only
        if: always()
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi
