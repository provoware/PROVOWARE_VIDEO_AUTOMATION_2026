name: A32.2 one-shot current evidence reconciliation

on:
  push:
    branches:
      - fix/a32-2-reconcile-current-regression-evidence

permissions:
  contents: write

concurrency:
  group: a32-2-current-evidence-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v5
        with:
          ref: fix/a32-2-reconcile-current-regression-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare pinned Python toolchain
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Install repository-locked dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-toolchain.lock

      - name: Reconcile canonical evidence and regression contract
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path.cwd()
          evidence_path = root / 'diagnostics/release_readiness/RELEASE_EVIDENCE.json'
          data = json.loads(evidence_path.read_text(encoding='utf-8'))

          provenance = data.setdefault('provenance', {})
          provenance.update({
              'current_a32_2_head': '8c6691cfaffd371d39fa5696c78f67114f83a7aa',
              'full_regression_verified_commit': '2e7d4350b0ccb0a5d0a69fa1033f0b1aded54e02',
              'full_regression_run_id': 33805992774,
              'full_regression_artifact_name': 'a32-full-suite-2e7d4350',
              'full_regression_artifact_id': 9912964969,
              'full_regression_artifact_sha256': '592d17cf5120bdd7a1920ddf8dc3e7db14f4cf7233541ea350f00da71d9b9e2a',
              'full_regression_verified_at': '2026-09-03',
          })

          tests = data['tests']
          tests.update({
              'collected': 468,
              'passed': 466,
              'failed': 0,
              'skipped': 2,
              'line_coverage_percent': 73.38,
              'branch_coverage_percent': 59.01,
              'combined_coverage_percent': 70.54,
              'full_regression': '466 passed / 2 skipped / 468 collected',
              'test_environment': 'Ubuntu 24.04.4 LTS · Python 3.12.3 · Xvfb 1920x1080x24',
          })

          matrix = data['matrix']
          matrix.update({
              'status': 'passed',
              'passed_targets': 4,
              'total_targets': 4,
              'workflow_run_id': 33806936870,
              'verified_commit': '8c6691cfaffd371d39fa5696c78f67114f83a7aa',
              'scope_note': 'Current PR #84 head; deterministic headless CI matrix, not a substitute for physical KDE acceptance.',
          })

          coverage_gate = {
              'id': 'coverage_80_65',
              'label': 'Coverage-Vertrag 80/65',
              'status': 'failed',
              'reason': '73,38 % Zeilenabdeckung bei geforderten 80,00 % und 59,01 % Branch-Abdeckung bei geforderten 65,00 %; scripts/coverage_policy.py blockiert.',
          }
          gates = [gate for gate in data['stable_gates'] if gate.get('id') != coverage_gate['id']]
          insert_at = next((i for i, gate in enumerate(gates) if gate.get('id') == 'physical_kde_x11_wayland'), len(gates))
          gates.insert(insert_at, coverage_gate)
          data['stable_gates'] = gates
          data['stable_ready'] = False

          progress = data['progress']
          progress.update({
              'percent': 90,
              'completed': 27,
              'open': 3,
              'total': 30,
              'current_todo': 'Coverage-Vertrag 80/65 schließen; danach physische KDE-Abnahme und Large-Media-Soak auf demselben finalen Kandidaten.',
          })

          evidence_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          todo_path = root / 'TODO.md'
          todo = todo_path.read_text(encoding='utf-8')
          stable_heading = '## Noch offene Stable-Gates\n\n'
          coverage_line = '- [ ] **Coverage-Vertrag 80/65:** aktuelle Messung 73,38 % Zeilen / 59,01 % Branch; Schwellen nicht absenken, sondern ungetestete kritische Pfade gezielt schließen.\n'
          if coverage_line not in todo:
              todo = todo.replace(stable_heading, stable_heading + coverage_line)
          todo_path.write_text(todo, encoding='utf-8')

          renderer_path = root / 'scripts/render_release_docs.py'
          renderer = renderer_path.read_text(encoding='utf-8')
          old = '    return f"""{README_START}\n# {version[\'name\']} · {version[\'build\']}\n\n**Kanal:** {channel}  \\n**Kanonische Quelle:** `{source}`  \\n**Freigegebener Qualitätsbericht:** `{status[\'approved_quality_report\']}`\n\n- {tests[\'passed\']}/{tests[\'passed\']} automatisierte Tests bestanden\n- {line_coverage} % Zeilenabdeckung'
          new = '    collected = int(tests.get("collected", int(tests["passed"]) + int(tests.get("failed", 0)) + int(tests.get("skipped", 0))))\n    skipped = int(tests.get("skipped", 0))\n    return f"""{README_START}\n# {version[\'name\']} · {version[\'build\']}\n\n**Kanal:** {channel}  \\n**Kanonische Quelle:** `{source}`  \\n**Freigegebener Qualitätsbericht:** `{status[\'approved_quality_report\']}`\n\n- {tests[\'passed\']}/{collected} automatisierte Tests bestanden; {skipped} übersprungen\n- {line_coverage} % Zeilenabdeckung'
          if old not in renderer:
              raise SystemExit('Renderer-Vertrag nicht an erwarteter Stelle gefunden; fail-closed.')
          renderer_path.write_text(renderer.replace(old, new, 1), encoding='utf-8')

          regression = root / 'tests/test_current_release_evidence_contract.py'
          regression.write_text('''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nEVIDENCE = ROOT / "diagnostics/release_readiness/RELEASE_EVIDENCE.json"\n\n\ndef _evidence() -> dict:\n    return json.loads(EVIDENCE.read_text(encoding="utf-8"))\n\n\ndef test_current_full_regression_is_canonical_release_evidence() -> None:\n    data = _evidence()\n    tests = data["tests"]\n    assert tests["collected"] == 468\n    assert tests["passed"] == 466\n    assert tests["failed"] == 0\n    assert tests["skipped"] == 2\n    assert tests["line_coverage_percent"] == 73.38\n    assert tests["branch_coverage_percent"] == 59.01\n    assert data["provenance"]["full_regression_run_id"] == 33805992774\n    assert data["provenance"]["full_regression_verified_commit"] == "2e7d4350b0ccb0a5d0a69fa1033f0b1aded54e02"\n\n\ndef test_coverage_policy_is_an_explicit_stable_blocker() -> None:\n    data = _evidence()\n    gate = next(item for item in data["stable_gates"] if item["id"] == "coverage_80_65")\n    assert gate["status"] == "failed"\n    assert data["stable_ready"] is False\n    assert data["progress"] == {\n        "percent": 90,\n        "completed": 27,\n        "open": 3,\n        "total": 30,\n        "current_todo": "Coverage-Vertrag 80/65 schließen; danach physische KDE-Abnahme und Large-Media-Soak auf demselben finalen Kandidaten.",\n    }\n\ndef test_readme_does_not_fall_back_to_superseded_325_test_claim() -> None:\n    readme = (ROOT / "README.md").read_text(encoding="utf-8")\n    assert "466/468 automatisierte Tests bestanden; 2 übersprungen" in readme\n    assert "73,38 % Zeilenabdeckung" in readme\n    assert "59,01 % Zweigabdeckung" in readme\n    assert "Coverage-Vertrag 80/65" in readme\n    assert "325/325 automatisierte Tests bestanden" not in readme\n''', encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          note = '''\n## A32.2 Evidence-Reconciliation · 2026-09-04\n\n- aktuellen 468-Test-Vollregressionsnachweis als kanonische Release-Evidence übernommen;\n- Coverage 73,38 % / 59,01 % als expliziten blockierenden 80/65-Gate aufgenommen;\n- README/STATUS zeigen bestandene, gesammelte und übersprungene Tests getrennt;\n- keine Produkt-/Runtime-Logik geändert.\n'''
          if '## A32.2 Evidence-Reconciliation · 2026-09-04' not in changelog:
              changelog_path.write_text(changelog.rstrip() + '\n' + note, encoding='utf-8')
          PY

          python diagnostics/release_readiness/generate_from_evidence.py --write
          python scripts/render_release_docs.py --write

      - name: Validate focused evidence and renderer contracts
        run: |
          set -Eeuo pipefail
          python -m compileall -q -f \
            diagnostics/release_readiness/generate_from_evidence.py \
            scripts/render_release_docs.py \
            tests/test_release_docs.py \
            tests/test_current_release_evidence_contract.py
          python -m pytest -q \
            tests/test_release_docs.py \
            tests/test_current_release_evidence_contract.py
          python diagnostics/release_readiness/generate_from_evidence.py --check
          python scripts/render_release_docs.py --check

      - name: Remove one-shot helper and rebuild canonical manifest
        run: |
          set -Eeuo pipefail
          rm .github/workflows/a32-2-reconcile-current-evidence-once.yml
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json
          python scripts/validate_release_manifest.py
          git diff --check

      - name: Commit canonical reconciliation result
        run: |
          set -Eeuo pipefail
          git config user.name 'provoware-release-orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --name-status
          test -n "$(git diff --cached --name-only)"
          git commit -m 'A32.2: reconcile canonical evidence with current full regression'
          git push origin HEAD:fix/a32-2-reconcile-current-regression-evidence
