name: A32.2 one-shot residual evidence reconciliation

on:
  push:
    branches:
      - fix/a32-2-reconcile-current-regression-evidence

permissions:
  contents: write

concurrency:
  group: a32-2-residual-evidence-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/a32-2-reconcile-current-regression-evidence
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock
      - name: Install locked test toolchain
        run: python -m pip install --disable-pip-version-check --requirement requirements-toolchain.lock
      - name: Remove superseded 325-test residue and align manifest count
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          evidence_path = root / 'diagnostics/release_readiness/RELEASE_EVIDENCE.json'
          data = json.loads(evidence_path.read_text(encoding='utf-8'))
          tests = data['tests']
          tests.pop('full_regression_groups', None)
          data['manifest']['file_count'] = 444
          data['provenance']['evidence_regression_method'] = (
              'legacy four deterministic pytest partitions; 325/325 passed; '
              'superseded by full_regression_run_id 33805992774'
          )
          evidence_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = root / 'tests/test_current_release_evidence_contract.py'
          test_text = test_path.read_text(encoding='utf-8')
          marker = '    assert tests["branch_coverage_percent"] == 59.01\n'
          addition = (
              '    assert "full_regression_groups" not in tests\n'
              '    assert data["manifest"]["file_count"] == 444\n'
              '    assert "superseded by full_regression_run_id 33805992774" in data["provenance"]["evidence_regression_method"]\n'
          )
          if addition not in test_text:
              if marker not in test_text:
                  raise SystemExit('Regressionstest-Anker fehlt; fail-closed.')
              test_text = test_text.replace(marker, marker + addition, 1)
          test_path.write_text(test_text, encoding='utf-8')
          PY
          python diagnostics/release_readiness/generate_from_evidence.py --write
          python scripts/render_release_docs.py --write
      - name: Validate canonical evidence
        run: |
          set -Eeuo pipefail
          python -m compileall -q -f tests/test_current_release_evidence_contract.py scripts/render_release_docs.py diagnostics/release_readiness/generate_from_evidence.py
          python -m pytest -q tests/test_release_docs.py tests/test_current_release_evidence_contract.py
          python diagnostics/release_readiness/generate_from_evidence.py --check
          python scripts/render_release_docs.py --check
      - name: Remove helper and rebuild manifest
        run: |
          set -Eeuo pipefail
          rm .github/workflows/a32-2-reconcile-residual-evidence-once.yml
          PYTHONPATH=src python scripts/build_release_manifest.py
          PYTHONPATH=src python scripts/build_release_manifest.py --check --json
          PYTHONPATH=src python scripts/validate_release_manifest.py
          python diagnostics/release_readiness/generate_from_evidence.py --check
          git diff --check
      - name: Commit residual reconciliation
        run: |
          set -Eeuo pipefail
          git config user.name 'provoware-release-orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'A32.2: remove superseded 325-test evidence residue'
          git push origin HEAD:fix/a32-2-reconcile-current-regression-evidence
