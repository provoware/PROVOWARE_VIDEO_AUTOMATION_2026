name: A32 existing-instance watchdog one-shot

on:
  push:
    branches:
      - fix/a32-2-existing-instance-watchdog-false-fatal

permissions:
  contents: write

concurrency:
  group: a32-existing-instance-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prepare pinned Python toolchain
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Install repository-locked test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-toolchain.lock

      - name: Compile touched runtime and regression files
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            scripts/debug_launcher.py \
            tests/test_startup_supervision_2_8_3_rc11.py

      - name: Run focused ownership and startup regressions
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            tests/test_startup_supervision_2_8_3_rc11.py \
            tests/test_ui_ready_handshake_contract.py \
            tests/test_debug_runtime_contract.py

      - name: Remove helper and regenerate canonical manifest
        run: |
          set -Eeuo pipefail
          rm .github/workflows/a32-existing-instance-one-shot.yml
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json

      - name: Commit final canonical tree
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'chore: finalize existing-instance watchdog fix'
          git push origin HEAD:fix/a32-2-existing-instance-watchdog-false-fatal
