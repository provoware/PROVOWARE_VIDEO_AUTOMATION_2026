name: A32 full suite after contract refresh

on:
  push:
    branches:
      - fix/a32-2-refresh-stale-contract-tests

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2e7d4350b0ccb0a5d0a69fa1033f0b1aded54e02
          fetch-depth: 1
      - name: Assert exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "2e7d4350b0ccb0a5d0a69fa1033f0b1aded54e02"
          test -z "$(git status --porcelain)"
      - name: Install test and desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ffmpeg
          python3 -m pip install --disable-pip-version-check -r requirements-toolchain.lock
      - name: Collect exact test inventory
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python3 -m pytest --collect-only -q tests | tee "$RUNNER_TEMP/pytest-collect.txt"
      - name: Run complete 468-test suite under Xvfb
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          XDG_STATE_HOME: ${{ runner.temp }}/state
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
          VIDEOBATCH_DIAGNOSTICS_DIR: ${{ runner.temp }}/diagnostics
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            python3 -m pytest -q -p no:cacheprovider \
              --cov=videobatch_fast \
              --cov-config=pyproject.toml \
              --cov-report=term-missing:skip-covered \
              --cov-report=json:"$RUNNER_TEMP/coverage.json" \
              --cov-fail-under=0 \
              tests 2>&1 | tee "$RUNNER_TEMP/full-suite.log"
          test -z "$(git status --porcelain)"
      - name: Enforce repository coverage policy
        run: python3 scripts/coverage_policy.py "$RUNNER_TEMP/coverage.json" 80 65
      - name: Run explicit GUI roundtrip
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          XDG_CONFIG_HOME: ${{ runner.temp }}/config-gui
          XDG_STATE_HOME: ${{ runner.temp }}/state-gui
          XDG_CACHE_HOME: ${{ runner.temp }}/cache-gui
        run: xvfb-run -a -s '-screen 0 1920x1080x24' python3 scripts/test_workspace_layout_profiles_gui.py | tee "$RUNNER_TEMP/gui-roundtrip.log"
      - name: Record evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/pytest-collect.txt" "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          cp "$RUNNER_TEMP/full-suite.log" "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          cp "$RUNNER_TEMP/coverage.json" "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          cp "$RUNNER_TEMP/gui-roundtrip.log" "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          echo 2e7d4350b0ccb0a5d0a69fa1033f0b1aded54e02 > "$RUNNER_TEMP/evidence/verified-candidate-sha.txt"
          echo "$GITHUB_RUN_ID" > "$RUNNER_TEMP/evidence/workflow-run-id.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a32-full-suite-2e7d4350
          path: ${{ runner.temp }}/evidence
          retention-days: 30
