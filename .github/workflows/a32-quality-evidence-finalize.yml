name: A32 quality evidence finalize

on:
  push:
    branches:
      - fix/a32-2-refresh-quality-evidence

permissions:
  contents: write

jobs:
  finalize-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: fix/a32-2-refresh-quality-evidence
          fetch-depth: 0

      - name: Assert expected candidate ancestry
        shell: bash
        run: git merge-base --is-ancestor 048aa5733d9d0ce5fef872d25e0437fae08eab94 HEAD

      - name: Refresh evidence files
        shell: bash
        run: python3 scripts/a32_quality_evidence_finalize_tmp.py

      - name: Remove temporary finalizer files
        shell: bash
        run: rm .github/workflows/a32-quality-evidence-finalize.yml scripts/a32_quality_evidence_finalize_tmp.py

      - name: Regenerate and verify canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release_manifest.py
          python3 scripts/build_release_manifest.py --check
          python3 scripts/validate_release_manifest.py

      - name: Commit final evidence tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "provoware"
          git config user.email "provoware.one@gmail.com"
          git add -A
          git status --short
          git commit -m "evidence: refresh A32 offline quality proof"
          git push origin HEAD:fix/a32-2-refresh-quality-evidence
