name: A32 refresh stale contract tests

on:
  push:
    branches:
      - fix/a32-2-refresh-stale-contract-tests

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a32-2-refresh-stale-contract-tests
          fetch-depth: 0
      - name: Apply exact stale-assertion replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "tests/test_predictive_bootstrap_2_8_3_rc10.py",
              '    launcher = (ROOT / "videobatch.sh").read_text(encoding="utf-8")\n    bootstrap = (SCRIPTS / "bootstrap.py").read_text(encoding="utf-8")\n    assert \'exec "$BOOTSTRAP_PYTHON" "$ROOT_DIR/scripts/bootstrap.py"\' in launcher\n',
              '    launcher = (ROOT / "videobatch.sh").read_text(encoding="utf-8")\n    debug_launcher = (SCRIPTS / "debug_launcher.py").read_text(encoding="utf-8")\n    bootstrap = (SCRIPTS / "bootstrap.py").read_text(encoding="utf-8")\n    assert \'exec "$BOOTSTRAP_PYTHON" "$ROOT_DIR/scripts/debug_launcher.py"\' in launcher\n    assert \'scripts/bootstrap.py\' in debug_launcher\n',
          )
          replace_exact(
              "tests/test_unified_toolchain_2_8_3_rc7.py",
              '    entry = (ROOT / "videobatch.sh").read_text(encoding="utf-8")\n    assert "scripts/toolchain.py" in entry\n    assert "scripts/bootstrap.py" in entry\n',
              '    entry = (ROOT / "videobatch.sh").read_text(encoding="utf-8")\n    debug_launcher = (ROOT / "scripts" / "debug_launcher.py").read_text(encoding="utf-8")\n    assert "scripts/toolchain.py" in entry\n    assert "scripts/debug_launcher.py" in entry\n    assert "scripts/bootstrap.py" in debug_launcher\n',
          )
          replace_exact(
              "tests/test_kubuntu_main_comment_dispatch.py",
              '    assert "--ref main" in source\n',
              '    assert "ref=main" in source\n    assert \'--ref "$REF"\' in source\n',
          )
          replace_exact(
              "tests/test_kubuntu_main_comment_dispatch.py",
              '    assert "for attempt in $(seq 1 12)" in source\n    assert "sleep 5" in source\n    assert "Run-ID war innerhalb von 60 Sekunden noch nicht abrufbar" in source\n    assert "exit 0" in source\n    assert "gh issue comment 12" in source\n    assert "Die Abschlussauswertung erfolgt automatisch" in source\n',
              '    assert "for attempt in $(seq 1 18)" in source\n    assert "sleep 5" in source\n    assert "Run nicht auffindbar" in source\n    assert "exit 1" in source\n    assert "gh issue comment 12" in source\n    assert "Der Abnahmeworkflow validiert Base- und PR-Head-SHA" in source\n',
          )
          PY
      - name: Install focused test dependency
        run: python3 -m pip install --disable-pip-version-check pytest==9.0.2
      - name: Run focused stale-contract regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python3 -m pytest -q \
            tests/test_autonomous_bootstrap_2_8_3_rc8.py \
            tests/test_predictive_bootstrap_2_8_3_rc10.py \
            tests/test_unified_toolchain_2_8_3_rc7.py \
            tests/test_kubuntu_main_comment_dispatch.py
      - name: Remove temporary helper
        run: rm .github/workflows/a32-refresh-stale-contract-tests.yml
      - name: Rebuild and verify canonical manifest
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python3 scripts/build_release_manifest.py
          python3 scripts/build_release_manifest.py --check
          python3 scripts/validate_release_manifest.py
      - name: Commit canonical test-contract refresh
        run: |
          git config user.name provoware
          git config user.email provoware.one@gmail.com
          git add -A
          git status --short
          git commit -m "test: align stale launcher and dispatch contracts"
          git push origin HEAD:fix/a32-2-refresh-stale-contract-tests
