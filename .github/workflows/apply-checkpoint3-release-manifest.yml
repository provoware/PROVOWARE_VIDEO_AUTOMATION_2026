name: Apply Checkpoint 3 release manifest once

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: apply-checkpoint3-release-manifest-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-once:
    name: Apply verified Checkpoint 3 manifest and remove one-shot workflow
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/canonical-design-manifest-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src

    steps:
      - name: Check out exact writable PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact event head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Remove this one-shot workflow before generation
        run: |
          set -Eeuo pipefail
          rm -- .github/workflows/apply-checkpoint3-release-manifest.yml

      - name: Generate and recheck final release manifest
        run: |
          set -Eeuo pipefail
          python3 scripts/build_release_manifest.py
          python3 scripts/build_release_manifest.py --check --json \
            | tee "$RUNNER_TEMP/checkpoint3-release-manifest.json"
          python3 scripts/validate_design_manifest.py --json \
            | tee "$RUNNER_TEMP/checkpoint3-design-manifest.json"
          python3 -m compileall -q -f \
            src/videobatch_fast/canonical_kpi.py \
            src/videobatch_fast/canonical_shell_chrome.py \
            src/videobatch_fast/canonical_shell_workspace.py \
            tests/test_canonical_kpi_contract.py

      - name: Commit only bounded final changes
        run: |
          set -Eeuo pipefail
          git diff --check
          git add -- RELEASE_MANIFEST.json .github/workflows/apply-checkpoint3-release-manifest.yml
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/apply-checkpoint3-release-manifest.yml"
          test "${changed[1]}" = "RELEASE_MANIFEST.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize Checkpoint 3 KPI release manifest"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
