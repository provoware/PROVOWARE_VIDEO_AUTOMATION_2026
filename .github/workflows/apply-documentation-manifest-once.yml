name: Apply documentation release manifest once

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: documentation-manifest-pr-68
  cancel-in-progress: false

jobs:
  apply:
    name: Apply exact documentation manifest and self-remove
    if: >-
      github.event.pull_request.number == 68 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/comprehensive-guidance-overhaul-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_MAIN_SHA: b9a3663a7b229ace00b43f01415ecc4d39adbe14
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src

    steps:
      - name: Fetch exact writable PR branch without external actions
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$HEAD_REF" main
          git checkout --detach "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse FETCH_HEAD)" || true
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD

      - name: Validate documentation before writing
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/validate_documentation.py src/videobatch_fast/canonical_shell_workspace.py
          python3 -m pytest -q tests/test_documentation_contract.py
          python3 scripts/validate_documentation.py --json | tee "$RUNNER_TEMP/documentation-report.json"
          python3 scripts/validate_design_manifest.py --json | tee "$RUNNER_TEMP/design-report.json"

      - name: Generate exact release manifest without this workflow
        run: |
          set -Eeuo pipefail
          rm -- .github/workflows/apply-documentation-manifest-once.yml
          python3 scripts/build_release_manifest.py
          python3 scripts/build_release_manifest.py --check --json | tee "$RUNNER_TEMP/release-manifest-report.json"

      - name: Enforce bounded two-file commit
        run: |
          set -Eeuo pipefail
          git add -A
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/apply-documentation-manifest-once.yml"
          test "${changed[1]}" = "RELEASE_MANIFEST.json"
          git diff --cached --check

      - name: Commit and push final manifest
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize documentation release manifest"
          python3 scripts/build_release_manifest.py --check --json
          git push origin "HEAD:$HEAD_REF"
