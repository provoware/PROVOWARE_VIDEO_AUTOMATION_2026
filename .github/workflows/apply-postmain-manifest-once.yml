name: Apply post-main release manifest once

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/canonical-design-manifest-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact event head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Generate final manifest without this workflow
        run: |
          set -Eeuo pipefail
          rm -- .github/workflows/apply-postmain-manifest-once.yml
          python3 scripts/build_release_manifest.py
          python3 scripts/build_release_manifest.py --check --json
          python3 scripts/validate_design_manifest.py --json

      - name: Commit exactly manifest and self-removal
        run: |
          set -Eeuo pipefail
          git add -- RELEASE_MANIFEST.json .github/workflows/apply-postmain-manifest-once.yml
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/apply-postmain-manifest-once.yml"
          test "${changed[1]}" = "RELEASE_MANIFEST.json"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize post-main Checkpoint 3 manifest"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
