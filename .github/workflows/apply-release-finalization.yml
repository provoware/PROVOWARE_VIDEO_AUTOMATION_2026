name: Apply verified RC24 finalization

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-verified-rc24-finalization
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'finalize/rc24-cleanup-verified-20260805'
    name: Apply, test, and commit final repository state
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out complete branch
        uses: actions/checkout@v4
        with:
          ref: finalize/rc24-cleanup-verified-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and verify transformation
        run: |
          set -Eeuo pipefail
          wc -c .github/scripts/finalization_payload/*.b64
          sha256sum .github/scripts/finalization_payload/*.b64
          cat .github/scripts/finalization_payload/*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > .github/scripts/apply_release_finalization.py
          echo "9595a1c969e4516200d6a6ec1f6190a57ceab797c60468f10fa658e50bd86dfd  .github/scripts/apply_release_finalization.py" \
            | sha256sum --check --strict

      - name: Apply deterministic finalization
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/apply_release_finalization.py
          rm -rf .github/scripts/finalization_payload
          test ! -e .github/workflows/repository-release-audit.yml
          test ! -e .github/workflows/apply-release-finalization.yml
          test ! -e .github/scripts/apply_release_finalization.py
          test ! -e .github/scripts/finalization_parts

      - name: Prepare validated Kubuntu dependencies
        uses: ./.github/actions/kubuntu-package-cache
        with:
          os: ubuntu-24.04
          session: x11
          mode: matrix

      - name: Start deterministic X11 display
        run: |
          set -Eeuo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Run complete finalization contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q src scripts tests
          python3 scripts/validate_text_resources.py
          python3 scripts/validate_version_contract.py
          python3 scripts/validate_release_file_status.py
          python3 scripts/render_release_docs.py --check
          python3 scripts/internal_quality_gate.py
          python3 -m pytest -q

      - name: Remove test-generated caches
        run: |
          set -Eeuo pipefail
          find . -path './.git' -prune -o -type d -name '__pycache__' -exec rm -rf {} +
          rm -rf .pytest_cache
          rm -f .coverage

      - name: Confirm repository cleanup invariants
        run: |
          set -Eeuo pipefail
          test -f START_HIER_save_.md
          test -f RELEASE_FILE_STATUS.json
          test -f VideoBatch_Fast_2.8.3-rc24_BUILD_REPORT_save_.json
          test -d docs/archive/release-history
          test ! -d tests/baselines/visual
          test -z "$(find . -path './.git' -prune -o -name '__pycache__' -print -quit)"
          test ! -e .coverage
          test ! -e .pytest_cache
          git status --short

      - name: Commit verified final state
        run: |
          set -Eeuo pipefail
          git config user.name "provoware-release-bot"
          git config user.email "provoware.one@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize RC24 release structure and interface guidance"
          git push origin HEAD:finalize/rc24-cleanup-verified-20260805
