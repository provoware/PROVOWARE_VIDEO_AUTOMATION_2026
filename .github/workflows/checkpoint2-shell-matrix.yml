name: Checkpoint 2 canonical shell matrix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/actions/kubuntu-package-cache/**
      - .github/ci/kubuntu-packages.txt
      - .github/workflows/checkpoint2-shell-matrix.yml
      - .github/workflows/design-manifest-gate.yml
      - docs/design/**
      - diagnostics/checkpoint2/**
      - diagnostics/checkpoint3/**
      - registries/RUNTIME_ERROR_REGISTRY.json
      - scripts/checkpoint2_shell_smoke.py
      - scripts/validate_design_manifest.py
      - src/videobatch_fast/app.py
      - src/videobatch_fast/canonical_*.py
      - src/videobatch_fast/error_handling.py
      - src/videobatch_fast/runtime_error_*.py
      - src/videobatch_fast/theme.py
      - src/videobatch_fast/ui*.py
      - tests/test_design_manifest_contract.py
      - tests/test_canonical_application_shell_contract.py
      - tests/test_canonical_kpi_contract.py
      - tests/test_runtime_error_hardening.py
      - RELEASE_MANIFEST.json

permissions:
  contents: read
  actions: read

concurrency:
  group: checkpoint2-shell-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Checkpoint 2 read-only preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare pinned Python toolchain
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Install repository-locked test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-toolchain.lock

      - name: Generate exact expected release manifest evidence
        run: |
          set -Eeuo pipefail
          current="$RUNNER_TEMP/RELEASE_MANIFEST.current.json"
          expected="$RUNNER_TEMP/RELEASE_MANIFEST.expected.json"
          cp RELEASE_MANIFEST.json "$current"
          restore_manifest() {
            cp "$current" RELEASE_MANIFEST.json
          }
          trap restore_manifest EXIT
          python scripts/build_release_manifest.py
          cp RELEASE_MANIFEST.json "$expected"
          restore_manifest
          trap - EXIT
          cmp -s RELEASE_MANIFEST.json "$current"

      - name: Upload expected release manifest evidence
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint2-expected-release-manifest
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/RELEASE_MANIFEST.expected.json

      - name: Compile and validate contracts
        run: |
          set -Eeuo pipefail
          python -m compileall -q -f \
            src/videobatch_fast/app.py \
            src/videobatch_fast/canonical_ui.py \
            src/videobatch_fast/canonical_kpi.py \
            src/videobatch_fast/canonical_kpi_state.py \
            src/videobatch_fast/canonical_kpi_detail_mixin.py \
            src/videobatch_fast/canonical_shell_contract.py \
            src/videobatch_fast/canonical_shell_chrome.py \
            src/videobatch_fast/canonical_shell_workspace.py \
            src/videobatch_fast/error_handling.py \
            src/videobatch_fast/runtime_error_guidance.py \
            src/videobatch_fast/runtime_error_hooks.py \
            scripts/checkpoint2_shell_smoke.py \
            scripts/validate_design_manifest.py \
            tests/test_design_manifest_contract.py \
            tests/test_canonical_application_shell_contract.py \
            tests/test_canonical_kpi_contract.py \
            tests/test_runtime_error_hardening.py
          python -m pytest -q \
            tests/test_canonical_kpi_contract.py \
            tests/test_runtime_error_hardening.py
          python scripts/validate_design_manifest.py --json \
            | tee "$RUNNER_TEMP/design-manifest.json"
          python scripts/build_release_manifest.py --check --json \
            | tee "$RUNNER_TEMP/release-manifest.json"

      - name: Prove preflight remained read-only
        if: always()
        run: |
          set -Eeuo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error title=Checkpoint 2 preflight wrote repository files::The checkout must remain unchanged."
            exit 1
          fi

  shell-matrix:
    name: ${{ matrix.os }} / ${{ matrix.session }} / canonical shell
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        session: [x11, wayland]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      XDG_SESSION_TYPE: ${{ matrix.session }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare cached Kubuntu dependencies
        uses: ./.github/actions/kubuntu-package-cache
        with:
          os: ${{ matrix.os }}
          session: ${{ matrix.session }}
          mode: matrix

      - name: Start deterministic display
        run: |
          set -Eeuo pipefail
          if [[ "${{ matrix.session }}" == "wayland" ]]; then
            mkdir -p "$RUNNER_TEMP/xdg"
            chmod 700 "$RUNNER_TEMP/xdg"
            XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" weston \
              --backend=headless-backend.so \
              --socket=wayland-vb \
              --idle-time=0 >/tmp/weston.log 2>&1 &
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
            echo "WAYLAND_DISPLAY=wayland-vb" >> "$GITHUB_ENV"
          fi
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp \
            >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Run focused contract tests
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q \
            tests/test_design_manifest_contract.py \
            tests/test_canonical_application_shell_contract.py \
            tests/test_canonical_kpi_contract.py \
            tests/test_runtime_error_hardening.py

      - name: Exercise canonical shell and recovery sequence
        run: |
          set -Eeuo pipefail
          python3 scripts/checkpoint2_shell_smoke.py

      - name: Collect exact cell evidence
        if: always()
        env:
          CELL_OS: ${{ matrix.os }}
          CELL_SESSION: ${{ matrix.session }}
          CELL_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          mkdir -p checkpoint2-logs
          test ! -f /tmp/xvfb.log || cp /tmp/xvfb.log checkpoint2-logs/xvfb.log
          test ! -f /tmp/weston.log || cp /tmp/weston.log checkpoint2-logs/weston.log
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "os": os.environ["CELL_OS"],
              "session": os.environ["CELL_SESSION"],
              "status": os.environ["CELL_STATUS"],
              "head_sha": os.environ["EXPECTED_HEAD_SHA"],
          }
          target = Path(
              f"checkpoint2-logs/matrix-status-{payload['os']}-{payload['session']}.json"
          )
          target.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint2-${{ matrix.os }}-${{ matrix.session }}
          if-no-files-found: error
          retention-days: 14
          path: checkpoint2-logs/*

  matrix-summary:
    name: Checkpoint 2 canonical shell matrix
    if: always()
    needs: [preflight, shell-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREFLIGHT_RESULT: ${{ needs.preflight.result }}
      MATRIX_RESULT: ${{ needs.shell-matrix.result }}

    steps:
      - name: Download four-cell evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: checkpoint2-ubuntu-*
          path: matrix-evidence
          merge-multiple: true

      - name: Enforce exact four-cell success on one head
        id: gate
        run: |
          set -Eeuo pipefail
          mkdir -p matrix-summary
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              ("ubuntu-22.04", "x11"),
              ("ubuntu-22.04", "wayland"),
              ("ubuntu-24.04", "x11"),
              ("ubuntu-24.04", "wayland"),
          }
          records = {}
          for path in Path("matrix-evidence").glob("matrix-status-*.json"):
              value = json.loads(path.read_text(encoding="utf-8"))
              records[(value["os"], value["session"])] = value
          missing = sorted(expected - set(records))
          failed = sorted(
              key for key, value in records.items()
              if value.get("status") != "success"
          )
          wrong_head = sorted(
              key for key, value in records.items()
              if value.get("head_sha") != os.environ["EXPECTED_HEAD_SHA"]
          )
          passed = (
              os.environ["PREFLIGHT_RESULT"] == "success"
              and os.environ["MATRIX_RESULT"] == "success"
              and not missing
              and not failed
              and not wrong_head
          )
          summary = {
              "schema_version": 2,
              "status": "passed" if passed else "failed",
              "head_sha": os.environ["EXPECTED_HEAD_SHA"],
              "preflight": os.environ["PREFLIGHT_RESULT"],
              "matrix": os.environ["MATRIX_RESULT"],
              "missing_cells": [list(item) for item in missing],
              "failed_cells": [list(item) for item in failed],
              "wrong_head_cells": [list(item) for item in wrong_head],
              "cells": [records[key] for key in sorted(records)],
          }
          Path("matrix-summary/checkpoint2-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if not passed:
              raise SystemExit(1)
          PY

      - name: Upload consolidated matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint2-matrix-summary
          if-no-files-found: error
          retention-days: 14
          path: matrix-summary/*

  one-shot-manifest-sync:
    name: One-shot release manifest sync
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Check out writable PR branch with parent
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          persist-credentials: true

      - name: Prepare pinned Python toolchain
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Install repository-locked manifest dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-toolchain.lock

      - name: Generate manifest against final read-only workflow and push manifest only
        run: |
          set -Eeuo pipefail
          git show HEAD^:.github/workflows/checkpoint2-shell-matrix.yml \
            > .github/workflows/checkpoint2-shell-matrix.yml
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE_MANIFEST.json
          if git diff --cached --quiet; then
            echo "No manifest synchronization changes were required."
            exit 0
          fi
          git commit -m "A32.2: synchronize 443-file release manifest"
          git push origin "HEAD:${HEAD_BRANCH}"
