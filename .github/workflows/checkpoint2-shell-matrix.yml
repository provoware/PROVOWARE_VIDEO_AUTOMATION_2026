name: Checkpoint 2 canonical shell matrix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/actions/kubuntu-package-cache/**
      - .github/ci/kubuntu-packages.txt
      - .github/workflows/checkpoint2-shell-matrix.yml
      - .github/workflows/design-manifest-gate.yml
      - docs/design/**
      - diagnostics/checkpoint2/**
      - diagnostics/checkpoint3/**
      - scripts/validate_design_manifest.py
      - src/videobatch_fast/app.py
      - src/videobatch_fast/canonical_*.py
      - src/videobatch_fast/theme.py
      - src/videobatch_fast/ui*.py
      - tests/test_design_manifest_contract.py
      - tests/test_canonical_application_shell_contract.py
      - tests/test_canonical_kpi_contract.py
      - RELEASE_MANIFEST.json

permissions:
  contents: read
  actions: read

concurrency:
  group: checkpoint2-shell-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Checkpoint 2 read-only preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install exact test runner
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check pytest==9.0.2
          python3 -m pytest --version | grep -F 'pytest 9.0.2'

      - name: Compile and validate contracts
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q -f \
            src/videobatch_fast/app.py \
            src/videobatch_fast/canonical_ui.py \
            src/videobatch_fast/canonical_kpi.py \
            src/videobatch_fast/canonical_kpi_state.py \
            src/videobatch_fast/canonical_kpi_detail_mixin.py \
            src/videobatch_fast/canonical_shell_contract.py \
            src/videobatch_fast/canonical_shell_chrome.py \
            src/videobatch_fast/canonical_shell_workspace.py \
            scripts/validate_design_manifest.py \
            tests/test_design_manifest_contract.py \
            tests/test_canonical_application_shell_contract.py \
            tests/test_canonical_kpi_contract.py
          python3 -m pytest -q tests/test_canonical_kpi_contract.py
          python3 scripts/validate_design_manifest.py --json \
            | tee "$RUNNER_TEMP/design-manifest.json"
          python3 scripts/build_release_manifest.py --check --json \
            | tee "$RUNNER_TEMP/release-manifest.json"

      - name: Prove preflight remained read-only
        if: always()
        run: |
          set -Eeuo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error title=Checkpoint 2 preflight wrote repository files::The checkout must remain unchanged."
            exit 1
          fi

  shell-matrix:
    name: ${{ matrix.os }} / ${{ matrix.session }} / canonical shell
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        session: [x11, wayland]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      XDG_SESSION_TYPE: ${{ matrix.session }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare cached Kubuntu dependencies
        uses: ./.github/actions/kubuntu-package-cache
        with:
          os: ${{ matrix.os }}
          session: ${{ matrix.session }}
          mode: matrix

      - name: Install exact test runner
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check pytest==9.0.2
          python3 -m pytest --version | grep -F 'pytest 9.0.2'

      - name: Start deterministic display
        run: |
          set -Eeuo pipefail
          if [[ "${{ matrix.session }}" == "wayland" ]]; then
            mkdir -p "$RUNNER_TEMP/xdg"
            chmod 700 "$RUNNER_TEMP/xdg"
            XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" weston \
              --backend=headless-backend.so \
              --socket=wayland-vb \
              --idle-time=0 >/tmp/weston.log 2>&1 &
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
            echo "WAYLAND_DISPLAY=wayland-vb" >> "$GITHUB_ENV"
          fi
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp \
            >/tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 2

      - name: Run focused contract tests
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q \
            tests/test_design_manifest_contract.py \
            tests/test_canonical_application_shell_contract.py \
            tests/test_canonical_kpi_contract.py

      - name: Launch and exercise canonical shell at minimum size
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          from tkinter import Tk

          from videobatch_fast.canonical_shell_contract import (
              CANONICAL_THEME_LABELS,
              FONT_PROFILES,
              SHELL_NAVIGATION,
          )
          from videobatch_fast.canonical_ui import CanonicalVideoBatchFastUI

          class FakeRetryStore:
              def __init__(self, source: Path, *, enabled: bool = True) -> None:
                  self.path = Path("retry-evidence") / "retry_queue.json"
                  self._entry = {
                      "state": "failed",
                      "retry_allowed": True,
                      "audio": str(source),
                      "media": str(source),
                      "media_sequence": [],
                      "latest_error": "Encoder meldet kontrollierten Testfehler",
                      "first_error": "Encoder meldet kontrollierten Testfehler",
                  }
                  self.enabled = enabled

              def summary(self):
                  return SimpleNamespace(
                      retryable=1 if self.enabled else 0,
                      blocked=0,
                      total=1 if self.enabled else 0,
                  )

              def entries(self):
                  return (self._entry,) if self.enabled else ()

              def eligible_entries(self):
                  return (self._entry,) if self.enabled else ()

          root = Tk()
          root.geometry("1024x680")
          app = CanonicalVideoBatchFastUI(root)
          root.update_idletasks()
          existing = Path("README.md")
          missing = Path("checkpoint3-intentionally-missing-source.png")
          app._kpi_retry_store = FakeRetryStore(existing, enabled=False)
          app.audios = []
          app.media = []
          app.jobs = []
          app.last_results = []
          app._refresh_kpi_cards()

          assert root.minsize() == (1024, 680)
          assert len(app._shell_nav_buttons) == len(SHELL_NAVIGATION)
          assert len(app._shell_action_buttons) == 7
          assert len(app._shell_kpi_buttons) == 4
          assert len(app._shell_kpi_cause_vars) == 4
          assert len(app._shell_kpi_updated_vars) == 4
          assert app.main_notebook.index("end") == 6
          assert app._shell_kpi_status_vars["media"].get() == "Leer"
          assert str(app._shell_kpi_buttons["scheduler"].cget("state")) == "disabled"

          for key, page_index in (("media", 1), ("queue", 4), ("effects", 3)):
              app._shell_kpi_buttons[key].invoke()
              root.update_idletasks()
              assert app.main_notebook.index(app.main_notebook.select()) == page_index

          app.audios = [existing]
          app.media = [missing]
          app.jobs = []
          app.last_results = []
          app._refresh_kpi_cards()
          assert app._shell_kpi_status_vars["media"].get() == "Wiederherstellung nötig"
          assert "nicht mehr vorhanden" in app._shell_kpi_cause_vars["media"].get()
          assert app._shell_kpi_buttons["media"].cget("text") == "Fehlende entfernen"
          app._shell_kpi_buttons["media"].invoke()
          root.update_idletasks()
          assert missing not in app.media

          app._kpi_retry_store = FakeRetryStore(existing, enabled=True)
          app.audios = [existing]
          app.media = [existing]
          app.jobs = [object()]
          app.last_results = [SimpleNamespace(success=False, message="Encoder meldet kontrollierten Testfehler")]
          app._refresh_kpi_cards()
          assert app._shell_kpi_status_vars["queue"].get() == "Wiederherstellung nötig"
          assert "Encoder" in app._shell_kpi_cause_vars["queue"].get()
          assert app._shell_kpi_buttons["queue"].cget("text") == "Wiederanlauf laden"
          app._shell_kpi_buttons["queue"].invoke()
          root.update_idletasks()
          assert app.main_notebook.index(app.main_notebook.select()) == 4
          assert existing in app.audios and existing in app.media

          app.visual_effect.set("ungueltiger-effekt")
          app.transition.set("none")
          app._refresh_kpi_cards()
          assert app._shell_kpi_status_vars["effects"].get() == "Wiederherstellung nötig"
          assert app._shell_kpi_buttons["effects"].cget("text") == "Automatik herstellen"
          app._shell_kpi_buttons["effects"].invoke()
          root.update_idletasks()
          assert app.quick_mode.get() == "smart_auto"
          assert app.visual_effect.get() == "none"
          assert app.transition.get() == "none"

          app._kpi_retry_store = FakeRetryStore(existing, enabled=False)
          for index in range(160):
              phase = index % 4
              app.last_results = []
              app.jobs = []
              app.visual_effect.set("none")
              app.transition.set("none")
              if phase == 0:
                  app.audios = [existing]
                  app.media = [existing]
                  app.jobs = [object()]
              elif phase == 1:
                  app.audios = [existing]
                  app.media = [missing]
              elif phase == 2:
                  app.audios = [existing]
                  app.media = [existing]
                  app.jobs = [object()]
                  app.last_results = [SimpleNamespace(success=False, message="Schneller Queue-Testfehler")]
              else:
                  app.audios = [existing]
                  app.media = [existing]
                  app.visual_effect.set("hardtechno" if index % 8 else "ungueltig")
              app._refresh_kpi_cards()
              root.update_idletasks()

          history_before = dict(app._kpi_detail_history["media"])
          app._refresh_kpi_cards()
          assert app._kpi_detail_history["media"]["updated_at"] == history_before["updated_at"]
          persisted = app._collect_project_state()["meta"]["canonical_kpi"]
          assert set(persisted) == {"media", "queue", "effects", "scheduler"}
          assert all(value["updated_at"] for value in persisted.values())

          for page_index in range(6):
              app._select_shell_page(page_index)
              root.update_idletasks()
              assert app.main_notebook.index(app.main_notebook.select()) == page_index

          for theme_id, label in CANONICAL_THEME_LABELS.items():
              app._set_canonical_theme(theme_id)
              root.update_idletasks()
              assert app.theme_name.get() == theme_id
              assert app.shell_theme_combo.get() == label

          for label, scale in FONT_PROFILES.items():
              app._set_global_zoom(scale)
              root.update_idletasks()
              assert app.global_font_scale.get() == scale
              assert app._font_profile_for_scale(scale) == label

          root.update_idletasks()
          assert root.winfo_width() >= 1024
          assert root.winfo_height() >= 680
          root.destroy()
          print("CHECKPOINT2_CANONICAL_SHELL_OK")
          print("CHECKPOINT3_KPI_DETAIL_RECOVERY_SEQUENCE_OK")
          PY

      - name: Collect exact cell evidence
        if: always()
        env:
          CELL_OS: ${{ matrix.os }}
          CELL_SESSION: ${{ matrix.session }}
          CELL_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          mkdir -p checkpoint2-logs
          test ! -f /tmp/xvfb.log || cp /tmp/xvfb.log checkpoint2-logs/xvfb.log
          test ! -f /tmp/weston.log || cp /tmp/weston.log checkpoint2-logs/weston.log
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "os": os.environ["CELL_OS"],
              "session": os.environ["CELL_SESSION"],
              "status": os.environ["CELL_STATUS"],
              "head_sha": os.environ["EXPECTED_HEAD_SHA"],
          }
          target = Path(
              f"checkpoint2-logs/matrix-status-{payload['os']}-{payload['session']}.json"
          )
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint2-${{ matrix.os }}-${{ matrix.session }}
          if-no-files-found: error
          retention-days: 14
          path: checkpoint2-logs/*

  matrix-summary:
    name: Checkpoint 2 canonical shell matrix
    if: always()
    needs: [preflight, shell-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREFLIGHT_RESULT: ${{ needs.preflight.result }}
      MATRIX_RESULT: ${{ needs.shell-matrix.result }}

    steps:
      - name: Download four-cell evidence
        uses: actions/download-artifact@v4
        with:
          pattern: checkpoint2-ubuntu-*
          path: matrix-evidence
          merge-multiple: true

      - name: Enforce exact four-cell success on one head
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              ("ubuntu-22.04", "x11"),
              ("ubuntu-22.04", "wayland"),
              ("ubuntu-24.04", "x11"),
              ("ubuntu-24.04", "wayland"),
          }
          records = {}
          for path in Path("matrix-evidence").glob("matrix-status-*.json"):
              value = json.loads(path.read_text(encoding="utf-8"))
              records[(value["os"], value["session"])] = value
          missing = sorted(expected - set(records))
          failed = sorted(key for key, value in records.items() if value.get("status") != "success")
          wrong_head = sorted(
              key for key, value in records.items()
              if value.get("head_sha") != os.environ["EXPECTED_HEAD_SHA"]
          )
          passed = (
              os.environ["PREFLIGHT_RESULT"] == "success"
              and os.environ["MATRIX_RESULT"] == "success"
              and not missing
              and not failed
              and not wrong_head
          )
          summary = {
              "schema_version": 1,
              "status": "passed" if passed else "failed",
              "head_sha": os.environ["EXPECTED_HEAD_SHA"],
              "preflight": os.environ["PREFLIGHT_RESULT"],
              "matrix": os.environ["MATRIX_RESULT"],
              "missing": missing,
              "failed": failed,
              "wrong_head": wrong_head,
              "results": [records[key] for key in sorted(records)],
          }
          Path("CHECKPOINT2_CANONICAL_SHELL_MATRIX.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          lines = [
              "# Checkpoint 2 canonical shell matrix",
              "",
              f"**Status:** {summary['status']}",
              f"**Head:** `{summary['head_sha']}`",
              "",
          ]
          for key in sorted(expected):
              value = records.get(key, {"status": "missing"})
              lines.append(f"- {key[0]} / {key[1]}: {value['status']}")
          report = "\n".join(lines) + "\n"
          Path("CHECKPOINT2_CANONICAL_SHELL_MATRIX.md").write_text(report, encoding="utf-8")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(report, encoding="utf-8")
          raise SystemExit(0 if passed else 1)
          PY

      - name: Upload consolidated matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint2-canonical-shell-matrix-${{ github.event.pull_request.head.sha }}
          if-no-files-found: error
          retention-days: 30
          path: CHECKPOINT2_CANONICAL_SHELL_MATRIX.*