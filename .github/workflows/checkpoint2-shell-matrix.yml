name: Checkpoint 2 canonical shell matrix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/checkpoint2-shell-matrix.yml
      - .github/workflows/design-manifest-gate.yml
      - docs/design/**
      - docs/KUBUNTU_26_04_WAYLAND.md
      - diagnostics/checkpoint2/**
      - diagnostics/checkpoint3/**
      - scripts/validate_design_manifest.py
      - src/videobatch_fast/qt_*.py
      - src/videobatch_fast/platform_integration.py
      - src/videobatch_fast/workflow_layout.py
      - tests/test_design_manifest_contract.py
      - tests/test_qt_phase3_contract.py
      - tests/test_tk_free_core_contract.py
      - tests/qt_phase3_smoke.py
      - PLATFORM_SUPPORT.json
      - RELEASE_MANIFEST.json
      - requirements-qt.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: checkpoint2-shell-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONPATH: src

jobs:
  preflight:
    name: Checkpoint 2 read-only preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install locked validation toolchain
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input -r requirements-toolchain.lock

      - name: Compile and validate target contracts
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q -f \
            src/videobatch_fast/qt_ui.py \
            src/videobatch_fast/qt_phase2.py \
            src/videobatch_fast/qt_phase3.py \
            src/videobatch_fast/platform_integration.py \
            src/videobatch_fast/workflow_layout.py \
            tests/test_tk_free_core_contract.py
          python3 -m pytest -q \
            tests/test_design_manifest_contract.py \
            tests/test_qt_phase3_contract.py \
            tests/test_tk_free_core_contract.py
          python3 scripts/validate_design_manifest.py --json
          python3 scripts/build_release_manifest.py --check --json

      - name: Prove preflight remained read-only
        if: always()
        run: |
          set -Eeuo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error title=Checkpoint preflight wrote repository files::The checkout must remain unchanged."
            exit 1
          fi

  wayland-shell:
    name: Kubuntu 26.04 / Wayland / Qt canonical shell
    needs: preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      XDG_SESSION_TYPE: wayland
      XDG_CURRENT_DESKTOP: KDE
      DESKTOP_SESSION: plasmawayland
      QT_QPA_PLATFORM: wayland
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install native Qt Wayland runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            weston \
            wl-clipboard \
            xdg-utils \
            xdg-desktop-portal \
            xdg-desktop-portal-kde \
            libegl1 \
            libgl1 \
            libfontconfig1 \
            libwayland-client0 \
            libxkbcommon0
          python3 -m pip install -r requirements-qt.txt
          python3 -m pip install pytest==8.4.2

      - name: Start headless native Wayland compositor
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-checkpoint" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" weston \
            --backend=headless-backend.so \
            --socket=wayland-checkpoint \
            --idle-time=0 >/tmp/weston-checkpoint.log 2>&1 &
          for _ in $(seq 1 20); do
            test -S "$RUNNER_TEMP/xdg/wayland-checkpoint" && exit 0
            sleep 0.25
          done
          cat /tmp/weston-checkpoint.log
          exit 1

      - name: Prove target and Tk-free core
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$VERSION_ID" = "26.04"
          python3 -m pytest -q \
            tests/test_platform_integration.py \
            tests/test_tk_free_core_contract.py

      - name: Prove native Qt Wayland backend
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import sys
          from PySide6.QtWidgets import QApplication

          app = QApplication([])
          backend = app.platformName().lower()
          print(f"QT_QPA_BACKEND={backend}")
          assert "wayland" in backend, backend
          assert "tkinter" not in sys.modules
          app.quit()
          PY

      - name: Exercise Phase 3 Qt shell
        run: python3 tests/qt_phase3_smoke.py

      - name: Upload Wayland evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint2-kubuntu-26-04-wayland
          path: /tmp/weston-checkpoint.log
          if-no-files-found: warn
          retention-days: 14

  matrix-summary:
    name: Checkpoint 2 canonical shell matrix
    if: always()
    needs: [preflight, wayland-shell]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      PREFLIGHT_RESULT: ${{ needs.preflight.result }}
      WAYLAND_RESULT: ${{ needs.wayland-shell.result }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Enforce sole supported shell target
        run: |
          set -Eeuo pipefail
          test "$PREFLIGHT_RESULT" = success
          test "$WAYLAND_RESULT" = success
          {
            echo '# Checkpoint 2 canonical shell'
            echo
            echo '🟢 Kubuntu 26.04 LTS · KDE Plasma · Qt 6 · natives Wayland bestanden.'
            echo
            echo "Head: \`$EXPECTED_HEAD_SHA\`"
            echo 'X11, Ubuntu 22.04/24.04 und Tkinter sind keine Supportziele mehr.'
          } | tee "$GITHUB_STEP_SUMMARY"
