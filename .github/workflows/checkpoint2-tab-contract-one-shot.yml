name: One-shot checkpoint2 tab contract repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: checkpoint2-tab-contract-one-shot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true

      - name: Repair exact tab contract and regenerate manifest
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/checkpoint2-shell-matrix.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '          assert app.main_notebook.index("end") == 6\n'
          new = '''          notebook_tabs = tuple(\n              app.main_notebook.tab(index, "text")\n              for index in range(app.main_notebook.index("end"))\n          )\n          assert notebook_tabs == (\n              "Dashboard",\n              "Medien",\n              "Vorschau",\n              "Effekte",\n              "Queue",\n              "Hilfe",\n          ), notebook_tabs\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one legacy notebook-count assertion')
          workflow.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/checkpoint2-tab-contract-one-shot.yml
          python3 scripts/build_release_manifest.py
          python3 scripts/build_release_manifest.py --check --json
          git diff --check
          git add .github/workflows/checkpoint2-shell-matrix.yml RELEASE_MANIFEST.json .github/workflows/checkpoint2-tab-contract-one-shot.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: verify exact canonical notebook tab contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
