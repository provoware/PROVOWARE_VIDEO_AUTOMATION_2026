name: CP-09 FFmpeg evidence audit

on:
  pull_request:
    paths:
      - "tests/test_cp09_ffmpeg_evidence.py"
      - ".github/workflows/cp09-ffmpeg-evidence.yml"
      - "src/videobatch_fast/runner.py"
      - "src/videobatch_fast/runner_process.py"
      - "src/videobatch_fast/retry_policy.py"
      - "src/videobatch_fast/probe.py"
      - "src/videobatch_fast/qt_ui.py"
      - "scripts/sha256_contract.py"
      - "scripts/test_dependency_scope.py"
      - "scripts/test_evidence_registry.py"
      - "registries/TEST_EVIDENCE_POLICY.json"
      - "tests/test_sha256_dependency_scope.py"
      - "tests/test_test_evidence_registry.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test runner only
        run: python -m pip install pytest
      - name: Compile evidence boundary
        run: python -m compileall -q src/videobatch_fast tests/test_cp09_ffmpeg_evidence.py
      - name: Run CP-09 evidence probes
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_cp09_ffmpeg_evidence.py

      - name: Verify SHA-256 and development evidence contracts
        env:
          PYTHONPATH: src
        run: python -m pytest -q -p no:cacheprovider tests/test_sha256_dependency_scope.py tests/test_test_evidence_registry.py tests/test_project_file_index.py

      - name: Check developer docs and migration contracts
        env:
          PYTHONPATH: src
        run: |
          python scripts/validate_documentation.py
          python scripts/project_file_index.py --audit-migration --json
          python -m pytest -q -p no:cacheprovider tests/test_root_migration_contract.py tests/test_documentation_contract.py
          bash -n STARTEN.sh start.sh videobatch.sh setup.sh test.sh verify_release.sh
      - name: Inspect declared dependency graphs
        run: |
          python scripts/test_dependency_scope.py file_index --imports
          python scripts/test_dependency_scope.py docs_validation --imports
          python scripts/test_dependency_scope.py root_migration --imports
          python scripts/test_dependency_scope.py media_preflight --imports
          python scripts/test_dependency_scope.py error_explanation --imports

      - name: Check non-releasing startup and install contracts
        run: |
          bash -n autoinstall.sh PORTABLE_BAUEN.sh FINALISIEREN.sh quality.sh runtime-toolchain.sh
          python -m compileall -q scripts/sha256_contract.py scripts/test_dependency_scope.py scripts/test_evidence_registry.py
          python -m pytest -q -p no:cacheprovider tests/test_repository_finalization.py tests/test_release_docs.py

      - name: Prove actual opt-in reuse and dirty-tree rerun
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          XDG_STATE_HOME: ${{ runner.temp }}/vb-evidence-check
        run: |
          set -euo pipefail
          python scripts/test_evidence_registry.py run file_index --reuse > first.txt
          grep -q "PRÜFSTATUS · file_index: passed" first.txt
          python scripts/test_evidence_registry.py run file_index --reuse > second.txt
          grep -q "REUSED · file_index" second.txt
          printf '\n# temporary negative-test mutation\n' >> tests/test_project_file_index.py
          python scripts/test_evidence_registry.py run file_index --reuse > changed.txt
          grep -q "PRÜFSTATUS · file_index: passed" changed.txt
          if grep -q "REUSED · file_index" changed.txt; then
            echo "ERROR: dirty code was reused" >&2
            exit 1
          fi
          git checkout -- tests/test_project_file_index.py
          python scripts/test_evidence_registry.py run file_index --reuse > restored.txt
          grep -q "PRÜFSTATUS · file_index: passed" restored.txt
          python scripts/test_evidence_registry.py run file_index --reuse > final.txt
          grep -q "REUSED · file_index" final.txt
          echo "First: passed; identical: reused; modified: rerun; restored: rerun; final: reused."
