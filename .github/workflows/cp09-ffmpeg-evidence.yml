name: CP-09 FFmpeg evidence audit

on:
  pull_request:
    paths:
      - "tests/test_cp09_ffmpeg_evidence.py"
      - ".github/workflows/cp09-ffmpeg-evidence.yml"
      - "src/videobatch_fast/runner.py"
      - "src/videobatch_fast/runner_process.py"
      - "src/videobatch_fast/retry_policy.py"
      - "src/videobatch_fast/probe.py"
      - "src/videobatch_fast/qt_ui.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test runner only
        run: python -m pip install pytest
      - name: Compile evidence boundary
        run: python -m compileall -q src/videobatch_fast tests/test_cp09_ffmpeg_evidence.py
      - name: Run CP-09 evidence probes
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_cp09_ffmpeg_evidence.py
