name: Repository merge preflight

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility-preflight:
    # Legacy context name retained temporarily because the current main rule expects it.
    name: Design manifest contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact test runner
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check pytest==9.0.2
          python3 -m pytest --version | grep -F 'pytest 9.0.2'

      - name: Compile changed contracts
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/validate_documentation.py \
            src/videobatch_fast/canonical_shell_workspace.py \
            src/videobatch_fast/support_bundle.py \
            tests/test_documentation_contract.py \
            tests/test_safe_mode_support_bundle.py

      - name: Run documentation contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q tests/test_documentation_contract.py
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_docs="$(git diff --name-only "$BASE_SHA"...HEAD -- '*.md' 'docs/DOCUMENTATION_CLASSIFICATION.json')"
            if [[ -z "$changed_docs" ]]; then
              echo 'DOKUMENTATION PR-SCOPE BESTANDEN · keine Dokumentationsdatei geändert'
              exit 0
            fi
            printf '%s\n' "$changed_docs"
          fi
          python3 scripts/validate_documentation.py --json

      - name: Run Safe-Mode support bundle contract
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q tests/test_safe_mode_support_bundle.py

      - name: Verify release manifest
        id: release_manifest
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          python3 scripts/build_release_manifest.py --check --json \
            | tee "$RUNNER_TEMP/release-manifest-check.json"

      - name: Build expected manifest candidate on drift
        if: steps.release_manifest.outcome == 'failure'
        run: |
          set -Eeuo pipefail
          candidate="$RUNNER_TEMP/release-manifest-candidate"
          mkdir -p "$candidate"
          git archive HEAD | tar -x -C "$candidate"
          (
            cd "$candidate"
            PYTHONPATH=src python3 scripts/build_release_manifest.py
          )
          cp "$candidate/RELEASE_MANIFEST.json" "$RUNNER_TEMP/RELEASE_MANIFEST.candidate.json"

      - name: Upload expected manifest candidate
        if: steps.release_manifest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/RELEASE_MANIFEST.candidate.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce release manifest
        if: steps.release_manifest.outcome == 'failure'
        run: |
          echo '::error title=Release manifest drift::Use the generated candidate only after reviewing the final source tree.'
          exit 1

      - name: Package exact project snapshot
        if: steps.release_manifest.outcome == 'success'
        run: |
          set -Eeuo pipefail
          git archive \
            --format=zip \
            --prefix=PROVOWARE_VIDEO_AUTOMATION_2026/ \
            --output="$RUNNER_TEMP/PROVOWARE_VIDEO_AUTOMATION_2026-${{ github.event.pull_request.head.sha || github.sha }}.zip" \
            HEAD

      - name: Upload exact project snapshot
        if: steps.release_manifest.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: project-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/PROVOWARE_VIDEO_AUTOMATION_2026-${{ github.event.pull_request.head.sha || github.sha }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Prove preflight remained read-only
        if: always()
        run: |
          set -Eeuo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error title=Preflight wrote repository files::The compatibility preflight must remain read-only."
            exit 1
          fi