name: Repository merge preflight

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: repository-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility-preflight:
    name: Design manifest contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - name: Check out exact PR head with push credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Restore canonical preflight and synchronize full manifest
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -Eeuo pipefail
          test -n "$HEAD_BRANCH"
          git show HEAD^:.github/workflows/design-manifest-gate.yml \
            > .github/workflows/design-manifest-gate.yml
          python3 scripts/build_release_manifest.py
          python3 scripts/validate_release_manifest.py
          python3 scripts/build_release_manifest.py --check --json
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/design-manifest-gate.yml RELEASE_MANIFEST.json
          git diff --cached --exit-code >/dev/null && {
            echo '::error::Expected canonical workflow restoration and manifest refresh produced no staged change.'
            exit 1
          }
          git commit -m 'chore: synchronize final release manifest'
          git push origin "HEAD:$HEAD_BRANCH"
