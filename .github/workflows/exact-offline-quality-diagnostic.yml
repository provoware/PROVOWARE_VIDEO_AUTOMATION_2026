name: Exact offline quality setup diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/exact-offline-quality-diagnostic.yml'

permissions:
  contents: read

env:
  TARGET_SHA: 2236820064dc5a1efc7c35177999be67b13cd6a9

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Capture every setup phase
        shell: bash
        continue-on-error: true
        run: |
          set -u
          ROOT="$GITHUB_WORKSPACE/candidate"
          E="$GITHUB_WORKSPACE/exact-quality-setup-diagnostics"
          export XDG_DATA_HOME="$RUNNER_TEMP/data"
          export XDG_STATE_HOME="$RUNNER_TEMP/state"
          mkdir -p "$E" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
          cd "$ROOT"
          git rev-parse HEAD >"$E/target-commit.txt"
          git rev-parse 'HEAD^{tree}' >"$E/target-tree.txt"
          for phase in build verify prepare gate; do
            case "$phase" in
              build) cmd=(bash ./quality-toolchain.sh build) ;;
              verify) cmd=(bash ./quality-toolchain.sh verify) ;;
              prepare) cmd=(bash ./quality-toolchain.sh prepare --offline-only --replace) ;;
              gate) cmd=(python3 scripts/toolchain.py gate --scope quality) ;;
            esac
            "${cmd[@]}" >"$E/${phase}.stdout.log" 2>"$E/${phase}.stderr.log"
            printf '%s\n' "$?" >"$E/${phase}.exit"
          done
          find toolchain_wheelhouse -maxdepth 1 -type f -printf '%f\t%s\n' 2>/dev/null | sort >"$E/wheelhouse-inventory.tsv"
          git status --porcelain --untracked-files=no >"$E/tracked-status.txt"
      - name: Upload setup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-offline-quality-setup-diagnostics
          path: exact-quality-setup-diagnostics
          if-no-files-found: error
          retention-days: 7
