name: Exact offline quality evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/exact-offline-quality-evidence.yml'
      - 'matrix-logs/exact-quality-retrigger.marker'

permissions:
  contents: read

concurrency:
  group: exact-offline-quality-2236820064dc5a1efc7c35177999be67b13cd6a9
  cancel-in-progress: true

env:
  TARGET_SHA: 2236820064dc5a1efc7c35177999be67b13cd6a9

jobs:
  quality:
    name: pinned offline toolchain on exact commit
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out exact immutable candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Build, reinstall offline, execute and bind evidence
        id: gate
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$GITHUB_WORKSPACE/candidate"
          EVIDENCE="$RUNNER_TEMP/exact-quality-evidence"
          AUDIT_CACHE="$EVIDENCE/pip-audit-cache"
          GUARD="$RUNNER_TEMP/offline-guard"
          DATA="$RUNNER_TEMP/xdg-data"
          STATE="$RUNNER_TEMP/xdg-state"
          mkdir -p "$EVIDENCE/raw" "$AUDIT_CACHE" "$GUARD" "$DATA" "$STATE"
          export XDG_DATA_HOME="$DATA"
          export XDG_STATE_HOME="$STATE"
          export PYTHONDONTWRITEBYTECODE=1

          run_logged() {
            local name="$1"
            shift
            set +e
            "$@" >"$EVIDENCE/raw/${name}.stdout.log" 2>"$EVIDENCE/raw/${name}.stderr.log"
            local rc=$?
            set -e
            printf '%s\n' "$rc" >"$EVIDENCE/raw/${name}.exit"
            cat "$EVIDENCE/raw/${name}.stdout.log" "$EVIDENCE/raw/${name}.stderr.log" >"$EVIDENCE/raw/${name}.combined.log"
            return "$rc"
          }

          cd "$ROOT"
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf '%s\n' "$actual_sha" >"$EVIDENCE/target-commit.txt"
          git rev-parse 'HEAD^{tree}' >"$EVIDENCE/target-tree.txt"
          git ls-tree -r --full-tree HEAD >"$EVIDENCE/target-tree-listing.txt"
          sha256sum "$EVIDENCE/target-tree-listing.txt" >"$EVIDENCE/target-tree-listing.sha256"
          sha256sum RELEASE_MANIFEST.json >"$EVIDENCE/release-manifest.sha256"
          cp RELEASE_MANIFEST.json "$EVIDENCE/RELEASE_MANIFEST.json"
          cp TOOLCHAIN_CONTRACT.json requirements-quality.lock requirements.lock "$EVIDENCE/"

          run_logged wheelhouse-build bash ./quality-toolchain.sh build
          run_logged wheelhouse-verify bash ./quality-toolchain.sh verify
          test -s toolchain_wheelhouse/TOOLCHAIN_WHEELHOUSE_MANIFEST.json
          test -s toolchain_wheelhouse/requirements-toolchain-resolved.lock
          cp toolchain_wheelhouse/TOOLCHAIN_WHEELHOUSE_MANIFEST.json "$EVIDENCE/wheelhouse-manifest.json"
          cp toolchain_wheelhouse/requirements-toolchain-resolved.lock "$EVIDENCE/requirements-toolchain-resolved.lock"
          find toolchain_wheelhouse -type f -printf '%P\0' | sort -z | while IFS= read -r -d '' rel; do
            sha256sum "toolchain_wheelhouse/$rel"
          done >"$EVIDENCE/wheelhouse-files.sha256"
          sha256sum "$EVIDENCE/wheelhouse-files.sha256" >"$EVIDENCE/wheelhouse-aggregate.sha256"
          sha256sum "$EVIDENCE/wheelhouse-manifest.json" >"$EVIDENCE/wheelhouse-manifest.sha256"
          sha256sum "$EVIDENCE/requirements-toolchain-resolved.lock" >"$EVIDENCE/resolved-lock.sha256"

          run_logged offline-install-first bash ./quality-toolchain.sh prepare --offline-only --replace
          run_logged environment-gate python3 scripts/toolchain.py gate --scope quality
          QUALITY_PYTHON="$(python3 scripts/toolchain.py path --scope quality --quiet)"
          test -x "$QUALITY_PYTHON"

          run_logged pip-audit-cache-prime "$QUALITY_PYTHON" -m pip_audit \
            --cache-dir "$AUDIT_CACHE" --no-deps --disable-pip --progress-spinner off \
            -r requirements.lock || true
          find "$AUDIT_CACHE" -type f -printf '%P\t%s\n' | sort >"$EVIDENCE/pip-audit-cache-inventory.tsv"
          test -s "$EVIDENCE/pip-audit-cache-inventory.tsv"
          find "$AUDIT_CACHE" -type f -printf '%P\0' | sort -z | while IFS= read -r -d '' rel; do
            sha256sum "$AUDIT_CACHE/$rel"
          done >"$EVIDENCE/pip-audit-cache.sha256"

          run_logged offline-install-final bash ./quality-toolchain.sh prepare --offline-only --replace
          run_logged wheelhouse-final-verify bash ./quality-toolchain.sh verify
          QUALITY_PYTHON="$(python3 scripts/toolchain.py path --scope quality --quiet)"
          test -x "$QUALITY_PYTHON"
          BIN_DIR="$(dirname "$QUALITY_PYTHON")"

          "$QUALITY_PYTHON" - <<'PY' >"$EVIDENCE/installed-versions.json"
          import importlib.metadata as md
          import json, platform, sys
          expected = {"ruff":"0.16.1","mypy":"2.3.0","bandit":"1.9.4","pip-audit":"2.10.1"}
          actual = {name: md.version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"version mismatch: {actual!r}")
          print(json.dumps({"python":sys.version,"platform":platform.platform(),"packages":actual}, indent=2, sort_keys=True))
          PY

          cat >"$GUARD/sitecustomize.py" <<'PY'
          import errno
          import socket
          def _blocked(*_args, **_kwargs):
              raise OSError(errno.ENETUNREACH, "OFFLINE_QUALITY_NETWORK_BLOCKED")
          class _OfflineSocket(socket.socket):
              def connect(self, *_args, **_kwargs):
                  return _blocked()
              def connect_ex(self, *_args, **_kwargs):
                  return errno.ENETUNREACH
          socket.socket = _OfflineSocket
          socket.create_connection = _blocked
          socket.getaddrinfo = _blocked
          PY
          export PYTHONPATH="$GUARD:$ROOT/src"
          export VIDEOBATCH_PIP_AUDIT_CACHE="$AUDIT_CACHE"

          overall=0
          run_logged ruff "$BIN_DIR/ruff" check src scripts tests || overall=1
          run_logged mypy "$BIN_DIR/mypy" \
            src/videobatch_fast/naming.py \
            src/videobatch_fast/archive_service.py \
            src/videobatch_fast/runner.py \
            src/videobatch_fast/runner_process.py \
            src/videobatch_fast/plugin_runtime.py \
            src/videobatch_fast/os_sandbox.py \
            src/videobatch_fast/sandbox_seccomp.py \
            src/videobatch_fast/updates.py \
            src/videobatch_fast/update_validation.py \
            src/videobatch_fast/project_state.py || overall=1
          run_logged bandit "$BIN_DIR/bandit" -q -r src/videobatch_fast -c pyproject.toml || overall=1
          run_logged pip-audit "$BIN_DIR/pip-audit" \
            --cache-dir "$AUDIT_CACHE" --no-deps --disable-pip --progress-spinner off \
            -r requirements.lock || overall=1
          printf '%s\n' "$overall" >"$EVIDENCE/offline-quality-gate.exit"

          test -z "$(git diff --name-only)"
          test -z "$(git status --porcelain --untracked-files=no)"
          git status --porcelain --untracked-files=no >"$EVIDENCE/tracked-worktree-status.txt"

          EVIDENCE="$EVIDENCE" TARGET_SHA="$TARGET_SHA" "$QUALITY_PYTHON" - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["EVIDENCE"])
          target = os.environ["TARGET_SHA"]
          versions = json.loads((root / "installed-versions.json").read_text())
          tools = {}
          for name in ("ruff", "mypy", "bandit", "pip-audit"):
              rc = int((root / "raw" / f"{name}.exit").read_text().strip())
              tools[name] = {"version": versions["packages"][name], "returncode": rc, "status": "pass" if rc == 0 else "fail"}
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          report = {
              "schema_version": 1,
              "target_commit": target,
              "target_tree": (root / "target-tree.txt").read_text().strip(),
              "target_tree_listing_sha256": digest(root / "target-tree-listing.txt"),
              "release_manifest_sha256": digest(root / "RELEASE_MANIFEST.json"),
              "wheelhouse_manifest_sha256": digest(root / "wheelhouse-manifest.json"),
              "wheelhouse_aggregate_sha256": digest(root / "wheelhouse-files.sha256"),
              "resolved_lock_sha256": digest(root / "requirements-toolchain-resolved.lock"),
              "offline_socket_guard": True,
              "source_tracked_files_unchanged": (root / "tracked-worktree-status.txt").read_text() == "",
              "tools": tools,
              "overall_status": "pass" if all(v["returncode"] == 0 for v in tools.values()) else "fail",
          }
          (root / "QUALITY_EVIDENCE.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          files = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "EVIDENCE_CONTENTS.json":
                  files.append({"path": path.relative_to(root).as_posix(), "size": path.stat().st_size, "sha256": digest(path)})
          (root / "EVIDENCE_CONTENTS.json").write_text(json.dumps({"schema_version":1,"target_commit":target,"files":files}, indent=2, sort_keys=True) + "\n")
          PY

          cp -a "$EVIDENCE" "$GITHUB_WORKSPACE/exact-quality-evidence"
          exit "$overall"

      - name: Upload complete immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-offline-quality-2236820064dc5a1efc7c35177999be67b13cd6a9
          path: exact-quality-evidence
          if-no-files-found: error
          retention-days: 30
