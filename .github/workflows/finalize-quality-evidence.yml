name: Finalize exact quality evidence

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: finalize-quality-evidence
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'quality/pinned-offline-gates-20260805'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out quality branch
        uses: actions/checkout@v4
        with:
          ref: quality/pinned-offline-gates-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Install required system and pinned Python dependencies
        run: |
          set -Eeuo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 install -y --no-install-recommends python3-tk
          python3 -m pip install --user --requirement requirements-toolchain.lock
          python3 -c 'import tkinter; print("TKINTER_RUNTIME_OK")'

      - name: Remove temporary workflow before generation
        run: rm -- .github/workflows/finalize-quality-evidence.yml

      - name: Regenerate and verify canonical evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          python3 scripts/render_release_docs.py --write
          python3 scripts/validate_release_file_status.py
          python3 scripts/render_release_docs.py --check
          python3 scripts/build_release_manifest.py
          python3 scripts/validate_release_manifest.py
          python3 scripts/validate_version_contract.py
          python3 scripts/validate_text_resources.py
          python3 -m pytest -q

      - name: Remove test caches
        run: |
          set -Eeuo pipefail
          find . -path './.git' -prune -o -type d -name '__pycache__' -exec rm -rf {} +
          rm -rf .pytest_cache
          rm -f .coverage .coverage.*

      - name: Commit verified final evidence
        run: |
          set -Eeuo pipefail
          git config user.name "provoware-release-bot"
          git config user.email "provoware.one@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Record completed exact offline quality gates"
          git push origin HEAD:quality/pinned-offline-gates-20260805
