name: Footer guidance manifest refresh

on:
  push:
    branches: [automation/footer-full-guidance-tooltip-20260904-1810]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Remove one-shot workflow and regenerate canonical manifest
        run: |
          set -Eeuo pipefail
          rm .github/workflows/footer-guidance-manifest-temp.yml
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check
          git diff --check
          git status --short
      - name: Commit regenerated manifest and workflow removal
        run: |
          set -Eeuo pipefail
          git config user.name "provoware-automation"
          git config user.email "provoware-automation@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh release manifest for footer guidance UX"
          git push origin HEAD:automation/footer-full-guidance-tooltip-20260904-1810
