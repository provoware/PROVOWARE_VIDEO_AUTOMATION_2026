name: Footer guidance manifest repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Remove one-shot workflow and regenerate canonical manifest
        run: |
          set -Eeuo pipefail
          rm .github/workflows/footer-guidance-manifest-temp.yml
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check
          git diff --check
          test ! -e .github/workflows/footer-guidance-manifest-temp.yml
      - name: Commit repaired tree
        run: |
          set -Eeuo pipefail
          git config user.name "provoware-automation"
          git config user.email "provoware-automation@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair manifest after footer guidance UX merge"
          git push origin HEAD:main
