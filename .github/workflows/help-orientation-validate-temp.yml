name: Help orientation validation

on:
  push:
    branches: [automation/help-orientation-20260904-1510]

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: System packages
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ffmpeg

      - name: Install pinned toolchain
        run: |
          set -Eeuo pipefail
          python -m pip install --requirement requirements-toolchain.lock

      - name: Remove one-shot workflow before manifest
        run: |
          set -Eeuo pipefail
          rm .github/workflows/help-orientation-validate-temp.yml

      - name: Rebuild and verify release manifest
        run: |
          set -Eeuo pipefail
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check

      - name: Validate help and release contracts
        run: |
          set -Eeuo pipefail
          xvfb-run -a python -m pytest -q -p no:cacheprovider tests/test_release_docs.py tests/test_current_release_evidence_contract.py
          python diagnostics/release_readiness/generate_from_evidence.py --check
          python scripts/validate_design_manifest.py --json

      - name: Validate quality and architecture
        run: |
          set -Eeuo pipefail
          python scripts/internal_quality_gate.py
          python scripts/architecture_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('diagnostics/internal_quality_latest.json').read_text(encoding='utf-8'))
          a=json.loads(Path('diagnostics/architecture_audit_latest.json').read_text(encoding='utf-8'))
          assert q['status']=='pass', q
          assert q['findings']==[], q
          assert a['findings']==[], a
          print('HELP_SLICE_QUALITY_PASS')
          PY

      - name: Commit validated final tree
        run: |
          set -Eeuo pipefail
          git config user.name "provoware-automation"
          git config user.email "actions@users.noreply.github.com"
          git add RELEASE_MANIFEST.json
          git add -u .github/workflows/help-orientation-validate-temp.yml
          git diff --cached --check
          git commit -m "docs: validate rc25 quick-start orientation"
          git push origin HEAD:automation/help-orientation-20260904-1510
