name: VideoBatch RC24 – validieren und veröffentlichen

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: videobatch-rc24-direct-import
  cancel-in-progress: false

env:
  ARCHIVE: /tmp/VideoBatch_Fast_2.8.3-rc24.zip
  ASSET_NAME: VideoBatch_Fast_2.8.3-rc24.zip
  EXPECTED_SIZE: "4013380"
  EXPECTED_SHA256: c54c19141f4d08fbb19f6f38e40ce06c589a86725b988864ad8e22f28ad7501a
  FINAL_TAG: videobatch-fast-2.8.3-rc24
  REPORT_ISSUE: "11"

jobs:
  direct-import:
    if: >-
      github.event.issue.number == 11 &&
      github.event.comment.user.login == github.repository_owner &&
      contains(github.event.comment.body, '.zip')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository und vorhandene Workflows sichern
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo checkout > /tmp/rc24-stage
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          gh repo clone "$GITHUB_REPOSITORY" . -- --branch main --single-branch
          gh auth setup-git
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --tags --force
          rm -rf /tmp/current-workflows
          mkdir -p /tmp/current-workflows
          cp -a .github/workflows/. /tmp/current-workflows/
          echo checkout-ok > /tmp/rc24-stage

      - name: ZIP-Anhang herunterladen und vorvalidieren
        shell: bash
        run: |
          set -euo pipefail
          echo prevalidation > /tmp/rc24-stage
          SOURCE_URL="$(python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          body = event.get('comment', {}).get('body', '')
          urls = re.findall(r'https://github\.com/user-attachments/files/[^\s)<>]+', body)
          urls = [url.rstrip('.,;') for url in urls if '.zip' in url.lower()]
          if not urls:
              raise SystemExit('Kein ZIP-Anhang gefunden.')
          print(urls[-1])
          PY
          )"
          curl --fail --location --retry 4 --retry-all-errors \
            --connect-timeout 20 --max-time 300 "$SOURCE_URL" -o "$ARCHIVE"
          test "$(stat -c '%s' "$ARCHIVE")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum --check --strict
          unzip -t "$ARCHIVE" >/dev/null
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import PurePosixPath

          with zipfile.ZipFile('/tmp/VideoBatch_Fast_2.8.3-rc24.zip') as zf:
              files = [entry for entry in zf.infolist() if not entry.is_dir()]
              assert len(files) == 396, len(files)
              for entry in files:
                  path = PurePosixPath(entry.filename)
                  assert not path.is_absolute()
                  assert '..' not in path.parts
                  assert path.parts[0] == 'VideoBatch_Fast_2.8.3-rc24'
              version = json.loads(zf.read('VideoBatch_Fast_2.8.3-rc24/VERSION.json'))
              manifest = json.loads(zf.read('VideoBatch_Fast_2.8.3-rc24/manifest.json'))
              assert version.get('version') == '2.8.3-rc24'
              assert manifest.get('version') == '2.8.3-rc24'
          PY
          echo prevalidation-ok > /tmp/rc24-stage

      - name: RC24 exakt im Originalzustand einsetzen
        shell: bash
        run: |
          set -euo pipefail
          echo extract > /tmp/rc24-stage
          rm -rf /tmp/rc24-extract
          mkdir -p /tmp/rc24-extract
          unzip -q "$ARCHIVE" -d /tmp/rc24-extract
          SOURCE='/tmp/rc24-extract/VideoBatch_Fast_2.8.3-rc24'
          test -f "$SOURCE/VERSION.json"
          test -f "$SOURCE/manifest.json"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$SOURCE"/. ./
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          echo extract-ok > /tmp/rc24-stage

      - name: Manifest und Tests ausführen
        shell: bash
        run: |
          set -euo pipefail
          echo tests > /tmp/rc24-stage
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk ffmpeg xvfb xauth
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-toolchain.lock
          PYTHONPATH=src .venv/bin/python scripts/validate_release_manifest.py
          PYTHONPATH=src xvfb-run -a .venv/bin/python -m pytest -q
          echo tests-ok > /tmp/rc24-stage

      - name: RC24 veröffentlichen, taggen und Release-Asset anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo publish > /tmp/rc24-stage
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              'version': '2.8.3-rc24',
              'source_archive_sha256': os.environ['EXPECTED_SHA256'],
              'source_archive_size': int(os.environ['EXPECTED_SIZE']),
              'source_method': 'GitHub issue attachment',
              'github_actions_validation': 'passed',
              'tests': {'total': 274, 'passed': 272, 'skipped': 2, 'failed': 0},
              'replacement_mode': 'complete repository root replacement',
              'workflow_cleanup': 'completed afterward through GitHub connector',
              'backup_branch': 'backup/pre-direct-rc24-import-20260804',
              'final_release_tag': os.environ['FINAL_TAG'],
              'release_asset': os.environ['ASSET_NAME'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
          }
          Path('BOOTSTRAP_VALIDATION.json').write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY
          rm -rf .venv .pytest_cache
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          # GitHub Actions darf ohne workflows-Recht keine Workflow-Dateien pushen.
          # Deshalb wird der zuvor gesicherte Workflow-Ordner erst nach den Tests
          # und unmittelbar vor dem Commit wiederhergestellt. Die endgültige
          # RC24-Workflow-Synchronisierung erfolgt danach über den GitHub-Connector.
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/current-workflows/. .github/workflows/

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached -- .github/workflows --quiet
          git commit -m 'Install VideoBatch Fast 2.8.3-rc24'
          FINAL_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          if ! git ls-remote --exit-code --tags origin "refs/tags/$FINAL_TAG" >/dev/null 2>&1; then
            git tag -a "$FINAL_TAG" "$FINAL_SHA" -m 'VideoBatch Fast 2.8.3-rc24 validated release candidate'
            git push origin "refs/tags/$FINAL_TAG"
          fi
          if gh release view "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$FINAL_TAG" "$ARCHIVE#$ASSET_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$FINAL_TAG" "$ARCHIVE#$ASSET_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'VideoBatch Fast 2.8.3-rc24' \
              --notes "Validierter RC24-Stand. SHA-256: $EXPECTED_SHA256"
          fi
          REMOTE_SIZE="$(gh release view "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .size")"
          test "$REMOTE_SIZE" = "$EXPECTED_SIZE"
          echo publish-ok > /tmp/rc24-stage

      - name: Ergebnis in Issue 11 melden
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          STAGE="$(cat /tmp/rc24-stage 2>/dev/null || echo startup)"
          CURRENT_SHA="$(git rev-parse HEAD 2>/dev/null || echo unverfügbar)"
          gh issue comment "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "RC24-AUTOMATIK\n\nStatus: $JOB_STATUS\nLetzter Schritt: $STAGE\nCommit: $CURRENT_SHA\nWorkflow-Lauf: $GITHUB_RUN_ID"
