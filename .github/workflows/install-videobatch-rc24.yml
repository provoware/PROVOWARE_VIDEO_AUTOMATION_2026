name: VideoBatch RC24 – Browser-Upload und Direkt-Import

on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.zip'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: videobatch-rc24-direct-import
  cancel-in-progress: false

env:
  CANONICAL_ASSET: VideoBatch_Fast_2.8.3-rc24.zip
  ARCHIVE: /tmp/VideoBatch_Fast_2.8.3-rc24.zip
  EXPECTED_SIZE: "4013380"
  EXPECTED_SHA256: c54c19141f4d08fbb19f6f38e40ce06c589a86725b988864ad8e22f28ad7501a
  FINAL_TAG: videobatch-fast-2.8.3-rc24
  REPORT_ISSUE: "11"

jobs:
  direct-import:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Repository und hochgeladene ZIP laden
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo checkout > /tmp/rc24-stage
          find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          gh repo clone "$GITHUB_REPOSITORY" . -- --branch main --single-branch

          mapfile -t CANDIDATES < <(
            find incoming -maxdepth 1 -type f -iname '*.zip' -print | sort
          )
          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            printf 'Erwartet wird genau eine ZIP im Ordner incoming; gefunden: %s\n' \
              "${#CANDIDATES[@]}" >&2
            exit 2
          fi

          cp -- "${CANDIDATES[0]}" "$ARCHIVE"
          echo "Verwendete Upload-Datei: ${CANDIDATES[0]}"
          echo checkout-ok > /tmp/rc24-stage

      - name: ZIP vollständig vorvalidieren
        shell: bash
        run: |
          set -euo pipefail
          echo archive-validation > /tmp/rc24-stage

          ACTUAL_SIZE="$(stat -c '%s' "$ARCHIVE")"
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "Falsche Dateigröße: $ACTUAL_SIZE statt $EXPECTED_SIZE Bytes." >&2
            exit 3
          fi

          echo "$EXPECTED_SHA256  $ARCHIVE" | sha256sum --check --strict
          unzip -t "$ARCHIVE"

          rm -rf /tmp/rc24-extract
          mkdir -p /tmp/rc24-extract
          unzip -q "$ARCHIVE" -d /tmp/rc24-extract

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/rc24-extract/VideoBatch_Fast_2.8.3-rc24')
          assert root.is_dir(), root
          version = json.loads((root / 'VERSION.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert version.get('version') == '2.8.3-rc24', version
          assert manifest.get('version') == '2.8.3-rc24', manifest
          assert sum(1 for item in root.rglob('*') if item.is_file()) == 396
          PY

          echo archive-validation-ok > /tmp/rc24-stage

      - name: Repository lokal durch RC24 ersetzen
        shell: bash
        run: |
          set -euo pipefail
          echo replacement > /tmp/rc24-stage
          SOURCE='/tmp/rc24-extract/VideoBatch_Fast_2.8.3-rc24'

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$SOURCE"/. ./

          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          find . -type f -name '*.sh' -exec chmod +x {} +

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              'version': '2.8.3-rc24',
              'source_archive_name': os.environ['CANONICAL_ASSET'],
              'source_archive_size': int(os.environ['EXPECTED_SIZE']),
              'source_archive_sha256': os.environ['EXPECTED_SHA256'],
              'archive_files': 396,
              'local_preflight_tests': '274/274 passed',
              'import_method': 'GitHub browser upload with atomic workflow replacement',
              'github_actions_validation': 'pending tests',
              'backup_branch': 'backup/pre-direct-rc24-import-20260804',
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
          }
          Path('BOOTSTRAP_VALIDATION.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          echo replacement-ok > /tmp/rc24-stage

      - name: Validierungsumgebung installieren
        shell: bash
        run: |
          set -euo pipefail
          echo dependencies > /tmp/rc24-stage
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk ffmpeg xvfb xauth
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-toolchain.lock
          echo dependencies-ok > /tmp/rc24-stage

      - name: Manifest und 274 Tests prüfen
        shell: bash
        run: |
          set -euo pipefail
          echo tests > /tmp/rc24-stage
          PYTHONPATH=src .venv/bin/python scripts/validate_release_manifest.py
          PYTHONPATH=src xvfb-run -a .venv/bin/python -m pytest -q

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('BOOTSTRAP_VALIDATION.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['github_actions_validation'] = 'passed'
          data['github_actions_tests'] = '274/274 passed'
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          echo tests-ok > /tmp/rc24-stage

      - name: Finalen Projektstand, Tag und Release veröffentlichen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo publish > /tmp/rc24-stage

          rm -rf .venv .pytest_cache
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install VideoBatch Fast 2.8.3-rc24'
          FINAL_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main

          git fetch --tags --force
          if git rev-parse "$FINAL_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-list -n 1 "$FINAL_TAG")"
            if [ "$TAG_SHA" != "$FINAL_SHA" ]; then
              echo "Vorhandener Tag zeigt auf $TAG_SHA statt $FINAL_SHA." >&2
              exit 7
            fi
          else
            git tag -a "$FINAL_TAG" "$FINAL_SHA" \
              -m 'VideoBatch Fast 2.8.3-rc24 – validierter Release Candidate'
            git push origin "refs/tags/$FINAL_TAG"
          fi

          if gh release view "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$FINAL_TAG" \
              "$ARCHIVE#$CANONICAL_ASSET" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$FINAL_TAG" \
              "$ARCHIVE#$CANONICAL_ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'VideoBatch Fast 2.8.3-rc24' \
              --notes "Vollständig validierter RC24-Projektstand. SHA-256: $EXPECTED_SHA256"
          fi

          REMOTE_SIZE="$(
            gh release view "$FINAL_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq ".assets[] | select(.name == \"$CANONICAL_ASSET\") | .size"
          )"
          test "$REMOTE_SIZE" = "$EXPECTED_SIZE"

          gh issue comment "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "✅ RC24 wurde per Browser-Upload vollständig installiert und validiert.\n\nCommit: \`$FINAL_SHA\`\nTag: \`$FINAL_TAG\`\nTests: 274/274 bestanden\nArchiv-SHA-256: \`$EXPECTED_SHA256\`"
          gh issue close "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --reason completed

          echo publish-ok > /tmp/rc24-stage

      - name: Verständlichen Fehlerbericht schreiben
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          STAGE="$(cat /tmp/rc24-stage 2>/dev/null || echo startup)"
          gh issue comment "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "❌ Der Browser-Import wurde sicher abgebrochen.\n\nLetzter Schritt: \`$STAGE\`\nWorkflow-Lauf: \`$GITHUB_RUN_ID\`\nDer veröffentlichte Projektstand wurde vor einem erfolgreichen Abschluss nicht absichtlich ersetzt."
