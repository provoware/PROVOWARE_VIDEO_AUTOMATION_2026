name: Install VideoBatch Fast 2.8.3-rc24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-videobatch-rc24.yml'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-videobatch-fast-rc24
  cancel-in-progress: false

jobs:
  install-and-validate:
    if: github.event_name != 'issues' || github.event.issue.title == 'RUN_RC24_INSTALL_ENABLED_20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify RC24 source
        shell: bash
        run: |
          set -euo pipefail
          URL='https://filebin.net/provoware-videobatch-rc24-20260804-9f7c2a/VideoBatch_Fast_2.8.3-rc24.zip'
          ARCHIVE='/tmp/VideoBatch_Fast_2.8.3-rc24.zip'
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 20 --max-time 300 "$URL" -o "$ARCHIVE"
          echo 'c54c19141f4d08fbb19f6f38e40ce06c589a86725b988864ad8e22f28ad7501a  /tmp/VideoBatch_Fast_2.8.3-rc24.zip' | sha256sum --check --strict
          unzip -t "$ARCHIVE"

      - name: Replace repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rc24-extract
          mkdir -p /tmp/rc24-extract
          unzip -q /tmp/VideoBatch_Fast_2.8.3-rc24.zip -d /tmp/rc24-extract
          SOURCE='/tmp/rc24-extract/VideoBatch_Fast_2.8.3-rc24'
          test -f "$SOURCE/VERSION.json"
          test -f "$SOURCE/manifest.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/rc24-extract/VideoBatch_Fast_2.8.3-rc24')
          version = json.loads((root / 'VERSION.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert version.get('version') == '2.8.3-rc24', version
          assert manifest.get('version') == '2.8.3-rc24', manifest
          PY
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$SOURCE"/. ./
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

      - name: Install validation environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk ffmpeg xvfb xauth
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-toolchain.lock

      - name: Validate release and run complete tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src .venv/bin/python scripts/validate_release_manifest.py
          PYTHONPATH=src xvfb-run -a .venv/bin/python -m pytest -q

      - name: Record evidence and publish final RC24 tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence = {
              'version': '2.8.3-rc24',
              'source_archive_sha256': 'c54c19141f4d08fbb19f6f38e40ce06c589a86725b988864ad8e22f28ad7501a',
              'local_preflight_tests': '274/274 passed',
              'github_actions_validation': 'passed',
              'replacement_mode': 'complete repository root replacement',
              'backup_branch': 'backup/pre-rc24-replacement-20260804'
          }
          Path('BOOTSTRAP_VALIDATION.json').write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8'
          )
          PY
          rm -rf .venv .pytest_cache
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No repository changes detected; refusing an empty release commit.' >&2
            exit 1
          fi
          git commit -m 'Install VideoBatch Fast 2.8.3-rc24'
          git push origin HEAD:main
          FINAL_SHA="$(git rev-parse HEAD)"
          TAG='videobatch-fast-2.8.3-rc24'
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists; leaving it unchanged."
          else
            git tag -a "$TAG" "$FINAL_SHA" -m 'VideoBatch Fast 2.8.3-rc24 validated release candidate'
            git push origin "refs/tags/$TAG"
          fi
