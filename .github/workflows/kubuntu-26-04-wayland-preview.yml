name: Kubuntu 26.04 Wayland preview contract

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/kubuntu-26-04-wayland-preview.yml
      - PLATFORM_SUPPORT.json
      - docs/KUBUNTU_26_04_WAYLAND.md
      - requirements-qt.txt
      - scripts/build_wayland_preview_zip.py
      - scripts/install_kubuntu_26_04_wayland.sh
      - scripts/kubuntu_26_04_wayland_check.py
      - src/videobatch_fast/platform_integration.py
      - src/videobatch_fast/qt_*.py
      - tests/test_platform_integration.py
      - tests/qt_phase3_smoke.py
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'

jobs:
  logic:
    name: Platform logic and syntax
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned test runner
        run: python3 -m pip install pytest==8.4.2
      - name: Compile target-specific Python
        run: |
          python3 -m compileall -q -f \
            src/videobatch_fast/platform_integration.py \
            src/videobatch_fast/qt_ui.py \
            src/videobatch_fast/qt_phase2.py \
            src/videobatch_fast/qt_phase3.py \
            scripts/kubuntu_26_04_wayland_check.py \
            scripts/build_wayland_preview_zip.py
      - name: Run platform unit tests
        run: python3 -m pytest -q tests/test_platform_integration.py

  wayland:
    name: Ubuntu 26.04 + KDE subset + native Qt Wayland
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      XDG_SESSION_TYPE: wayland
      XDG_CURRENT_DESKTOP: KDE
      DESKTOP_SESSION: plasmawayland
      QT_QPA_PLATFORM: wayland
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Wayland and KDE runtime subset
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            weston \
            wl-clipboard \
            xdg-utils \
            xdg-desktop-portal \
            xdg-desktop-portal-kde \
            libnotify-bin \
            libegl1 \
            libgl1 \
            libfontconfig1 \
            libwayland-client0 \
            libxkbcommon0
          python3 -m pip install -r requirements-qt.txt
          python3 -m pip install pytest==8.4.2

      - name: Verify Ubuntu 26.04 base and required packages
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$VERSION_ID" = "26.04"
          command -v python3
          command -v ffmpeg
          command -v ffprobe
          command -v weston
          command -v wl-copy
          test -f /usr/share/xdg-desktop-portal/portals/kde.portal

      - name: Start headless Weston compositor
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-ci" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" weston \
            --backend=headless-backend.so \
            --socket=wayland-ci \
            --idle-time=0 >/tmp/weston.log 2>&1 &
          for _ in $(seq 1 20); do
            test -S "$RUNNER_TEMP/xdg/wayland-ci" && exit 0
            sleep 0.25
          done
          cat /tmp/weston.log
          exit 1

      - name: Prove VideoBatch accepts unmodified Ubuntu flavour identity
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "26.04"
          ! grep -qiE '^(VARIANT|VARIANT_ID)=.*kubuntu' /etc/os-release
          python3 scripts/kubuntu_26_04_wayland_check.py --json | tee "$RUNNER_TEMP/platform-check.json"
          grep -F '"status": "ready"' "$RUNNER_TEMP/platform-check.json"

      - name: Prove PySide6 uses the Wayland QPA backend
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from PySide6.QtWidgets import QApplication

          app = QApplication([])
          backend = app.platformName().lower()
          print(f"QT_QPA_BACKEND={backend}")
          assert "wayland" in backend, backend
          app.quit()
          PY

      - name: Run Phase 3 UI smoke through native Wayland
        run: python3 tests/qt_phase3_smoke.py

      - name: Upload compositor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubuntu-26-04-native-wayland-diagnostics
          path: /tmp/weston.log
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Build complete Wayland preview ZIP
    needs: [logic, wayland]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build deterministic complete source ZIP
        run: python3 scripts/build_wayland_preview_zip.py
      - name: Verify ZIP structure and checksum metadata
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          zips = list(Path('dist').glob('*.zip'))
          assert len(zips) == 1, zips
          with zipfile.ZipFile(zips[0]) as archive:
              names = set(archive.namelist())
          required = {
              'STARTEN.sh',
              'VERSION.json',
              'PLATFORM_SUPPORT.json',
              'requirements-qt.txt',
              'src/videobatch_fast/platform_integration.py',
              'src/videobatch_fast/qt_phase3.py',
              'docs/KUBUNTU_26_04_WAYLAND.md',
              'scripts/install_kubuntu_26_04_wayland.sh',
          }
          missing = sorted(required - names)
          assert not missing, missing
          meta = json.loads(Path(str(zips[0]) + '.sha256.json').read_text(encoding='utf-8'))
          assert len(meta['sha256']) == 64
          print(meta)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: videobatch-kubuntu-26-04-wayland-preview
          path: |
            dist/*.zip
            dist/*.sha256.json
          if-no-files-found: error
          retention-days: 30
