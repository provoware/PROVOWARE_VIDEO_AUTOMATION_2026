name: Kubuntu compatibility matrix

run-name: >-
  Kubuntu matrix ${{ github.ref_name }} → issue #${{ github.event_name == 'workflow_dispatch' && inputs.report_issue || '12' }}

on:
  workflow_dispatch:
    inputs:
      report_issue:
        description: Issue number for the automatic result report
        required: false
        default: '12'
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: kubuntu-compatibility-${{ github.ref }}
  cancel-in-progress: false

env:
  REPORT_ISSUE: ${{ github.event_name == 'workflow_dispatch' && inputs.report_issue || '12' }}

jobs:
  matrix:
    name: ${{ matrix.os }} / ${{ matrix.session }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        session:
          - x11
          - wayland
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      XDG_SESSION_TYPE: ${{ matrix.session }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Prepare cached Kubuntu CI dependencies
        uses: ./.github/actions/prepare-kubuntu-ci
        with:
          os: ${{ matrix.os }}
          save-cache: 'true'

      - name: Start deterministic display
        run: |
          set -Eeuo pipefail
          if [ "${{ matrix.session }}" = x11 ]; then
            Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp \
              >/tmp/xvfb.log 2>&1 &
            echo "DISPLAY=:99" >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/xdg"
            chmod 700 "$RUNNER_TEMP/xdg"
            XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" weston \
              --backend=headless-backend.so \
              --socket=wayland-vb \
              --idle-time=0 >/tmp/weston.log 2>&1 &
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
            echo "WAYLAND_DISPLAY=wayland-vb" >> "$GITHUB_ENV"
            Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp \
              >/tmp/xvfb.log 2>&1 &
            echo "DISPLAY=:99" >> "$GITHUB_ENV"
          fi

      - name: Provision and attest Ubuntu FFmpeg
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_SESSION: ${{ matrix.session }}
        run: |
          set -Eeuo pipefail

          FFMPEG_PATH="$(readlink -f "$(command -v ffmpeg)")"
          FFPROBE_PATH="$(readlink -f "$(command -v ffprobe)")"
          test -x "$FFMPEG_PATH"
          test -x "$FFPROBE_PATH"

          FFMPEG_VERSION="$("$FFMPEG_PATH" -version | sed -n '1p')"
          FFPROBE_VERSION="$("$FFPROBE_PATH" -version | sed -n '1p')"
          PACKAGE_VERSION="$(dpkg-query -W -f='${Version}' ffmpeg)"
          FFMPEG_SHA256="$(sha256sum "$FFMPEG_PATH" | awk '{print $1}')"
          FFPROBE_SHA256="$(sha256sum "$FFPROBE_PATH" | awk '{print $1}')"

          MEDIA_DIR="$RUNNER_TEMP/ffmpeg-system/bin"
          mkdir -p "$MEDIA_DIR"
          ln -sfn "$FFMPEG_PATH" "$MEDIA_DIR/ffmpeg"
          ln -sfn "$FFPROBE_PATH" "$MEDIA_DIR/ffprobe"

          "$MEDIA_DIR/ffmpeg" -hide_banner -version >/dev/null
          "$MEDIA_DIR/ffprobe" -hide_banner -version >/dev/null
          echo "VIDEOBATCH_STATIC_MEDIA_DIR=$MEDIA_DIR" >> "$GITHUB_ENV"

          export FFMPEG_PATH FFPROBE_PATH FFMPEG_VERSION FFPROBE_VERSION
          export PACKAGE_VERSION FFMPEG_SHA256 FFPROBE_SHA256 MEDIA_DIR
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": 1,
              "provider": "ubuntu-apt",
              "os": os.environ["MATRIX_OS"],
              "session": os.environ["MATRIX_SESSION"],
              "package": {
                  "name": "ffmpeg",
                  "version": os.environ["PACKAGE_VERSION"],
              },
              "media_dir": os.environ["MEDIA_DIR"],
              "ffmpeg": {
                  "path": os.environ["FFMPEG_PATH"],
                  "version": os.environ["FFMPEG_VERSION"],
                  "sha256": os.environ["FFMPEG_SHA256"],
              },
              "ffprobe": {
                  "path": os.environ["FFPROBE_PATH"],
                  "version": os.environ["FFPROBE_VERSION"],
                  "sha256": os.environ["FFPROBE_SHA256"],
              },
          }
          Path("FFMPEG_TOOLCHAIN.json").write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          cat FFMPEG_TOOLCHAIN.json

      - name: Run complete compatibility contract
        run: bash scripts/kubuntu_matrix_smoke.sh

      - name: Write matrix status and collect diagnostics
        if: always()
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_SESSION: ${{ matrix.session }}
          MATRIX_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          mkdir -p matrix-logs
          test ! -f /tmp/xvfb.log || cp /tmp/xvfb.log matrix-logs/xvfb.log
          test ! -f /tmp/weston.log || cp /tmp/weston.log matrix-logs/weston.log
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          toolchain = {}
          try:
              toolchain = json.loads(
                  Path("FFMPEG_TOOLCHAIN.json").read_text(encoding="utf-8")
              )
          except (OSError, json.JSONDecodeError):
              pass

          result = {
              "schema_version": 2,
              "os": os.environ["MATRIX_OS"],
              "session": os.environ["MATRIX_SESSION"],
              "status": os.environ["MATRIX_STATUS"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": os.environ["GITHUB_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "media_toolchain": toolchain,
          }
          name = f"matrix-status-{result['os']}-{result['session']}.json"
          Path(name).write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videobatch-${{ matrix.os }}-${{ matrix.session }}
          path: |
            dist-matrix-a/*
            CI_DEPENDENCY_REPORT.json
            KUBUNTU_BUILD_MATRIX.json
            FFMPEG_TOOLCHAIN.json
            matrix-status-${{ matrix.os }}-${{ matrix.session }}.json
            matrix-logs/*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload machine-readable matrix status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-status-${{ matrix.os }}-${{ matrix.session }}
          path: matrix-status-${{ matrix.os }}-${{ matrix.session }}.json
          if-no-files-found: error
          retention-days: 30

  report:
    name: Publish matrix summary
    if: always()
    needs:
      - matrix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate report issue target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$REPORT_ISSUE" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Invalid report issue number: $REPORT_ISSUE"
            exit 1
          }
          gh issue view "$REPORT_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,state,title >/dev/null

      - name: Download all matrix status records
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: matrix-status-*
          path: matrix-status
          merge-multiple: true

      - name: Build final matrix report
        id: report
        env:
          MATRIX_JOB_RESULT: ${{ needs.matrix.result }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = [
              ("ubuntu-22.04", "x11"),
              ("ubuntu-22.04", "wayland"),
              ("ubuntu-24.04", "x11"),
              ("ubuntu-24.04", "wayland"),
          ]

          version = "unknown"
          try:
              version_data = json.loads(
                  Path("VERSION.json").read_text(encoding="utf-8")
              )
              version = str(
                  version_data.get("version")
                  or version_data.get("build")
                  or "unknown"
              )
          except (OSError, json.JSONDecodeError, TypeError):
              pass

          records = {}
          for path in Path("matrix-status").glob("matrix-status-*.json"):
              try:
                  record = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              records[(record.get("os"), record.get("session"))] = record

          rows = []
          for os_name, session in expected:
              record = records.get((os_name, session), {})
              status = record.get("status", "missing")
              symbol = "✅" if status == "success" else "❌"
              rows.append(
                  {
                      "os": os_name,
                      "session": session,
                      "status": status,
                      "symbol": symbol,
                      "media_toolchain": record.get("media_toolchain", {}),
                  }
              )

          all_success = all(row["status"] == "success" for row in rows)
          run_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          summary = {
              "schema_version": 3,
              "version": version,
              "status": "passed" if all_success else "failed",
              "report_issue": int(os.environ["REPORT_ISSUE"]),
              "matrix_job_result": os.environ.get(
                  "MATRIX_JOB_RESULT", "unknown"
              ),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "run_url": run_url,
              "commit": os.environ["GITHUB_SHA"],
              "results": [
                  {
                      "os": row["os"],
                      "session": row["session"],
                      "status": row["status"],
                      "media_toolchain": row["media_toolchain"],
                  }
                  for row in rows
              ],
          }
          Path("KUBUNTU_MATRIX_SUMMARY.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          lines = [
              f"## Kubuntu-Kompatibilitätsmatrix {version}",
              "",
              f"Workflow-Lauf: [{os.environ['GITHUB_RUN_ID']}]({run_url})",
              f"Commit: `{os.environ['GITHUB_SHA']}`",
              "",
              "| System | Sitzung | Ergebnis | FFmpeg-Paket |",
              "|---|---|---|---|",
          ]
          for row in rows:
              package = (
                  row["media_toolchain"].get("package", {}).get(
                      "version", "nicht ermittelt"
                  )
              )
              lines.append(
                  f"| {row['os']} | {row['session']} | "
                  f"{row['symbol']} `{row['status']}` | `{package}` |"
              )

          lines.extend(["", "### Medienwerkzeug-Nachweise", ""])
          for row in rows:
              toolchain = row["media_toolchain"]
              ffmpeg = toolchain.get("ffmpeg", {})
              ffprobe = toolchain.get("ffprobe", {})
              lines.extend(
                  [
                      f"**{row['os']} / {row['session']}**",
                      "",
                      f"- FFmpeg: `{ffmpeg.get('version', 'nicht ermittelt')}`",
                      f"- FFmpeg-Pfad: `{ffmpeg.get('path', 'nicht ermittelt')}`",
                      f"- FFmpeg-SHA-256: `{ffmpeg.get('sha256', 'nicht ermittelt')}`",
                      f"- ffprobe: `{ffprobe.get('version', 'nicht ermittelt')}`",
                      f"- ffprobe-Pfad: `{ffprobe.get('path', 'nicht ermittelt')}`",
                      f"- ffprobe-SHA-256: `{ffprobe.get('sha256', 'nicht ermittelt')}`",
                      "",
                  ]
              )

          lines.extend(
              [
                  (
                      "**Gesamtergebnis: bestanden.**"
                      if all_success
                      else "**Gesamtergebnis: nicht vollständig bestanden.**"
                  ),
                  "",
                  "Die vollständigen Nachweise liegen 30 Tage als "
                  "Workflow-Artefakte vor.",
              ]
          )
          Path("KUBUNTU_MATRIX_SUMMARY.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open(
              "a", encoding="utf-8"
          ) as output:
              output.write(
                  f"all_success={'true' if all_success else 'false'}\n"
              )
              output.write(f"version={version}\n")
          PY

      - name: Upload consolidated matrix report
        uses: actions/upload-artifact@v4
        with:
          name: kubuntu-matrix-summary
          path: |
            KUBUNTU_MATRIX_SUMMARY.json
            KUBUNTU_MATRIX_SUMMARY.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish result in selected issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$REPORT_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file KUBUNTU_MATRIX_SUMMARY.md

      - name: Close selected issue after complete success
        if: steps.report.outputs.all_success == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MATRIX_VERSION: ${{ steps.report.outputs.version }}
        run: |
          gh issue close "$REPORT_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --reason completed \
            --comment "All four compatibility combinations for ${MATRIX_VERSION} passed."
