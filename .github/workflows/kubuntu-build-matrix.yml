name: Kubuntu compatibility matrix

run-name: Kubuntu 26.04 Wayland validation · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  PYTHONPATH: src
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  XDG_SESSION_TYPE: wayland
  XDG_CURRENT_DESKTOP: KDE
  DESKTOP_SESSION: plasmawayland
  QT_QPA_PLATFORM: wayland

concurrency:
  group: kubuntu-26-04-wayland-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target:
    name: Kubuntu 26.04 / native Wayland
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Kubuntu Wayland runtime subset
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            weston \
            wl-clipboard \
            xdg-utils \
            xdg-desktop-portal \
            xdg-desktop-portal-kde \
            libnotify-bin \
            libegl1 \
            libgl1 \
            libfontconfig1 \
            libwayland-client0 \
            libxkbcommon0
          python3 -m pip install -r requirements-qt.txt
          python3 -m pip install pytest==8.4.2

      - name: Verify 26.04 base and media tools
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$VERSION_ID" = "26.04"
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
          test -f /usr/share/xdg-desktop-portal/portals/kde.portal

      - name: Start native Wayland compositor
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-release" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" weston \
            --backend=headless-backend.so \
            --socket=wayland-release \
            --idle-time=0 >/tmp/weston-release.log 2>&1 &
          for _ in $(seq 1 20); do
            test -S "$RUNNER_TEMP/xdg/wayland-release" && exit 0
            sleep 0.25
          done
          cat /tmp/weston-release.log
          exit 1

      - name: Run platform and Qt contracts
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q \
            tests/test_platform_integration.py \
            tests/test_qt_phase2_contract.py \
            tests/test_qt_phase3_contract.py \
            tests/test_qt_runtime_toolchain_contract.py

      - name: Prove Qt native Wayland backend
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from PySide6.QtWidgets import QApplication

          app = QApplication([])
          backend = app.platformName().lower()
          print(f"QT_QPA_BACKEND={backend}")
          assert "wayland" in backend, backend
          app.quit()
          PY

      - name: Run Phase 3 workspace smoke
        run: python3 tests/qt_phase3_smoke.py

      - name: Check release manifest
        run: python3 scripts/build_release_manifest.py --check --json

      - name: Build target preview ZIP
        run: python3 scripts/build_wayland_preview_zip.py

      - name: Upload target evidence and ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubuntu-26-04-wayland-release-evidence
          path: |
            /tmp/weston-release.log
            dist/*.zip
            dist/*.sha256.json
          if-no-files-found: warn
          retention-days: 30
