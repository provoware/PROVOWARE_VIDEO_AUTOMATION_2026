name: Secure Kubuntu owner dispatch

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: kubuntu-owner-comment-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch protected Kubuntu workflow
    if: >-
      github.event.issue.number == 12 &&
      github.event.comment.author_association == 'OWNER' &&
      (github.event.comment.body == '/run-kubuntu-main' ||
       github.event.comment.body == '/run-kubuntu-cache-warmup' ||
       startsWith(github.event.comment.body, '/run-kubuntu-pr '))
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve protected target
        id: select
        env:
          COMMAND: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          case "$COMMAND" in
            /run-kubuntu-main)
              workflow=kubuntu-build-matrix.yml
              label='Produktive Kubuntu-Matrix'
              ref=main
              expected_sha=''
              arguments='-f report_issue=12'
              ;;
            /run-kubuntu-cache-warmup)
              workflow=kubuntu-cache-warmup.yml
              label='Kubuntu-Cache-Warmup'
              ref=main
              expected_sha=''
              arguments=''
              ;;
            /run-kubuntu-pr\ *)
              pr_number="${COMMAND#'/run-kubuntu-pr '}"
              [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || {
                echo "::error title=Ungültige PR-Nummer::$pr_number"
                exit 64
              }
              pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
              test "$(jq -r '.state' <<< "$pr_json")" = open
              test "$(jq -r '.base.ref' <<< "$pr_json")" = main
              test "$(jq -r '.head.repo.full_name' <<< "$pr_json")" = "$GITHUB_REPOSITORY"
              workflow=kubuntu-build-matrix.yml
              label="Kubuntu-PR-Matrix #$pr_number"
              ref="$(jq -r '.head.ref' <<< "$pr_json")"
              expected_sha="$(jq -r '.head.sha' <<< "$pr_json")"
              arguments='-f report_issue=12'
              ;;
            *)
              echo "::error title=Unbekannter Owner-Befehl::$COMMAND"
              exit 64
              ;;
          esac
          {
            echo "workflow=$workflow"
            echo "label=$label"
            echo "ref=$ref"
            echo "expected_sha=$expected_sha"
            echo "arguments=$arguments"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch selected revision
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.select.outputs.workflow }}
          REF: ${{ steps.select.outputs.ref }}
          ARGUMENTS: ${{ steps.select.outputs.arguments }}
        run: |
          set -Eeuo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          read -r -a extra_args <<< "$ARGUMENTS"
          gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$REF" "${extra_args[@]}"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Resolve and attest dispatched run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.select.outputs.workflow }}
          LABEL: ${{ steps.select.outputs.label }}
          REF: ${{ steps.select.outputs.ref }}
          EXPECTED_SHA: ${{ steps.select.outputs.expected_sha }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        run: |
          set -Eeuo pipefail
          run_json=''
          for attempt in $(seq 1 18); do
            run_json="$(
              gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" \
                --branch "$REF" --event workflow_dispatch --limit 30 \
                --json databaseId,createdAt,status,url,headSha \
              | jq -c --arg started "$STARTED_AT" \
                  '[.[] | select(.createdAt >= $started)] | sort_by(.createdAt) | reverse | .[0] // empty'
            )"
            test -z "$run_json" || break
            sleep 5
          done
          test -n "$run_json" || {
            echo "::error title=Run nicht auffindbar::Der Workflow wurde ausgelöst, aber kein passender Run registriert."
            exit 1
          }
          run_id="$(jq -r '.databaseId' <<< "$run_json")"
          run_url="$(jq -r '.url' <<< "$run_json")"
          run_status="$(jq -r '.status' <<< "$run_json")"
          head_sha="$(jq -r '.headSha' <<< "$run_json")"
          if [[ -n "$EXPECTED_SHA" && "$head_sha" != "$EXPECTED_SHA" ]]; then
            echo "::error title=Falscher PR-Head::Erwartet $EXPECTED_SHA, gestartet wurde $head_sha."
            exit 1
          fi
          cat > run-comment.md <<EOF
          🚦 **${LABEL} gestartet**

          - Run: [${run_id}](${run_url})
          - Status: \`${run_status}\`
          - Ref: \`${REF}\`
          - Commit: \`${head_sha}\`

          Der gestartete Commit wurde gegen das geschützte Ziel geprüft.
          EOF
          gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body-file run-comment.md
