name: Secure Kubuntu owner dispatch

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: kubuntu-owner-comment-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch protected Kubuntu workflow
    if: >-
      github.event.issue.number == 12 &&
      github.event.comment.author_association == 'OWNER' &&
      (github.event.comment.body == '/run-kubuntu-main' ||
       github.event.comment.body == '/run-kubuntu-cache-warmup')
    runs-on: ubuntu-latest

    steps:
      - name: Select protected workflow
        id: select
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          case "$COMMAND" in
            /run-kubuntu-main)
              echo "workflow=kubuntu-build-matrix.yml" >> "$GITHUB_OUTPUT"
              echo "label=Produktive Kubuntu-Matrix" >> "$GITHUB_OUTPUT"
              echo "arguments=-f report_issue=12" >> "$GITHUB_OUTPUT"
              ;;
            /run-kubuntu-cache-warmup)
              echo "workflow=kubuntu-cache-warmup.yml" >> "$GITHUB_OUTPUT"
              echo "label=Kubuntu-Cache-Warmup" >> "$GITHUB_OUTPUT"
              echo "arguments=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error title=Unbekannter Owner-Befehl::$COMMAND"
              exit 64
              ;;
          esac

      - name: Dispatch workflow on main
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.select.outputs.workflow }}
          ARGUMENTS: ${{ steps.select.outputs.arguments }}
        run: |
          set -Eeuo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          read -r -a extra_args <<< "$ARGUMENTS"
          gh workflow run "$WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            "${extra_args[@]}"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Resolve dispatched run and publish link
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ steps.select.outputs.workflow }}
          LABEL: ${{ steps.select.outputs.label }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        run: |
          set -Eeuo pipefail
          run_json=""
          for attempt in $(seq 1 12); do
            run_json="$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$WORKFLOW" \
                --branch main \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,createdAt,status,url,headSha \
              | jq -c --arg started "$STARTED_AT" \
                  '[.[] | select(.createdAt >= $started)] | sort_by(.createdAt) | reverse | .[0] // empty'
            )"
            if [[ -n "$run_json" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$run_json" ]]; then
            cat > run-comment.md <<EOF
          ⚠️ **${LABEL} wurde ausgelöst**, aber die Run-ID war innerhalb von 60 Sekunden noch nicht abrufbar.

          Unter **Actions** läuft die Prüfung dennoch weiter. Es ist keine erneute Auslösung erforderlich.
          EOF
            gh issue comment 12 \
              --repo "$GITHUB_REPOSITORY" \
              --body-file run-comment.md
            echo "::warning title=Run-ID noch nicht sichtbar::Der Workflow wurde ausgelöst, aber noch nicht in der Run-Liste gefunden."
            exit 0
          fi

          run_id="$(jq -r '.databaseId' <<< "$run_json")"
          run_url="$(jq -r '.url' <<< "$run_json")"
          run_status="$(jq -r '.status' <<< "$run_json")"
          head_sha="$(jq -r '.headSha' <<< "$run_json")"
          cat > run-comment.md <<EOF
          🚦 **${LABEL} gestartet**

          - Run: [${run_id}](${run_url})
          - Status: \`${run_status}\`
          - Branch: \`main\`
          - Commit: \`${head_sha}\`

          Die Abschlussauswertung erfolgt automatisch.
          EOF
          gh issue comment 12 \
            --repo "$GITHUB_REPOSITORY" \
            --body-file run-comment.md
          echo "::notice title=Geschützter Workflow gestartet::${LABEL}, Run ${run_id}, Status ${run_status}."

  finalize-pr-ancestry:
    name: Finalize PR 61 ancestry guard
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 61 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/finalize-pr-ancestry-61'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_HEAD: ed821e212d7a2acf2b9eb5605076fc71a1673bf4
      HEAD_REF: fix/pr-ancestry-guard-20260806
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pr-ancestry-pycache
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts

    steps:
      - name: Verify immutable PR identity
        run: |
          set -Eeuo pipefail
          gh api repos/$GITHUB_REPOSITORY/pulls/61 > "$RUNNER_TEMP/pr.json"
          test "$(jq -r '.head.repo.full_name' "$RUNNER_TEMP/pr.json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.ref' "$RUNNER_TEMP/pr.json")" = "$HEAD_REF"
          test "$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")" = "$EXPECTED_HEAD"
          test "$(jq -r '.base.ref' "$RUNNER_TEMP/pr.json")" = main
          test "$(jq -r '.state' "$RUNNER_TEMP/pr.json")" = open

      - name: Check out exact writable PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified payload and remove transport files
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import base64
          import io
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          folder = Path('.github/ancestry-payload')
          parts = sorted(folder.glob('part-*.txt'))
          if len(parts) != 3:
              raise SystemExit(f'expected 3 payload parts, found {len(parts)}')
          encoded = []
          for index, path in enumerate(parts, 1):
              lines = path.read_text(encoding='utf-8').splitlines()
              marker = f'<!-- PR_ANCESTRY_PAYLOAD {index:02d}/03 -->'
              if not lines or lines[0] != marker:
                  raise SystemExit(f'invalid payload marker: {path}')
              encoded.append(''.join(lines[1:]))
          payload = base64.b64decode(''.join(encoded), validate=True)
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  target = PurePosixPath(member.name)
                  if target.is_absolute() or '..' in target.parts or not member.isfile():
                      raise SystemExit(f'unsafe payload entry: {member.name}')
              archive.extractall(Path.cwd(), members=members)
          shutil.rmtree(folder)
          Path('.github/workflows/pr-ancestry-bootstrap.yml').unlink()
          PY
          python3 diagnostics/release_readiness/generate_from_evidence.py --write
          python3 scripts/build_release_manifest.py

      - name: Validate exact final tree
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input ruff==0.16.1
          test "$(python3 -m ruff --version)" = 'ruff 0.16.1'
          python3 -m ruff check scripts/check_pr_ancestry.py tests/test_pr_ancestry_guard.py --no-cache
          python3 -m compileall -q -f src scripts diagnostics tests
          python3 -m pytest -q -p no:cacheprovider tests/test_pr_ancestry_guard.py
          python3 diagnostics/release_readiness/generate_from_evidence.py --check
          python3 scripts/build_release_manifest.py --check --json
          ruby -e 'require "yaml"; value=YAML.load_file(".github/workflows/kubuntu-pr-matrix.yml"); abort unless value.is_a?(Hash)'
          git diff --check

      - name: Commit and push verified final branch
        id: publish
        run: |
          set -Eeuo pipefail
          git config user.name 'provoware-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'ci: enforce PR ancestry before compatibility matrix'
          git push origin "HEAD:$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish success evidence
        if: success()
        env:
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          gh pr comment 61 --repo "$GITHUB_REPOSITORY" --body "✅ Atomare Finalisierung bestanden und gepusht. Finaler Head: \`$FINAL_SHA\`. Ruff 0.16.1, Compileall, vier Wächtertests, Evidence-Drift, Manifest-Drift und Workflow-YAML sind grün. Die regulären PR-Gates müssen nun vollständig laufen."

      - name: Publish failure evidence
        if: failure()
        run: |
          gh pr comment 61 --repo "$GITHUB_REPOSITORY" --body "❌ Atomare Finalisierung fehlgeschlagen. Es wurde kein geprüfter Merge freigegeben. Actions-Lauf: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
