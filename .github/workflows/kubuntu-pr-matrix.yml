name: Kubuntu compatibility matrix PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/actions/kubuntu-package-cache/**
      - .github/ci/kubuntu-packages.txt
      - .github/workflows/kubuntu-cache-warmup.yml
      - .github/workflows/kubuntu-pr-matrix.yml
      - .github/workflows/kubuntu-build-matrix.yml
      - diagnostics/**
      - scripts/**
      - src/**
      - tests/**
      - RELEASE_MANIFEST.json
      - VERSION.json
      - pyproject.toml
      - requirements.lock
      - requirements-toolchain.lock

permissions:
  contents: read
  actions: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'

concurrency:
  group: kubuntu-pr-matrix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Fast read-only release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/videobatch-preflight-pycache
      RUFF_CACHE_DIR: ${{ runner.temp }}/videobatch-preflight-ruff-cache

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install exact Ruff syntax checker
        run: |
          set -Eeuo pipefail
          python3 -m pip install ruff==0.16.1
          test "$(python3 -m ruff --version)" = "ruff 0.16.1"

      - name: Compile Python without repository writes
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q -f src scripts diagnostics tests

      - name: Run Ruff syntax and undefined-name gate
        run: |
          set -Eeuo pipefail
          python3 -m ruff check src scripts diagnostics tests \
            --select E9,F63,F7,F82 \
            --no-cache

      - name: Check release manifest and emit exact drift records
        run: |
          set -Eeuo pipefail
          python3 scripts/build_release_manifest.py --check --json \
            | tee "$RUNNER_TEMP/release-manifest-drift.json"

      - name: Validate canonical evidence schema
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from diagnostics.release_readiness.generate_from_evidence import evidence

          value = evidence()
          print(
              "RELEASE-EVIDENCE-SCHEMA BESTANDEN · "
              f"Version {value['product']['version']} · "
              f"{len(value['stable_gates'])} Stable-Gates"
          )
          PY

      - name: Check generated release outputs for drift
        run: |
          set -Eeuo pipefail
          python3 diagnostics/release_readiness/generate_from_evidence.py --check

      - name: Prove repository remained unchanged
        if: always()
        run: |
          set -Eeuo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error title=Read-only preflight wrote repository files::The preflight must leave the checkout unchanged."
            exit 1
          fi

  matrix:
    name: ${{ matrix.os }} / ${{ matrix.session }}
    needs:
      - preflight
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
        session:
          - x11
          - wayland
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      XDG_SESSION_TYPE: ${{ matrix.session }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare cached Kubuntu dependencies
        uses: ./.github/actions/kubuntu-package-cache
        with:
          os: ${{ matrix.os }}
          session: ${{ matrix.session }}
          mode: matrix

      - name: Start deterministic display
        run: |
          set -Eeuo pipefail
          if [[ "${{ matrix.session }}" == x11 ]]; then
            Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp \
              >/tmp/xvfb.log 2>&1 &
            echo "DISPLAY=:99" >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/xdg"
            chmod 700 "$RUNNER_TEMP/xdg"
            XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" weston \
              --backend=headless-backend.so \
              --socket=wayland-vb \
              --idle-time=0 >/tmp/weston.log 2>&1 &
            echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
            echo "WAYLAND_DISPLAY=wayland-vb" >> "$GITHUB_ENV"
            Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp \
              >/tmp/xvfb.log 2>&1 &
            echo "DISPLAY=:99" >> "$GITHUB_ENV"
          fi
          sleep 2

      - name: Provision and attest Ubuntu FFmpeg
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_SESSION: ${{ matrix.session }}
        run: |
          set -Eeuo pipefail
          FFMPEG_PATH="$(readlink -f "$(command -v ffmpeg)")"
          FFPROBE_PATH="$(readlink -f "$(command -v ffprobe)")"
          test -x "$FFMPEG_PATH"
          test -x "$FFPROBE_PATH"

          FFMPEG_VERSION="$("$FFMPEG_PATH" -version | sed -n '1p')"
          FFPROBE_VERSION="$("$FFPROBE_PATH" -version | sed -n '1p')"
          PACKAGE_VERSION="$(dpkg-query -W -f='${Version}' ffmpeg)"
          FFMPEG_SHA256="$(sha256sum "$FFMPEG_PATH" | awk '{print $1}')"
          FFPROBE_SHA256="$(sha256sum "$FFPROBE_PATH" | awk '{print $1}')"
          MEDIA_DIR="$RUNNER_TEMP/ffmpeg-system/bin"
          mkdir -p "$MEDIA_DIR"
          ln -sfn "$FFMPEG_PATH" "$MEDIA_DIR/ffmpeg"
          ln -sfn "$FFPROBE_PATH" "$MEDIA_DIR/ffprobe"
          echo "VIDEOBATCH_STATIC_MEDIA_DIR=$MEDIA_DIR" >> "$GITHUB_ENV"

          export FFMPEG_PATH FFPROBE_PATH FFMPEG_VERSION FFPROBE_VERSION
          export PACKAGE_VERSION FFMPEG_SHA256 FFPROBE_SHA256 MEDIA_DIR
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": 1,
              "provider": "ubuntu-apt",
              "os": os.environ["MATRIX_OS"],
              "session": os.environ["MATRIX_SESSION"],
              "package": {
                  "name": "ffmpeg",
                  "version": os.environ["PACKAGE_VERSION"],
              },
              "media_dir": os.environ["MEDIA_DIR"],
              "ffmpeg": {
                  "path": os.environ["FFMPEG_PATH"],
                  "version": os.environ["FFMPEG_VERSION"],
                  "sha256": os.environ["FFMPEG_SHA256"],
              },
              "ffprobe": {
                  "path": os.environ["FFPROBE_PATH"],
                  "version": os.environ["FFPROBE_VERSION"],
                  "sha256": os.environ["FFPROBE_SHA256"],
              },
          }
          Path("FFMPEG_TOOLCHAIN.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Check hardcoded release literals
        run: |
          set -Eeuo pipefail
          mkdir -p matrix-logs
          python3 scripts/check_release_literal_hygiene.py \
            --report RELEASE_LITERAL_HYGIENE.json \
            2>&1 | tee matrix-logs/release-literal-hygiene.log

      - name: Run complete compatibility contract
        run: |
          set -Eeuo pipefail
          mkdir -p matrix-logs
          bash scripts/kubuntu_matrix_smoke.sh \
            2>&1 | tee matrix-logs/compatibility-contract.log

      - name: Write matrix status and collect diagnostics
        if: always()
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_SESSION: ${{ matrix.session }}
          MATRIX_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          mkdir -p matrix-logs
          test ! -f /tmp/xvfb.log || \
            cp /tmp/xvfb.log matrix-logs/xvfb.log
          test ! -f /tmp/weston.log || \
            cp /tmp/weston.log matrix-logs/weston.log
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metrics = {}
          try:
              metrics = json.loads(
                  Path("CI_PACKAGE_METRICS.json").read_text(
                      encoding="utf-8"
                  )
              )
          except (OSError, json.JSONDecodeError):
              pass

          result = {
              "schema_version": 4,
              "os": os.environ["MATRIX_OS"],
              "session": os.environ["MATRIX_SESSION"],
              "status": os.environ["MATRIX_STATUS"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": os.environ["GITHUB_SHA"],
              "package_metrics": metrics,
          }
          name = f"matrix-status-{result['os']}-{result['session']}.json"
          Path(name).write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-matrix-${{ matrix.os }}-${{ matrix.session }}
          path: |
            dist-matrix-a/*
            FFMPEG_TOOLCHAIN.json
            RELEASE_LITERAL_HYGIENE.json
            CI_PACKAGE_METRICS.json
            matrix-status-${{ matrix.os }}-${{ matrix.session }}.json
            matrix-logs/*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload machine-readable matrix status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-status-${{ matrix.os }}-${{ matrix.session }}
          path: matrix-status-${{ matrix.os }}-${{ matrix.session }}.json
          if-no-files-found: error
          retention-days: 30

  report:
    name: Consolidate PR matrix result
    if: always() && needs.matrix.result != 'skipped'
    needs:
      - matrix
    runs-on: ubuntu-latest

    steps:
      - name: Download matrix status records
        uses: actions/download-artifact@v4
        with:
          pattern: matrix-status-*
          path: matrix-status
          merge-multiple: true

      - name: Build clear consolidated report
        id: report
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = [
              ("ubuntu-22.04", "x11"),
              ("ubuntu-22.04", "wayland"),
              ("ubuntu-24.04", "x11"),
              ("ubuntu-24.04", "wayland"),
          ]
          records = {}
          for path in Path("matrix-status").glob("matrix-status-*.json"):
              record = json.loads(path.read_text(encoding="utf-8"))
              records[(record.get("os"), record.get("session"))] = record

          results = []
          for os_name, session in expected:
              record = records.get((os_name, session), {})
              results.append(
                  {
                      "os": os_name,
                      "session": session,
                      "status": record.get("status", "missing"),
                      "package_metrics": record.get("package_metrics", {}),
                  }
              )

          all_success = all(item["status"] == "success" for item in results)
          summary = {
              "schema_version": 4,
              "status": "passed" if all_success else "failed",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": os.environ["GITHUB_SHA"],
              "results": results,
          }
          Path("KUBUNTU_PR_MATRIX_SUMMARY.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          light = "🟢" if all_success else "🔴"
          lines = [
              f"# {light} Kubuntu-Prüfung einfach erklärt",
              "",
              (
                  "**Gesamtergebnis: Alle vier Kombinationen funktionieren.**"
                  if all_success
                  else "**Gesamtergebnis: Mindestens eine Kombination benötigt Aufmerksamkeit.**"
              ),
              "",
              "| System | Anzeigeart | Ergebnis | Paketvorrat | Netzdownload | APT-Dauer |",
              "|---|---|---|---|---:|---:|",
          ]
          for item in results:
              metrics = item["package_metrics"]
              status = item["status"]
              symbol = "✅" if status == "success" else "❌"
              if metrics.get("apt_cache_exact_hit"):
                  cache = "aktuelle Woche"
              elif metrics.get("apt_cache_restored"):
                  cache = "älterer Vorrat"
              else:
                  cache = "neu aufgebaut"
              download = metrics.get("download_summary", "nicht ermittelt")
              duration = metrics.get("apt_seconds")
              duration_text = f"{duration} s" if isinstance(duration, int) else "nicht ermittelt"
              session_name = "klassisch (X11)" if item["session"] == "x11" else "modern (Wayland)"
              lines.append(
                  f"| {item['os']} | {session_name} | {symbol} `{status}` | "
                  f"{cache} | {download} | {duration_text} |"
              )

          lines.extend(
              [
                  "",
                  "## Was bedeutet das für Laien?",
                  "",
                  "Die Anwendung wurde auf zwei Ubuntu-Versionen und auf den Anzeigearten X11 und Wayland geprüft. Grün bedeutet, dass Installation, FFmpeg-Nachweis, Tests und reproduzierbarer Portable-Build in allen vier Varianten funktioniert haben.",
                  "",
                  "Der wöchentliche Paketvorrat auf main verhindert, dass jede Prüfung hunderte große KDE- und Medienpakete erneut aus dem Internet laden muss.",
                  "",
                  "**Nächster Schritt:** "
                  + ("Keine manuelle Aktion nötig." if all_success else "Die erste rote Tabellenzeile öffnen und deren Logdatei prüfen."),
              ]
          )
          report = "\n".join(lines) + "\n"
          Path("KUBUNTU_PR_MATRIX_SUMMARY.md").write_text(report, encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write(report)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"all_success={'true' if all_success else 'false'}\n")
          PY

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: kubuntu-pr-matrix-summary
          path: |
            KUBUNTU_PR_MATRIX_SUMMARY.json
            KUBUNTU_PR_MATRIX_SUMMARY.md
          if-no-files-found: error
          retention-days: 30

      - name: Enforce complete success
        if: steps.report.outputs.all_success != 'true'
        run: |
          echo "::error title=Vierfachprüfung unvollständig::Mindestens eine Ubuntu-/Anzeige-Kombination ist fehlgeschlagen. Öffne die rote Tabellenzeile im Bericht."
          exit 1

  verified-source-archive:
    name: Build verified full source archive
    needs:
      - preflight
      - matrix
      - report
    if: >-
      needs.preflight.result == 'success' &&
      needs.matrix.result == 'success' &&
      needs.report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/videobatch-archive-pycache

    steps:
      - name: Check out exact verified PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate source contracts
        run: |
          set -Eeuo pipefail
          python3 scripts/build_release_manifest.py --check --json \
            | tee "$RUNNER_TEMP/release-manifest-check.json"
          python3 diagnostics/release_readiness/generate_from_evidence.py --check
          python3 -m compileall -q -f src scripts diagnostics tests
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error title=Archive validation wrote repository files::The verified checkout must remain unchanged."
            exit 1
          fi

      - name: Build reproducible complete project ZIP
        env:
          VERIFIED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          short_sha="${VERIFIED_SHA:0:12}"
          project="PROVOWARE_VIDEO_AUTOMATION_2026"
          version="$(python3 -c 'import json; from pathlib import Path; data=json.loads(Path("VERSION.json").read_text(encoding="utf-8")); value=str(data.get("build") or data.get("version") or "").strip(); assert value, "VERSION.json: build/version fehlt"; print(value)')"
          archive="${project}_${version}_${short_sha}_verified.zip"
          git archive \
            --format=zip \
            --prefix="${project}/" \
            --output="$RUNNER_TEMP/$archive" \
            "$VERIFIED_SHA"
          unzip -t "$RUNNER_TEMP/$archive"
          archive_sha256="$(sha256sum "$RUNNER_TEMP/$archive" | awk '{print $1}')"
          archive_size="$(stat -c '%s' "$RUNNER_TEMP/$archive")"
          printf '%s  %s\n' "$archive_sha256" "$archive" \
            > "$RUNNER_TEMP/$archive.sha256"
          export archive archive_sha256 archive_size VERIFIED_SHA
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "status": "verified",
              "commit": os.environ["VERIFIED_SHA"],
              "archive": os.environ["archive"],
              "archive_size": int(os.environ["archive_size"]),
              "archive_sha256": os.environ["archive_sha256"],
              "contracts": {
                  "release_manifest_check": "passed",
                  "release_evidence_drift_check": "passed",
                  "python_compileall": "passed",
                  "kubuntu_matrix": "4/4 passed",
                  "zip_integrity": "passed",
              },
          }
          Path(os.environ["RUNNER_TEMP"], "VERIFIED_SOURCE_ARTIFACT.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Upload complete verified project artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-full-source-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/${{ env.archive }}
            ${{ runner.temp }}/${{ env.archive }}.sha256
            ${{ runner.temp }}/VERIFIED_SOURCE_ARTIFACT.json
            ${{ runner.temp }}/release-manifest-check.json
          if-no-files-found: error
          retention-days: 30
