name: Kubuntu compatibility matrix PR validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/kubuntu-pr-matrix.yml
      - .github/workflows/kubuntu-26-04-wayland-preview.yml
      - PLATFORM_SUPPORT.json
      - docs/KUBUNTU_26_04_WAYLAND.md
      - diagnostics/**
      - scripts/**
      - src/**
      - tests/**
      - RELEASE_MANIFEST.json
      - VERSION.json
      - pyproject.toml
      - requirements.lock
      - requirements-qt.txt
      - requirements-toolchain.lock

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'
  PYTHONPATH: src

concurrency:
  group: kubuntu-pr-matrix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Fast read-only release preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/videobatch-preflight-pycache
      RUFF_CACHE_DIR: /tmp/videobatch-preflight-ruff-cache
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install exact Ruff syntax checker
        run: |
          set -Eeuo pipefail
          python3 -m pip install ruff==0.16.1
          test "$(python3 -m ruff --version)" = "ruff 0.16.1"

      - name: Compile Python without repository writes
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q -f src scripts diagnostics tests

      - name: Run Ruff syntax and undefined-name gate
        run: |
          set -Eeuo pipefail
          python3 -m ruff check src scripts diagnostics tests --select E9,F63,F7,F82 --no-cache

      - name: Check release manifest and generated outputs
        run: |
          set -Eeuo pipefail
          python3 scripts/build_release_manifest.py --check --json
          python3 diagnostics/release_readiness/generate_from_evidence.py --check

      - name: Prove repository remained unchanged
        if: always()
        run: |
          set -Eeuo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error title=Read-only preflight wrote repository files::The preflight must leave the checkout unchanged."
            exit 1
          fi

  target:
    name: Kubuntu 26.04 / native Wayland
    needs: [preflight]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      XDG_SESSION_TYPE: wayland
      XDG_CURRENT_DESKTOP: KDE
      DESKTOP_SESSION: plasmawayland
      QT_QPA_PLATFORM: wayland
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Kubuntu Wayland runtime subset
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            weston \
            wl-clipboard \
            xdg-utils \
            xdg-desktop-portal \
            xdg-desktop-portal-kde \
            libnotify-bin \
            libegl1 \
            libgl1 \
            libfontconfig1 \
            libwayland-client0 \
            libxkbcommon0
          python3 -m pip install -r requirements-qt.txt
          python3 -m pip install pytest==8.4.2

      - name: Verify Ubuntu 26.04 runner base
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$VERSION_ID" = "26.04"
          command -v ffmpeg
          command -v ffprobe
          command -v weston
          command -v wl-copy
          test -f /usr/share/xdg-desktop-portal/portals/kde.portal

      - name: Start native headless Wayland compositor
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-vb" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" weston \
            --backend=headless-backend.so \
            --socket=wayland-vb \
            --idle-time=0 >/tmp/weston.log 2>&1 &
          for _ in $(seq 1 20); do
            test -S "$RUNNER_TEMP/xdg/wayland-vb" && exit 0
            sleep 0.25
          done
          cat /tmp/weston.log
          exit 1

      - name: Run Kubuntu 26.04 platform contracts
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q tests/test_platform_integration.py

      - name: Prove Qt is using native Wayland
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from PySide6.QtWidgets import QApplication

          app = QApplication([])
          platform = app.platformName().lower()
          print(f"QT_PLATFORM={platform}")
          assert "wayland" in platform, platform
          app.quit()
          PY

      - name: Run real Qt Phase 3 smoke on Wayland
        run: |
          set -Eeuo pipefail
          python3 tests/qt_phase3_smoke.py

      - name: Upload Wayland diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubuntu-26-04-wayland-diagnostics
          path: /tmp/weston.log
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Consolidate PR matrix result
    if: always()
    needs: [preflight, target]
    runs-on: ubuntu-26.04
    steps:
      - name: Enforce sole supported target
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TARGET_RESULT: ${{ needs.target.result }}
        run: |
          set -Eeuo pipefail
          printf 'Preflight: %s\nKubuntu 26.04 / Wayland: %s\n' "$PREFLIGHT_RESULT" "$TARGET_RESULT"
          test "$PREFLIGHT_RESULT" = success
          test "$TARGET_RESULT" = success
          echo '🟢 Einziger Zielpfad bestanden: Kubuntu 26.04 LTS · KDE Plasma · natives Wayland · Qt 6'
