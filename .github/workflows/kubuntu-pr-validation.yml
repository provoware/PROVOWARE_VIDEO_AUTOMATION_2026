name: Trusted Kubuntu PR validation

run-name: >-
  PR #${{ inputs.pr_number }} validation · ${{ inputs.head_sha }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      base_sha:
        description: Exact current main commit
        required: true
        type: string
      head_sha:
        description: Exact pull request head commit
        required: true
        type: string
      head_ref:
        description: Pull request branch name
        required: true
        type: string
      report_issue:
        description: Issue number for run links and reports
        required: false
        default: '12'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: trusted-kubuntu-pr-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts:${{ github.workspace }}/diagnostics/release_readiness
  EXPECTED_BASE_SHA: ${{ inputs.base_sha }}
  EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}

jobs:
  ancestry:
    name: Trusted PR ancestry guard
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable inputs and ancestry
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin "$EXPECTED_BASE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BASE_SHA"
          python3 scripts/check_pr_ancestry.py \
            --base "$EXPECTED_BASE_SHA" \
            --head "$EXPECTED_HEAD_SHA" \
            --report PR_ANCESTRY_REPORT.json

      - name: Upload ancestry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-pr-ancestry-${{ inputs.head_sha }}
          path: PR_ANCESTRY_REPORT.json
          if-no-files-found: error
          retention-days: 30

  preflight:
    name: Read-only manifest and evidence preflight
    needs: ancestry
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/preflight-pycache
      RUFF_CACHE_DIR: /tmp/preflight-ruff-cache
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Install exact syntax checker and test runner
        run: |
          set -Eeuo pipefail
          python3 -m pip install ruff==0.16.1 pytest==8.4.2
          test "$(python3 -m ruff --version)" = "ruff 0.16.1"

      - name: Compile and lint Python
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q -f src scripts diagnostics tests
          python3 -m ruff check src scripts diagnostics tests \
            --select E9,F63,F7,F82 --no-cache
          python3 -m pytest -q tests/test_tk_free_core_contract.py

      - name: Check release manifest and canonical evidence
        run: |
          set -Eeuo pipefail
          python3 scripts/build_release_manifest.py --check --json \
            | tee "$RUNNER_TEMP/release-manifest-check.json"
          python3 diagnostics/release_readiness/generate_from_evidence.py --check

      - name: Prove preflight remained read-only
        if: always()
        run: |
          set -Eeuo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error title=Preflight wrote repository files::The exact PR checkout must remain unchanged."
            exit 1
          fi

  target:
    name: Kubuntu 26.04 / native Wayland / Qt 6
    needs: preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      XDG_SESSION_TYPE: wayland
      XDG_CURRENT_DESKTOP: KDE
      DESKTOP_SESSION: plasmawayland
      QT_QPA_PLATFORM: wayland
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Install native Wayland runtime subset
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            weston \
            wl-clipboard \
            xdg-utils \
            xdg-desktop-portal \
            xdg-desktop-portal-kde \
            libnotify-bin \
            libegl1 \
            libgl1 \
            libfontconfig1 \
            libwayland-client0 \
            libxkbcommon0
          python3 -m pip install -r requirements-qt.txt
          python3 -m pip install pytest==8.4.2

      - name: Start native headless Wayland compositor
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$VERSION_ID" = "26.04"
          mkdir -p "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-trusted" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" weston \
            --backend=headless-backend.so \
            --socket=wayland-trusted \
            --idle-time=0 >/tmp/weston-trusted.log 2>&1 &
          for _ in $(seq 1 20); do
            test -S "$RUNNER_TEMP/xdg/wayland-trusted" && exit 0
            sleep 0.25
          done
          cat /tmp/weston-trusted.log
          exit 1

      - name: Run complete supported-target contract
        run: |
          set -Eeuo pipefail
          python3 scripts/check_release_literal_hygiene.py --report RELEASE_LITERAL_HYGIENE.json
          python3 -m pytest -q \
            tests/test_platform_integration.py \
            tests/test_tk_free_core_contract.py \
            tests/test_qt_phase2_contract.py \
            tests/test_qt_phase3_contract.py
          python3 - <<'PY'
          import sys
          from PySide6.QtWidgets import QApplication

          app = QApplication([])
          backend = app.platformName().lower()
          print(f"QT_QPA_BACKEND={backend}")
          assert "wayland" in backend, backend
          assert "tkinter" not in sys.modules
          app.quit()
          PY
          python3 tests/qt_phase3_smoke.py

      - name: Write target status
        if: always()
        env:
          TARGET_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              "schema_version": 2,
              "target": "Kubuntu 26.04 LTS / KDE Plasma / native Wayland / Qt 6",
              "status": os.environ["TARGET_STATUS"],
              "commit": os.environ["EXPECTED_HEAD_SHA"],
          }
          Path("KUBUNTU_26_04_WAYLAND_STATUS.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubuntu-26-04-wayland-status-${{ inputs.head_sha }}
          path: |
            KUBUNTU_26_04_WAYLAND_STATUS.json
            RELEASE_LITERAL_HYGIENE.json
            /tmp/weston-trusted.log
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Consolidate Kubuntu 26.04 Wayland target
    if: always() && needs.target.result != 'skipped'
    needs: target
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      TARGET_RESULT: ${{ needs.target.result }}
    steps:
      - name: Enforce sole supported target
        run: |
          set -Eeuo pipefail
          test "$TARGET_RESULT" = success
          {
            echo '# Kubuntu PR validation'
            echo
            echo '🟢 Kubuntu 26.04 LTS · KDE Plasma · natives Wayland · Qt 6 bestanden.'
            echo
            echo "Head: \`${EXPECTED_HEAD_SHA}\`"
          } | tee "$GITHUB_STEP_SUMMARY"

  verified-source-archive:
    name: Build verified full source archive
    needs: [ancestry, preflight, target, report]
    if: >-
      needs.ancestry.result == 'success' &&
      needs.preflight.result == 'success' &&
      needs.target.result == 'success' &&
      needs.report.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: /tmp/archive-pycache
    steps:
      - name: Check out exact verified PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate source contracts
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python3 scripts/build_release_manifest.py --check --json \
            | tee "$RUNNER_TEMP/release-manifest-check.json"
          python3 diagnostics/release_readiness/generate_from_evidence.py --check
          python3 -m compileall -q -f src scripts diagnostics tests
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build reproducible full project ZIP
        run: |
          set -Eeuo pipefail
          short_sha="${EXPECTED_HEAD_SHA:0:12}"
          version="$(python3 -c 'import json; from pathlib import Path; data=json.loads(Path("VERSION.json").read_text(encoding="utf-8")); value=str(data.get("build") or data.get("version") or "").strip(); assert value, "VERSION.json: build/version fehlt"; print(value)')"
          archive="PROVOWARE_VIDEO_AUTOMATION_2026_${version}_${short_sha}_verified.zip"
          git archive \
            --format=zip \
            --prefix=PROVOWARE_VIDEO_AUTOMATION_2026/ \
            --output="$RUNNER_TEMP/$archive" \
            "$EXPECTED_HEAD_SHA"
          unzip -t "$RUNNER_TEMP/$archive"
          sha256sum "$RUNNER_TEMP/$archive" > "$RUNNER_TEMP/$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload verified full source
        uses: actions/upload-artifact@v4
        with:
          name: verified-full-source-${{ inputs.head_sha }}
          path: |
            ${{ runner.temp }}/${{ env.ARCHIVE }}
            ${{ runner.temp }}/${{ env.ARCHIVE }}.sha256
            ${{ runner.temp }}/release-manifest-check.json
          if-no-files-found: error
          retention-days: 30
