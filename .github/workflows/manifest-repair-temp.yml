name: Temporary manifest repair

on:
  push:
    branches:
      - automation/quick-preflight-card-20260904-2307

permissions:
  contents: write

concurrency:
  group: temporary-manifest-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: '0'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: automation/quick-preflight-card-20260904-2307
          fetch-depth: 0

      - name: Verify requested head is unchanged ancestor
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 61bb870cde9122b314ecdd88d1c95276358fc1d8 HEAD
          test "$(git diff --name-only 61bb870cde9122b314ecdd88d1c95276358fc1d8..HEAD)" = ".github/workflows/manifest-repair-temp.yml"

      - name: Build final tree and regenerate canonical manifest
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/manifest-repair-temp.yml
          python3 scripts/build_release_manifest.py
          python3 scripts/build_release_manifest.py --check --json | tee /tmp/release-manifest-check.json
          python3 scripts/validate_documentation.py
          changed="$(git diff HEAD --name-only | sort)"
          expected=$(printf '%s\n' '.github/workflows/manifest-repair-temp.yml' 'RELEASE_MANIFEST.json' | sort)
          test "$changed" = "$expected"

      - name: Commit canonical manifest only in final PR diff
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASE_MANIFEST.json
          git commit -m "chore(release): regenerate manifest for start guide"
          git push origin HEAD:automation/quick-preflight-card-20260904-2307
