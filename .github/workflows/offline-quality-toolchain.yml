name: Exact offline quality toolchain

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/offline-quality-toolchain.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.lock'
      - 'requirements-quality.lock'
      - 'requirements-toolchain.lock'
      - 'TOOLCHAIN_CONTRACT.json'
      - 'quality-toolchain.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff, MyPy, Bandit and pip-audit offline
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: ${{ github.workspace }}/src
      XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
      XDG_STATE_HOME: ${{ runner.temp }}/xdg-state
      XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
      VIDEOBATCH_DIAGNOSTICS_DIR: ${{ github.workspace }}/quality-toolchain-evidence/diagnostics
      VIDEOBATCH_PIP_AUDIT_CACHE: ${{ runner.temp }}/pip-audit-cache

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-toolchain.lock

      - name: Verify exact quality contract
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "ruff": "0.16.1",
              "mypy": "2.3.0",
              "bandit": "1.9.4",
              "pip-audit": "2.10.1",
          }
          contract = json.loads(Path("TOOLCHAIN_CONTRACT.json").read_text(encoding="utf-8"))
          quality = contract["packages"]["quality"]
          actual = {name: quality.get(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"Exact version contract mismatch: {actual!r}")
          print(json.dumps({"status": "passed", "versions": actual}, indent=2))
          PY

      - name: Build and verify hashed wheelhouse
        run: |
          set -Eeuo pipefail
          chmod +x quality-toolchain.sh
          ./quality-toolchain.sh build
          ./quality-toolchain.sh verify

      - name: Install exact environment from wheelhouse only
        run: |
          set -Eeuo pipefail
          ./quality-toolchain.sh prepare --offline-only --replace
          python3 scripts/toolchain.py gate --scope quality

      - name: Record exact installed versions
        run: |
          set -Eeuo pipefail
          mkdir -p quality-toolchain-evidence
          QUALITY_PYTHON="$(python3 scripts/toolchain.py path --scope quality --quiet)"
          "$QUALITY_PYTHON" - <<'PY' > quality-toolchain-evidence/installed-versions.json
          import importlib.metadata as metadata
          import json
          import platform
          import sys

          names = ["ruff", "mypy", "bandit", "pip-audit", "pytest", "coverage"]
          print(json.dumps({
              "python": sys.version,
              "platform": platform.platform(),
              "packages": {name: metadata.version(name) for name in names},
          }, indent=2, sort_keys=True))
          PY
          cp toolchain_wheelhouse/TOOLCHAIN_WHEELHOUSE_MANIFEST.json \
             quality-toolchain-evidence/wheelhouse-manifest.json
          cp toolchain_wheelhouse/requirements-toolchain-resolved.lock \
             quality-toolchain-evidence/requirements-toolchain-resolved.lock

      - name: Prime pinned pip-audit advisory cache
        id: prime_audit
        run: |
          set -Eeuo pipefail
          mkdir -p "$VIDEOBATCH_PIP_AUDIT_CACHE" quality-toolchain-evidence
          QUALITY_PYTHON="$(python3 scripts/toolchain.py path --scope quality --quiet)"
          set +e
          "$QUALITY_PYTHON" -m pip_audit \
            --cache-dir "$VIDEOBATCH_PIP_AUDIT_CACHE" \
            --no-deps \
            --disable-pip \
            --progress-spinner off \
            -r requirements.lock \
            > quality-toolchain-evidence/pip-audit-cache-prime.log 2>&1
          prime_exit=$?
          set -e
          echo "exit_code=$prime_exit" >> "$GITHUB_OUTPUT"
          find "$VIDEOBATCH_PIP_AUDIT_CACHE" -type f -printf '%P\t%s\n' \
            | sort > quality-toolchain-evidence/pip-audit-cache-inventory.tsv
          test -s quality-toolchain-evidence/pip-audit-cache-inventory.tsv

      - name: Recreate environment offline before final gates
        run: |
          set -Eeuo pipefail
          ./quality-toolchain.sh prepare --offline-only --replace
          ./quality-toolchain.sh verify

      - name: Execute all four gates with network blocked
        id: offline_gate
        run: |
          set -Eeuo pipefail
          QUALITY_PYTHON="$(python3 scripts/toolchain.py path --scope quality --quiet)"
          export PATH="$(dirname "$QUALITY_PYTHON"):$PATH"
          set +e
          "$QUALITY_PYTHON" scripts/run_external_quality.py \
            --mode required \
            --offline \
            > quality-toolchain-evidence/offline-quality-gate.log 2>&1
          gate_exit=$?
          set -e
          echo "exit_code=$gate_exit" >> "$GITHUB_OUTPUT"
          cat quality-toolchain-evidence/offline-quality-gate.log

      - name: Verify report completeness
        if: always()
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("quality-toolchain-evidence/diagnostics/external_quality_latest.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          names = [item.get("tool") for item in report.get("results", [])]
          expected = ["ruff", "mypy", "bandit", "pip-audit"]
          if names != expected:
              raise SystemExit(f"Incomplete tool report: {names!r}")
          if report.get("offline") is not True:
              raise SystemExit("Offline guard was not recorded as active")
          print(json.dumps({
              "offline": report["offline"],
              "results": [
                  {
                      "tool": item.get("tool"),
                      "status": item.get("status"),
                      "version": item.get("version"),
                      "returncode": item.get("returncode"),
                  }
                  for item in report["results"]
              ],
          }, indent=2))
          PY

      - name: Upload complete quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-offline-quality-evidence
          path: |
            quality-toolchain-evidence/
            toolchain_wheelhouse/TOOLCHAIN_WHEELHOUSE_MANIFEST.json
            toolchain_wheelhouse/requirements-toolchain-resolved.lock
          if-no-files-found: error
          retention-days: 30

      - name: Enforce external quality result
        if: always()
        env:
          GATE_EXIT: ${{ steps.offline_gate.outputs.exit_code }}
        run: |
          set -Eeuo pipefail
          test -n "$GATE_EXIT"
          exit "$GATE_EXIT"
