name: Iteration 40D · Coverage contract one-shot

on:
  push:
    branches:
      - iteration/40d-coverage-contract-20260904

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  validate-coverage-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Quellen holen
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Systempakete
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ffmpeg

      - name: Exakt gesperrte Toolchain installieren
        run: |
          set -Eeuo pipefail
          python -m pip install --requirement requirements-toolchain.lock

      - name: Kompilierung
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/40d-pycache
        run: |
          set -Eeuo pipefail
          python -m compileall -q -f scripts src tests

      - name: Iteration 40D Fokusregression
        run: |
          set -Eeuo pipefail
          xvfb-run -a python -m pytest -q -p no:cacheprovider \
            tests/test_iteration40d_canonical_runtime_coverage.py

      - name: Vollregression
        run: |
          set -Eeuo pipefail
          xvfb-run -a python -m pytest -q -p no:cacheprovider

      - name: Coverage 80/65
        run: |
          set -Eeuo pipefail
          xvfb-run -a python -m pytest -q -p no:cacheprovider \
            --cov=videobatch_fast \
            --cov-branch \
            --cov-fail-under=0 \
            --cov-report=term \
            --cov-report=json:coverage.json
          python scripts/coverage_policy.py coverage.json 80 65

      - name: Architektur-Audit
        run: |
          set -Eeuo pipefail
          python scripts/architecture_audit.py

      - name: Release-Manifest im finalen Arbeitsbaum neu erzeugen und prüfen
        run: |
          set -Eeuo pipefail
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json
          python scripts/validate_release_manifest.py

      - name: Deterministisches Release-ZIP prüfen
        run: |
          set -Eeuo pipefail
          python scripts/package_release.py --output "$RUNNER_TEMP/VideoBatch_40D.zip"
          python scripts/verify_release_zip.py "$RUNNER_TEMP/VideoBatch_40D.zip"
