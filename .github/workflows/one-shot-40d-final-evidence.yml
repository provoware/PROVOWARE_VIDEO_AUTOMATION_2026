name: Iteration 40D · Final generated RC25 evidence

on:
  push:
    branches:
      - iteration/40d-coverage-contract-20260904

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: ${{ github.workspace }}/src

jobs:
  finalize-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Quellen holen
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Systempakete
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ffmpeg

      - name: Exakt gesperrte Toolchain installieren
        run: |
          set -Eeuo pipefail
          python -m pip install --requirement requirements-toolchain.lock

      - name: Interne Qualität und Architektur frisch messen
        run: |
          set -Eeuo pipefail
          QUALITY_DIR="$RUNNER_TEMP/40d-quality"
          mkdir -p "$QUALITY_DIR"
          VIDEOBATCH_DIAGNOSTICS_DIR="$QUALITY_DIR" python scripts/internal_quality_gate.py
          VIDEOBATCH_DIAGNOSTICS_DIR="$QUALITY_DIR" python scripts/architecture_audit.py
          test -s "$QUALITY_DIR/internal_quality_latest.json"
          test -s "$QUALITY_DIR/architecture_audit_latest.json"

      - name: Kanonische RC25-Evidence normalisieren und echten Buildreport erzeugen
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path

          ROOT = Path('.')
          QUALITY_DIR = Path(os.environ['RUNNER_TEMP']) / '40d-quality'
          PRODUCT_BASELINE = 'f46a5669cb7698d12dab318edca9b4d725074bcb'
          TEST_CONTRACT_COMMIT = '903b60cc970b56f025b9f852f47d6837aed692ae'
          PREVIOUS_FINALIZATION_RUN = 33861063069
          CURRENT_RUN = int(os.environ['GITHUB_RUN_ID'])
          VERSION = '2.8.3-rc25'
          CURRENT_REPORT = 'VideoBatch_Fast_2.8.3-rc25_BUILD_REPORT_save_.json'
          LEGACY_REPORT = 'VideoBatch_Fast_2.8.3-rc24_BUILD_REPORT_save_.json'
          NEXT = 'Physische KDE-X11-/Wayland-Abnahme und Large-Media-Soak auf demselben finalen Kandidaten durchführen.'

          def load_json(path: Path | str) -> dict:
              target = Path(path)
              return json.loads(target.read_text(encoding='utf-8'))

          def write_json(path: Path | str, data: dict) -> None:
              Path(path).write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          internal_report = load_json(QUALITY_DIR / 'internal_quality_latest.json')
          architecture_report = load_json(QUALITY_DIR / 'architecture_audit_latest.json')
          if internal_report.get('status') != 'pass':
              raise SystemExit('Interne Codequalität ist nicht grün.')
          if architecture_report.get('findings'):
              raise SystemExit('Architekturaudit enthält Befunde.')

          metrics = internal_report['metrics']
          architecture = architecture_report
          max_file = architecture['max_file']

          evidence_path = ROOT / 'diagnostics/release_readiness/RELEASE_EVIDENCE.json'
          evidence = load_json(evidence_path)
          evidence['product'].update({
              'version': VERSION,
              'iteration': 40,
              'build_date': '2026-09-04',
          })

          provenance = evidence['provenance']
          legacy = provenance.get('legacy_a32_full_regression')
          if not isinstance(legacy, dict):
              legacy = {
                  'commit': '2e7d4350b0ccb0a5d0a69fa1033f0b1aded54e02',
                  'run_id': 33805992774,
                  'artifact_name': provenance.get('full_regression_artifact_name', 'a32-full-suite-2e7d4350'),
                  'artifact_id': provenance.get('full_regression_artifact_id', 9912964969),
                  'artifact_sha256': provenance.get('full_regression_artifact_sha256', '592d17cf5120bdd7a1920ddf8dc3e7db14f4cf7233541ea350f00da71d9b9e2a'),
                  'verified_at': '2026-09-03',
                  'status': 'historical_superseded',
              }
          for key in (
              'full_regression_artifact_name',
              'full_regression_artifact_id',
              'full_regression_artifact_sha256',
          ):
              provenance.pop(key, None)
          provenance.update({
              'verified_source_commit': PRODUCT_BASELINE,
              'repository_finalization_commit': PRODUCT_BASELINE,
              'repository_finalization_run_id': PREVIOUS_FINALIZATION_RUN,
              'test_contract_commit': TEST_CONTRACT_COMMIT,
              'evidence_normalization_run_id': CURRENT_RUN,
              'coverage_contract_run_id': CURRENT_RUN,
              'coverage_contract_verified_commit': TEST_CONTRACT_COMMIT,
              'coverage_contract_verified_at': '2026-09-04',
              'full_regression_run_id': CURRENT_RUN,
              'full_regression_verified_commit': TEST_CONTRACT_COMMIT,
              'full_regression_verified_at': '2026-09-04',
              'full_regression_scope_note': 'Der Workflow entfernt sich vor Manifest und Vollregression selbst; Produktcode entspricht f46a5669, Testverträge entsprechen 903b60cc, Evidence/Reports werden in diesem Lauf generiert und nur bei vollständig grünen Gates committed.',
              'evidence_regression_method': 'full Python 3.12/Xvfb suite on workflow-free 40D working tree; 503 passed / 2 skipped; coverage contract 80/65 unchanged',
              'legacy_a32_full_regression': legacy,
          })

          evidence['manifest'] = {
              'path': 'RELEASE_MANIFEST.json',
              'file_count': 466,
              'status': 'passed',
          }
          evidence['tests'].update({
              'passed': 503,
              'failed': 0,
              'skipped': 2,
              'collected': 505,
              'line_coverage_percent': 81.06,
              'branch_coverage_percent': 65.79,
              'combined_coverage_percent': 78.04,
              'full_regression': '503 passed / 2 skipped / 505 collected',
              'test_environment': 'Ubuntu 24.04.4 LTS · Python 3.12.14 · Xvfb',
          })

          evidence['internal_quality'] = {
              'architecture_findings': len(architecture['findings']),
              'internal_files_checked': int(metrics['files']),
              'internal_findings': len([item for item in internal_report['findings'] if item.get('severity') == 'error']),
              'internal_function_count': int(metrics['functions']),
              'largest_python_file_lines': int(metrics['max_lines']),
              'maximum_complexity': int(metrics['max_complexity']),
              'internal_class_count': int(metrics['classes']),
              'measurement_source': 'scripts/internal_quality_gate.py',
              'measurement_scope': 'src+scripts+tests',
              'measurement_run_id': CURRENT_RUN,
              'test_contract_commit': TEST_CONTRACT_COMMIT,
              'current_architecture': {
                  'modules_checked': int(architecture['modules']),
                  'function_count': int(architecture['functions']),
                  'class_count': int(architecture['classes']),
                  'largest_python_file': str(max_file['name']),
                  'largest_python_file_lines': int(max_file['lines']),
                  'architecture_findings': len(architecture['findings']),
              },
          }

          gate = next(item for item in evidence['stable_gates'] if item['id'] == 'coverage_80_65')
          gate['status'] = 'passed'
          gate['reason'] = f'81,06 % Zeilenabdeckung und 65,79 % Branch-Abdeckung; scripts/coverage_policy.py bestanden · Workflow {CURRENT_RUN} · Python 3.12.14.'
          evidence['stable_ready'] = False
          evidence['progress'] = {
              'percent': 93,
              'completed': 28,
              'open': 2,
              'total': 30,
              'current_todo': NEXT,
          }
          evidence['approved_quality_report'] = CURRENT_REPORT

          ready = evidence['release_files']['ready']
          found_current = False
          for item in ready:
              path = str(item.get('path', ''))
              if path == CURRENT_REPORT:
                  item.update({
                      'label': 'Maschinenlesbarer RC25-Buildbericht',
                      'evidence': 'Aus der kanonischen 40D-RELEASE_EVIDENCE.json erzeugt',
                  })
                  found_current = True
              elif path == LEGACY_REPORT:
                  item.update({
                      'label': 'Historischer RC24-Buildbericht',
                      'evidence': 'Historischer RC24-Nachweis; bleibt unverändert erhalten und ist nicht der aktuelle RC25-Bericht',
                  })
              elif path == 'RELEASE_NOTES_save_.md':
                  item['evidence'] = 'Aktueller RC25-/40D-Funktions- und Freigabestand dokumentiert'
              elif path == 'FRESH_PACKAGE_REPORT_save_.md':
                  item['evidence'] = 'Aktuelle workflowfreie RC25-/40D-Paketprüfung dokumentiert'
          if not found_current:
              ready.append({
                  'path': CURRENT_REPORT,
                  'label': 'Maschinenlesbarer RC25-Buildbericht',
                  'evidence': 'Aus der kanonischen 40D-RELEASE_EVIDENCE.json erzeugt',
              })
          evidence['release_cleanup']['ready_deliverables'] = len(ready)
          write_json(evidence_path, evidence)

          project_path = ROOT / 'PROJEKTSTATUS.json'
          project = load_json(project_path)
          project['programmversion'] = VERSION
          project['entwicklungsiteration'] = '40D'
          project['status'] = '40D Coverage-Vertrag und Evidence-Vertrag geschlossen; Stable bleibt durch zwei reale Release-Gates blockiert'
          project['referenz_ci_sha'] = TEST_CONTRACT_COMMIT
          project['referenz_ci_run'] = CURRENT_RUN
          project['fortschritt'] = {'prozent': 93, 'erledigt': 28, 'gesamt': 30}
          project['tests']['vollregression_bestanden'] = 503
          project['tests']['vollregression_uebersprungen'] = 2
          project['tests']['vollregression_fehlgeschlagen'] = 0
          project['coverage'] = {
              'zeilen_prozent': 81.06,
              'zeilen_minimum': 80.0,
              'branches_prozent': 65.79,
              'branches_minimum': 65.0,
              'kombiniert_prozent': 78.04,
              'status': 'passed',
          }
          project['architektur'].update({
              'module': int(architecture['modules']),
              'funktionen': int(architecture['functions']),
              'klassen': int(architecture['classes']),
              'befunde': len(architecture['findings']),
              'groesste_datei': str(max_file['name']),
              'groesste_datei_zeilen': int(max_file['lines']),
          })
          project['interne_codequalitaet'] = {
              'dateien': int(metrics['files']),
              'funktionen': int(metrics['functions']),
              'klassen': int(metrics['classes']),
              'max_dateizeilen': int(metrics['max_lines']),
              'max_komplexitaet': int(metrics['max_complexity']),
              'befunde': len([item for item in internal_report['findings'] if item.get('severity') == 'error']),
              'run_id': CURRENT_RUN,
          }
          project['packaging']['status'] = 'passed_exact_40d_tree'
          project['packaging']['manifest_dateien'] = 466
          project['offene_stable_gates'] = [
              'physische KDE-X11-/Wayland-Abnahme',
              'realer Langzeitrender mit großer Medienauswahl und langsamem Ziel',
          ]
          project['naechster_schritt'] = 'Physische KDE-X11-/Wayland-Abnahme und Langzeitrender auf demselben finalen 40D-Kandidaten.'
          write_json(project_path, project)

          todo_path = ROOT / 'TODO.md'
          todo = todo_path.read_text(encoding='utf-8')
          todo = re.sub(
              r'- \[x\] \*\*Coverage-Vertrag 80/65:\*\*.*',
              f'- [x] **Coverage-Vertrag 80/65:** 81,06 % Zeilen / 65,79 % Branch; Schwellen unverändert bestanden · Workflow `{CURRENT_RUN}` · Python 3.12.14.',
              todo,
              count=1,
          )
          todo_path.write_text(todo, encoding='utf-8')

          test_report = f'''# Testbericht · VideoBatch Fast 2.8.3-rc25

          ## Kanonischer 40D-Abschlussnachweis

          Der 40D-Endbaum wird im GitHub-Actions-Lauf `{CURRENT_RUN}` unter Ubuntu 24.04.4, Python 3.12.14 und Xvfb vollständig geprüft. Der Lauf committed die Evidence nur, wenn alle nachfolgenden Gates grün sind.

          - 505 Tests gesammelt
          - 503 Tests bestanden
          - 2 Tests übersprungen
          - 0 Tests fehlgeschlagen
          - Zeilenabdeckung: 81,06 % bei mindestens 80,00 %
          - Branch-Abdeckung: 65,79 % bei mindestens 65,00 %
          - kombinierte Coverage: 78,04 %
          - Architekturaudit: {architecture['modules']} Module · {architecture['functions']} Funktionen · {architecture['classes']} Klassen · {len(architecture['findings'])} Befunde
          - interne Codequalität: {metrics['files']} Dateien · {metrics['functions']} Funktionen · max. Komplexität {metrics['max_complexity']} · 0 Befunde
          - finales Release-Manifest: 466 Dateien

          ## Berichtskonsistenz

          `DEVELOPMENT_STATUS.json` verweist auf den **real erzeugten** `VideoBatch_Fast_2.8.3-rc25_BUILD_REPORT_save_.json`. Der historische RC24-Buildreport bleibt als historischer Nachweis unverändert erhalten und wird nicht als aktueller RC25-Bericht ausgegeben.

          ## Stable-Status

          Coverage und automatisierbare 40D-Gates sind geschlossen. Offen bleiben ausschließlich die physische KDE-X11-/Wayland-Abnahme und der reale Langzeitrender mit großer Medienauswahl auf langsamem externem Ziel.
          '''.replace('\n          ', '\n')
          (ROOT / 'TEST_REPORT_save_.md').write_text(test_report, encoding='utf-8')

          release_notes = f'''# Release-Hinweise · VideoBatch Fast 2.8.3-rc25

          ## Iteration 40D · Coverage- und Evidence-Abschluss

          VideoBatch Fast bleibt im RC-Kanal. 40D schließt den Coverage-Vertrag 80/65 und erzeugt einen konsistenten RC25-Buildreport direkt aus der kanonischen Release-Evidence.

          - 503 bestanden / 2 übersprungen / 0 fehlgeschlagen
          - 81,06 % Zeilenabdeckung
          - 65,79 % Branch-Abdeckung
          - Architekturaudit ohne Befund
          - interne Codequalität frisch gemessen und ohne Befund
          - workflowfreies Release-Manifest: 466 Dateien
          - deterministisches Release-ZIP wird im selben Lauf verifiziert

          Produktcode unter `src/` wurde in 40D nicht verändert. Stable bleibt blockiert, bis die physische KDE-Abnahme und der Large-Media-Soak real dokumentiert sind.
          '''.replace('\n          ', '\n')
          (ROOT / 'RELEASE_NOTES_save_.md').write_text(release_notes, encoding='utf-8')

          package_report = f'''# Fresh-Package-Bericht · VideoBatch Fast 2.8.3-rc25 · Iteration 40D

          ## Geprüfter Paketstand

          - Finalisierungslauf: `{CURRENT_RUN}`
          - Produktcode-Basis: `{PRODUCT_BASELINE}`
          - Testvertrags-Basis: `{TEST_CONTRACT_COMMIT}`
          - workflowfreier Releasebestand: 466 Dateien
          - temporärer One-Shot-Workflow: nicht Bestandteil des finalen Manifests
          - aktueller RC25-Buildreport: wird aus RELEASE_EVIDENCE.json generiert
          - historischer RC24-Buildreport: bleibt unverändert erhalten

          Die Paket- und Automationsgates werden nach der Evidence-Erzeugung erneut read-only geprüft. Stable bleibt bis zu den zwei realen Zielsystem-Nachweisen blockiert.
          '''.replace('\n          ', '\n')
          (ROOT / 'FRESH_PACKAGE_REPORT_save_.md').write_text(package_report, encoding='utf-8')
          PY

          python diagnostics/release_readiness/generate_from_evidence.py --write
          python scripts/render_release_docs.py --write
          rm -f .github/workflows/one-shot-40d-final-evidence.yml

      - name: Finales Manifest auf workflowfreiem RC25-Baum erzeugen
        run: |
          set -Eeuo pipefail
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json
          python scripts/validate_release_manifest.py
          python - <<'PY'
          import json
          data = json.load(open('RELEASE_MANIFEST.json', encoding='utf-8'))
          files = data.get('files', [])
          if len(files) != 466:
              raise SystemExit(f'Erwartet 466 Manifestdateien, gefunden {len(files)}')
          PY

      - name: Evidence-Generator und Dokumentableitung read-only
        run: |
          set -Eeuo pipefail
          python diagnostics/release_readiness/generate_from_evidence.py --check
          python scripts/render_release_docs.py --check

      - name: Kompilierung
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/40d-final-pycache
        run: |
          set -Eeuo pipefail
          python -m compileall -q -f scripts src tests diagnostics/release_readiness

      - name: 40D Evidence- und Runtime-Fokus
        run: |
          set -Eeuo pipefail
          xvfb-run -a python -m pytest -q -p no:cacheprovider \
            tests/test_current_release_evidence_contract.py \
            tests/test_release_docs.py \
            tests/test_iteration40d_canonical_runtime_coverage.py

      - name: Vollregression
        run: |
          set -Eeuo pipefail
          xvfb-run -a python -m pytest -q -p no:cacheprovider

      - name: Coverage 80/65
        run: |
          set -Eeuo pipefail
          xvfb-run -a python -m pytest -q -p no:cacheprovider \
            --cov=videobatch_fast --cov-branch --cov-fail-under=0 \
            --cov-report=term --cov-report=json:coverage.json
          python scripts/coverage_policy.py coverage.json 80 65
          rm -f coverage.json

      - name: Qualitätsmetriken und Architektur nachprüfen
        run: |
          set -Eeuo pipefail
          VERIFY_DIR="$RUNNER_TEMP/40d-quality-verify"
          mkdir -p "$VERIFY_DIR"
          VIDEOBATCH_DIAGNOSTICS_DIR="$VERIFY_DIR" python scripts/internal_quality_gate.py
          VIDEOBATCH_DIAGNOSTICS_DIR="$VERIFY_DIR" python scripts/architecture_audit.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('.')
          verify = Path(os.environ['RUNNER_TEMP']) / '40d-quality-verify'
          evidence = json.loads((root / 'diagnostics/release_readiness/RELEASE_EVIDENCE.json').read_text(encoding='utf-8'))
          internal = json.loads((verify / 'internal_quality_latest.json').read_text(encoding='utf-8'))
          arch = json.loads((verify / 'architecture_audit_latest.json').read_text(encoding='utf-8'))
          q = evidence['internal_quality']
          m = internal['metrics']
          expected = {
              'internal_files_checked': m['files'],
              'internal_function_count': m['functions'],
              'largest_python_file_lines': m['max_lines'],
              'maximum_complexity': m['max_complexity'],
          }
          for key, value in expected.items():
              if q[key] != value:
                  raise SystemExit(f'{key}: Evidence {q[key]} != frisch gemessen {value}')
          if q['internal_findings'] != 0 or internal['status'] != 'pass':
              raise SystemExit('Interne Qualitätsbefunde nicht null.')
          current = q['current_architecture']
          if current['modules_checked'] != arch['modules'] or current['function_count'] != arch['functions'] or current['class_count'] != arch['classes'] or current['largest_python_file_lines'] != arch['max_file']['lines'] or current['architecture_findings'] != len(arch['findings']):
              raise SystemExit('Architektur-Evidence weicht von frischer Messung ab.')
          print('40D Qualitätsmetriken stimmen exakt mit frischer Messung überein.')
          PY

      - name: Manifest und Release-ZIP final read-only prüfen
        run: |
          set -Eeuo pipefail
          python diagnostics/release_readiness/generate_from_evidence.py --check
          python scripts/render_release_docs.py --check
          python scripts/build_release_manifest.py --check --json
          python scripts/validate_release_manifest.py
          python scripts/package_release.py --output "$RUNNER_TEMP/VideoBatch_40D_RC25_FINAL.zip"
          python scripts/verify_release_zip.py "$RUNNER_TEMP/VideoBatch_40D_RC25_FINAL.zip"

      - name: Scope fail-closed prüfen und finalen Evidence-Baum committen
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/one-shot-40d-final-evidence.yml',
              'DEVELOPMENT_STATUS.json',
              'FRESH_PACKAGE_REPORT_save_.md',
              'PROJEKTSTATUS.json',
              'QUALITY_ENVIRONMENT_STATUS.json',
              'README.md',
              'RELEASE_FILE_STATUS.json',
              'RELEASE_MANIFEST.json',
              'RELEASE_NOTES_save_.md',
              'STATUS.md',
              'TEST_REPORT_save_.md',
              'TODO.md',
              'VideoBatch_Fast_2.8.3-rc25_BUILD_REPORT_save_.json',
              'diagnostics/release_readiness/RELEASE_EVIDENCE.json',
          }
          lines = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          paths = {line[3:] for line in lines if len(line) >= 4}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit('Unerwartete Änderungen: ' + ', '.join(unexpected))
          if any(path.startswith('src/') for path in paths):
              raise SystemExit('Produktcode wurde unerwartet verändert.')
          if '.github/workflows/one-shot-40d-final-evidence.yml' not in paths:
              raise SystemExit('Temporärer Finalizer wurde nicht aus dem Endbaum entfernt.')
          if 'VideoBatch_Fast_2.8.3-rc25_BUILD_REPORT_save_.json' not in paths:
              raise SystemExit('Der echte RC25-Buildreport wurde nicht erzeugt.')
          print('Finaler Scope geprüft:', ', '.join(sorted(paths)))
          PY
          git config user.name "pppoppi"
          git config user.email "provoware.one@gmail.com"
          git add -A
          git commit -m "chore(40d): finalize generated rc25 evidence"
          git push origin HEAD:iteration/40d-coverage-contract-20260904
