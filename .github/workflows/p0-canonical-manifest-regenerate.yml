name: P1-001 canonical evidence regeneration

on:
  push:
    branches:
      - diagnose/p0-smoke-6920f5ff-evidence
    paths:
      - .github/workflows/p0-canonical-manifest-regenerate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1-001-canonical-evidence-regeneration
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate exact P1 evidence manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: p1-001-release-evidence-reconciliation
      EXPECTED_HEAD_SHA: 2b2209a72ee0ae32694422cd8e1d6acde6e454aa
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src

    steps:
      - name: Check out exact P1 source head
        uses: actions/checkout@v5
        with:
          ref: p1-001-release-evidence-reconciliation
          fetch-depth: 1

      - name: Prove exact source head and clean tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prepare pinned Python test toolchain
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Install locked Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-toolchain.lock

      - name: Run focused ownership and file-mode regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_release_docs.py

      - name: Regenerate machine evidence and prove canonical modes
        shell: bash
        run: |
          set -Eeuo pipefail
          python diagnostics/release_readiness/generate_from_evidence.py --write
          python diagnostics/release_readiness/generate_from_evidence.py --check
          for file in \
            DEVELOPMENT_STATUS.json \
            QUALITY_ENVIRONMENT_STATUS.json \
            RELEASE_FILE_STATUS.json \
            VideoBatch_Fast_2.8.3-rc24_BUILD_REPORT_save_.json; do
            test "$(stat -c '%a' "$file")" = '644'
          done

      - name: Render release documents through sole renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/render_release_docs.py --write
          python scripts/render_release_docs.py --check
          python scripts/validate_release_file_status.py

      - name: Regenerate and verify canonical manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json

      - name: Prove minimal generated diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          printf '%s\n' RELEASE_MANIFEST.json > "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit canonical manifest only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_MANIFEST.json
          git commit -m 'build: canonicalize P1 evidence manifest'
          git push origin "HEAD:$TARGET_BRANCH"
