name: P1-001 canonical docs renderer parity

on:
  push:
    branches:
      - diagnose/p0-smoke-6920f5ff-evidence
    paths:
      - .github/workflows/p0-canonical-manifest-regenerate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p1-001-canonical-docs-renderer-parity
  cancel-in-progress: true

jobs:
  regenerate:
    name: Canonicalize sole renderer outputs and manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: p1-001-release-evidence-reconciliation
      EXPECTED_HEAD_SHA: e7169ba6c67f74b9f990cfe093ddaf019edc2ef4
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src

    steps:
      - name: Check out exact P1 renderer source head
        uses: actions/checkout@v5
        with:
          ref: p1-001-release-evidence-reconciliation
          fetch-depth: 1

      - name: Prove exact pristine source head
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prepare pinned Python toolchain
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Install locked Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-toolchain.lock

      - name: Run focused renderer ownership and parity regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_release_docs.py
          python diagnostics/release_readiness/generate_from_evidence.py --check
          python scripts/validate_release_file_status.py

      - name: Render README and STATUS through sole renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/render_release_docs.py --write
          python scripts/render_release_docs.py --check
          grep -F '**Kanal:** RC – noch keine Stable-Freigabe' README.md
          grep -F '**Kanonische Quelle:** `diagnostics/release_readiness/RELEASE_EVIDENCE.json`' README.md
          grep -F 'Kubuntu-CI-Matrix: 4/4 Kombinationen bestanden' README.md
          grep -F '**Kanonische Quelle:** `diagnostics/release_readiness/RELEASE_EVIDENCE.json`' STATUS.md
          grep -F 'Kubuntu-CI-Matrix: 4/4 Kombinationen bestanden' STATUS.md

      - name: Regenerate and verify canonical manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json

      - name: Prove exact generated file set
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          README.md
          RELEASE_MANIFEST.json
          STATUS.md
          EOF
          LC_ALL=C sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Commit exact canonical outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md STATUS.md RELEASE_MANIFEST.json
          git commit -m 'build: canonicalize P1 docs renderer outputs'
          git push origin "HEAD:$TARGET_BRANCH"
