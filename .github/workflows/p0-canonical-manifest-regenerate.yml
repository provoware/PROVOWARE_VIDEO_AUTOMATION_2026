name: P1-001 final exact-head qualification

on:
  push:
    branches:
      - diagnose/p0-smoke-6920f5ff-evidence
    paths:
      - .github/workflows/p0-canonical-manifest-regenerate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-001-final-exact-head-qualification
  cancel-in-progress: true

jobs:
  qualify:
    name: Final P1 exact-head qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_SHA: 86cd86aca703b5cb71e0a04e4ff20714682b3349
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
      XDG_SESSION_TYPE: x11

    steps:
      - name: Check out exact canonical P1 head
        uses: actions/checkout@v5
        with:
          ref: 86cd86aca703b5cb71e0a04e4ff20714682b3349
          persist-credentials: false

      - name: Prove exact pristine head
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/p1-final"
          printf '%s\n' "$EXPECTED_HEAD_SHA" > "$RUNNER_TEMP/p1-final/head-sha.txt"

      - name: Prepare identical cached Kubuntu dependencies
        uses: ./.github/actions/kubuntu-package-cache
        with:
          os: ubuntu-24.04
          session: x11
          mode: matrix

      - name: Preserve dependency diagnostics outside repository
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d matrix-logs
          test -f CI_PACKAGE_METRICS.json
          cp -R matrix-logs "$RUNNER_TEMP/p1-final/dependency-matrix-logs"
          cp CI_PACKAGE_METRICS.json "$RUNNER_TEMP/p1-final/CI_PACKAGE_METRICS.json"
          rm -rf matrix-logs CI_PACKAGE_METRICS.json
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Start deterministic X11 display
        shell: bash
        run: |
          set -Eeuo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          sleep 2

      - name: Run canonical read-only P1 gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 diagnostics/release_readiness/generate_from_evidence.py --check 2>&1 | tee "$RUNNER_TEMP/p1-final/evidence-check.log"
          python3 scripts/render_release_docs.py --check 2>&1 | tee "$RUNNER_TEMP/p1-final/docs-render-check.log"
          python3 scripts/validate_release_file_status.py 2>&1 | tee "$RUNNER_TEMP/p1-final/release-file-status.log"
          python3 scripts/build_release_manifest.py --check --json 2>&1 | tee "$RUNNER_TEMP/p1-final/manifest-check.log"
          grep -F '**Kanonische Quelle:** `diagnostics/release_readiness/RELEASE_EVIDENCE.json`' README.md
          grep -F 'Kubuntu-CI-Matrix: 4/4 Kombinationen bestanden' README.md
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run complete pytest census
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python3 -m pytest -q -p no:cacheprovider 2>&1 | tee "$RUNNER_TEMP/p1-final/pytest.log"
          code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/p1-final/pytest.exit-code.txt"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/p1-final/git-status-after-pytest.txt"
          test ! -s "$RUNNER_TEMP/p1-final/git-status-after-pytest.txt"
          exit "$code"

      - name: Collect display evidence
        if: always()
        shell: bash
        run: |
          cp /tmp/xvfb.log "$RUNNER_TEMP/p1-final/xvfb.log" 2>/dev/null || true

      - name: Upload final exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-final-exact-head-${{ env.EXPECTED_HEAD_SHA }}
          path: ${{ runner.temp }}/p1-final/**
          if-no-files-found: error
          retention-days: 30
