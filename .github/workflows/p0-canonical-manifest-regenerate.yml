name: P1-001 targeted P0 baseline classifier

on:
  push:
    branches:
      - diagnose/p0-smoke-6920f5ff-evidence
    paths:
      - .github/workflows/p0-canonical-manifest-regenerate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-001-targeted-p0-baseline-classifier
  cancel-in-progress: true

jobs:
  classify:
    name: Reproduce P1 census failures on final P0 head
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: 12b5a9daecdd4fdf2d8c5756c19c2705908681d4
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src

    steps:
      - name: Check out exact final P0 head
        uses: actions/checkout@v5
        with:
          ref: 12b5a9daecdd4fdf2d8c5756c19c2705908681d4
          persist-credentials: false

      - name: Prove exact pristine P0 head
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/p0-baseline"
          printf '%s\n' "$EXPECTED_HEAD_SHA" > "$RUNNER_TEMP/p0-baseline/head-sha.txt"

      - name: Prepare minimal pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install exact runtime minimum and pytest
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            'cffi==2.0.0' \
            'cryptography==50.0.0' \
            'Pillow==12.3.0' \
            'pycparser==3.0' \
            'pytest==9.0.2'

      - name: Run only the eight-failure test files
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python -m pytest -q -p no:cacheprovider \
            tests/test_autonomous_bootstrap_2_8_3_rc8.py \
            tests/test_debug_runtime_contract.py \
            tests/test_kubuntu_main_comment_dispatch.py \
            tests/test_predictive_bootstrap_2_8_3_rc10.py \
            tests/test_runtime_error_hardening.py \
            tests/test_unified_toolchain_2_8_3_rc7.py \
            2>&1 | tee "$RUNNER_TEMP/p0-baseline/pytest.log"
          code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/p0-baseline/pytest.exit-code.txt"
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/p0-baseline/git-status-after.txt"
          test ! -s "$RUNNER_TEMP/p0-baseline/git-status-after.txt"
          exit "$code"

      - name: Upload targeted P0 baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-targeted-p0-baseline-${{ env.EXPECTED_HEAD_SHA }}
          path: ${{ runner.temp }}/p0-baseline/**
          if-no-files-found: error
          retention-days: 30
