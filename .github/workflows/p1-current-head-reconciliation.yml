name: P1 current-head reconciliation

on:
  push:
    branches:
      - p1-001-current-head-reconciliation

permissions:
  contents: write

concurrency:
  group: p1-current-head-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Rebind evidence to canonical A32.2 head
        env:
          CANONICAL_P0_HEAD: 9823e790f8e67a6e0f406b132c37569e3b95d977
          CHECKPOINT2_RUN_ID: '33791408050'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('diagnostics/release_readiness/RELEASE_EVIDENCE.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          head = os.environ['CANONICAL_P0_HEAD']
          run_id = int(os.environ['CHECKPOINT2_RUN_ID'])
          data['provenance']['canonical_p0_head'] = head
          data['provenance']['canonical_p0_checkpoint2_run_id'] = run_id
          data['matrix']['workflow_run_id'] = run_id
          data['matrix']['verified_commit'] = head
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerate evidence-owned outputs
        run: python3 diagnostics/release_readiness/generate_from_evidence.py --write

      - name: Regenerate renderer-owned README and status
        run: python3 scripts/render_release_docs.py --write

      - name: Remove one-shot reconciliation workflow
        run: rm .github/workflows/p1-current-head-reconciliation.yml

      - name: Regenerate canonical release manifest on final tree
        run: python3 scripts/build_release_manifest.py

      - name: Verify deterministic release contracts
        run: |
          python3 diagnostics/release_readiness/generate_from_evidence.py --check
          python3 scripts/render_release_docs.py --check
          python3 scripts/build_release_manifest.py --check
          python3 -m py_compile \
            diagnostics/release_readiness/generate_from_evidence.py \
            scripts/render_release_docs.py \
            scripts/build_release_manifest.py \
            tests/test_release_docs.py
          git diff --check

      - name: Commit exact reconciled tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: finalize P1 current-head reconciliation'
          git push origin HEAD:${GITHUB_REF_NAME}
