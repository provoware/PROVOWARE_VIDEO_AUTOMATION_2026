name: One-shot post-merge smoke f691cd67

on:
  push:
    branches:
      - ops/post-merge-smoke-f691cd67
    paths:
      - .github/workflows/post-merge-smoke-f691cd67.yml

permissions:
  contents: read

env:
  EXPECTED_SHA: f691cd67bb480b7633ae88909b7d6fcd87d5eda0
  EXPECTED_TREE: 11042f1d4339eef3505c982228301f12779b13bd
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  XDG_SESSION_TYPE: x11

jobs:
  smoke-and-archive:
    name: Exact main post-merge smoke and verified ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact merged main commit
        uses: actions/checkout@v4
        with:
          ref: f691cd67bb480b7633ae88909b7d6fcd87d5eda0
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact source identity
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          printf 'POST_MERGE_SHA=%s\nPOST_MERGE_TREE=%s\n' "$EXPECTED_SHA" "$EXPECTED_TREE" | tee "$RUNNER_TEMP/source-identity.txt"

      - name: Prepare cached Kubuntu dependencies
        uses: ./.github/actions/kubuntu-package-cache
        with:
          os: ubuntu-24.04
          session: x11
          mode: matrix

      - name: Start deterministic X11 display
        run: |
          set -Eeuo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          sleep 2

      - name: Provision and attest system FFmpeg
        run: |
          set -Eeuo pipefail
          ffmpeg_path="$(readlink -f "$(command -v ffmpeg)")"
          ffprobe_path="$(readlink -f "$(command -v ffprobe)")"
          test -x "$ffmpeg_path" && test -x "$ffprobe_path"
          media_dir="$RUNNER_TEMP/ffmpeg-system/bin"
          mkdir -p "$media_dir"
          ln -sfn "$ffmpeg_path" "$media_dir/ffmpeg"
          ln -sfn "$ffprobe_path" "$media_dir/ffprobe"
          echo "VIDEOBATCH_STATIC_MEDIA_DIR=$media_dir" >> "$GITHUB_ENV"
          "$ffmpeg_path" -version | sed -n '1p'
          "$ffprobe_path" -version | sed -n '1p'

      - name: Validate canonical source contracts
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/post-merge-logs"
          python3 scripts/build_release_manifest.py --check --json | tee "$RUNNER_TEMP/release-manifest-check.json"
          python3 -m compileall -q -f src scripts diagnostics tests
          python3 -m pytest -q \
            tests/test_design_manifest_contract.py \
            tests/test_canonical_application_shell_contract.py \
            tests/test_canonical_kpi_contract.py \
            tests/test_visual_pass2_contract.py \
            2>&1 | tee "$RUNNER_TEMP/post-merge-logs/focused-pytest.log"

      - name: Run repository-owned Kubuntu smoke
        run: |
          set -Eeuo pipefail
          bash scripts/kubuntu_matrix_smoke.sh 2>&1 | tee "$RUNNER_TEMP/post-merge-logs/kubuntu-matrix-smoke.log"

      - name: Prove smoke remained source-read-only
        run: |
          set -Eeuo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status" | tee "$RUNNER_TEMP/post-merge-logs/worktree-drift.log"
            exit 1
          fi

      - name: Build and verify exact main project ZIP
        run: |
          set -Eeuo pipefail
          archive="PROVOWARE_VIDEO_AUTOMATION_2026_2.8.3-rc24_main_${EXPECTED_SHA:0:12}_POST_MERGE_VERIFIED.zip"
          git archive --format=zip --prefix=PROVOWARE_VIDEO_AUTOMATION_2026/ --output="$RUNNER_TEMP/$archive" "$EXPECTED_SHA"
          unzip -t "$RUNNER_TEMP/$archive" > "$RUNNER_TEMP/post-merge-logs/unzip-test.log"
          sha256sum "$RUNNER_TEMP/$archive" | tee "$RUNNER_TEMP/$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Write post-merge evidence
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              "schema_version": 1,
              "status": "passed",
              "commit": os.environ["EXPECTED_SHA"],
              "tree": os.environ["EXPECTED_TREE"],
              "branch_under_test": "main",
              "os": "ubuntu-24.04",
              "session": "x11",
              "checks": ["exact_sha", "exact_tree", "release_manifest", "compileall", "focused_canonical_pytest", "repository_kubuntu_matrix_smoke", "read_only_worktree", "zip_integrity"],
              "archive": os.environ["ARCHIVE"],
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "POST_MERGE_SMOKE.json"
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Upload exact verified project artifact
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-verified-main-f691cd67
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/${{ env.ARCHIVE }}
            ${{ runner.temp }}/${{ env.ARCHIVE }}.sha256
            ${{ runner.temp }}/POST_MERGE_SMOKE.json
            ${{ runner.temp }}/release-manifest-check.json
            ${{ runner.temp }}/source-identity.txt
            ${{ runner.temp }}/post-merge-logs/*

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-f691cd67-failure-evidence-canonical
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/post-merge-logs/*
            ${{ runner.temp }}/release-manifest-check.json
            ${{ runner.temp }}/source-identity.txt
            /tmp/xvfb.log
