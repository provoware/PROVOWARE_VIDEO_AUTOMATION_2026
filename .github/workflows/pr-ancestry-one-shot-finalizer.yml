name: SHA-bound one-shot ancestry finalizer

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: one-shot-ancestry-finalizer-61
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 61 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/pr-ancestry-guard-20260806' &&
      github.event.pull_request.head.sha == 'ed821e212d7a2acf2b9eb5605076fc71a1673bf4'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: fix/pr-ancestry-guard-20260806
      EXPECTED_HEAD: ed821e212d7a2acf2b9eb5605076fc71a1673bf4
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/ancestry-finalizer-pycache
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts

    steps:
      - name: Check out exact writable owner branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable identity and current base
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin main
          git merge --no-edit origin/main

      - name: Apply locally verified payload
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import io
          import shutil
          import tarfile
          from pathlib import Path, PurePosixPath

          folder = Path('.github/ancestry-payload')
          parts = sorted(folder.glob('part-*.txt'))
          if len(parts) != 3:
              raise SystemExit(f'expected 3 payload parts, found {len(parts)}')
          encoded = []
          for index, path in enumerate(parts, 1):
              lines = path.read_text(encoding='utf-8').splitlines()
              marker = f'<!-- PR_ANCESTRY_PAYLOAD {index:02d}/03 -->'
              if not lines or lines[0] != marker:
                  raise SystemExit(f'invalid payload marker: {path}')
              encoded.append(''.join(lines[1:]))
          payload = base64.b64decode(''.join(encoded), validate=True)
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  target = PurePosixPath(member.name)
                  if target.is_absolute() or '..' in target.parts or not member.isfile():
                      raise SystemExit(f'unsafe payload entry: {member.name}')
              archive.extractall(Path.cwd(), members=members)
          shutil.rmtree(folder)
          for transient in (
              Path('.github/workflows/pr-ancestry-bootstrap.yml'),
              Path('.github/workflows/pr-ancestry-one-shot-finalizer.yml'),
          ):
              transient.unlink(missing_ok=True)
          PY
          python3 diagnostics/release_readiness/generate_from_evidence.py --write
          python3 scripts/build_release_manifest.py

      - name: Validate exact final branch tree
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input ruff==0.16.1
          test "$(python3 -m ruff --version)" = 'ruff 0.16.1'
          python3 -m ruff check scripts/check_pr_ancestry.py tests/test_pr_ancestry_guard.py --no-cache
          python3 -m compileall -q -f src scripts diagnostics tests
          python3 -m pytest -q -p no:cacheprovider tests/test_pr_ancestry_guard.py
          python3 diagnostics/release_readiness/generate_from_evidence.py --check
          python3 scripts/build_release_manifest.py --check --json
          ruby -e 'require "yaml"; value=YAML.load_file(".github/workflows/pr-ancestry-guard.yml"); abort unless value.is_a?(Hash)'
          git diff --check

      - name: Commit and push final verified branch
        id: publish
        run: |
          set -Eeuo pipefail
          git config user.name 'provoware-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'ci: enforce PR ancestry before release gates'
          git push origin "HEAD:$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish finalization evidence
        env:
          FINAL_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          gh pr comment 61 --repo "$GITHUB_REPOSITORY" --body "✅ SHA-gebundene Finalisierung bestanden. Finaler Branch-Head: \`$FINAL_SHA\`. Transportdateien und Einmal-Workflow fehlen im Endbaum; Ruff 0.16.1, Compileall, vier Abstammungstests, Evidence-, Manifest- und YAML-Prüfung sind grün."
