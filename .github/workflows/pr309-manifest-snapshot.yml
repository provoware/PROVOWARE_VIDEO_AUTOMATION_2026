name: PR309 einmaliger Manifest-Abgleich
on:
  push:
    branches:
      - feature/dashboard-schnellspeicher-20261101

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'provoware/PROVOWARE_VIDEO_AUTOMATION_2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exakten Entwicklungsstand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python 3.12 bereitstellen
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Benötigte Laufzeitbibliothek installieren
        run: python -m pip install --disable-pip-version-check --no-input cryptography==50.0.0
      - name: Manifest und Projektindex mit Originalgeneratoren erstellen
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm -- .github/workflows/pr309-manifest-snapshot.yml
          python scripts/build_release_manifest.py --compact
          git add RELEASE_MANIFEST.json
          python scripts/project_file_index.py --write --git-index
          git add registries/PROJECT_FILE_INDEX.json
          python scripts/build_release_manifest.py --check --compact
          python scripts/project_file_index.py --check --git-index
          python -m unittest discover -s tests -p 'test_dashboard_quick_notes.py' -v
          printf 'PV_GENERATED_MANIFEST_BEGIN\n'
          base64 -w 96 RELEASE_MANIFEST.json
          printf 'PV_GENERATED_MANIFEST_END\n'
          printf 'PV_GENERATED_INDEX_BEGIN\n'
          base64 -w 96 registries/PROJECT_FILE_INDEX.json
          printf 'PV_GENERATED_INDEX_END\n'
