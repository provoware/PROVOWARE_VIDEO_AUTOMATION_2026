name: PR84 one-shot canonical manifest sync

on:
  push:
    branches:
      - codex/a32-2-current-state-error-hardening
    paths:
      - .github/workflows/pr84-manifest-sync.yml

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v5
        with:
          ref: codex/a32-2-current-state-error-hardening
          fetch-depth: 0

      - name: Prepare pinned Python toolchain
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Install repository-locked test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-toolchain.lock

      - name: Remove helper test fix and generate canonical manifest
        run: |
          set -Eeuo pipefail
          rm .github/workflows/pr84-manifest-sync.yml
          python -m pytest -q tests/test_runtime_error_hardening.py
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json
          git diff --check

      - name: Commit manifest and helper removal atomically
        run: |
          set -Eeuo pipefail
          git config user.name "provoware-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A .github/workflows/pr84-manifest-sync.yml RELEASE_MANIFEST.json
          git diff --cached --exit-code && { echo "Keine Manifeständerung erforderlich."; exit 0; } || true
          git commit -m "ci: canonicalize manifest after cache fix"
          git push origin HEAD:codex/a32-2-current-state-error-hardening
