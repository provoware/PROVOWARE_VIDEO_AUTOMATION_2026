name: Qt6 Phase 2 smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements-qt.txt"
      - "src/videobatch_fast/qt_*.py"
      - "tests/test_qt_phase2_contract.py"
      - "tests/qt_phase2_smoke.py"
      - ".github/workflows/qt6-phase2-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-offscreen-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qt.txt

      - name: Compile Phase 2 Qt modules
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            src/videobatch_fast/qt_phase2.py \
            src/videobatch_fast/qt_phase2_components.py \
            src/videobatch_fast/qt_media_import_dialog.py \
            src/videobatch_fast/qt_workflow_dialogs.py

      - name: Run source contract
        run: |
          set -Eeuo pipefail
          python -m pytest -q tests/test_qt_phase2_contract.py

      - name: Run real PySide6 offscreen smoke
        run: |
          set -Eeuo pipefail
          python tests/qt_phase2_smoke.py
