name: Qt6 Phase 2 smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements-qt.txt"
      - "src/videobatch_fast/qt_*.py"
      - "tests/test_qt_phase2_contract.py"
      - "tests/qt_phase2_smoke.py"
      - ".github/workflows/qt6-phase2-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-offscreen-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify runner base
        run: |
          set -Eeuo pipefail
          . /etc/os-release
          test "$VERSION_ID" = "26.04"

      - name: Install minimal Qt system runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libfontconfig1 \
            libxkbcommon0

      - name: Install Qt runtime and test runner
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qt.txt
          python -m pip install pytest==8.4.2

      - name: Compile Phase 2 Qt modules
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            src/videobatch_fast/qt_phase2.py \
            src/videobatch_fast/qt_phase2_components.py \
            src/videobatch_fast/qt_media_import_dialog.py \
            src/videobatch_fast/qt_workflow_dialogs.py

      - name: Run source contract
        run: python -m pytest -q tests/test_qt_phase2_contract.py

      - name: Run PySide6 offscreen regression smoke
        run: python tests/qt_phase2_smoke.py
