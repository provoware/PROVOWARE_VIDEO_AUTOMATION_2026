name: Qt6 Phase 3 project workspace smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements.lock"
      - "requirements-toolchain.lock"
      - "requirements-qt.txt"
      - "TOOLCHAIN_CONTRACT.json"
      - "STARTUP_CONTRACT.json"
      - "RELEASE_MANIFEST.json"
      - "scripts/build_release_manifest.py"
      - "scripts/build_toolchain_wheelhouse.py"
      - "scripts/toolchain.py"
      - "src/videobatch_fast/qt_*.py"
      - "src/videobatch_fast/project_state.py"
      - "src/videobatch_fast/assurance.py"
      - "src/videobatch_fast/diagnostics_service.py"
      - "src/videobatch_fast/fault_lab.py"
      - "tests/test_qt_phase2_contract.py"
      - "tests/test_qt_phase3_contract.py"
      - "tests/test_qt_runtime_toolchain_contract.py"
      - "tests/test_quality_wheelhouse_2_8_3.py"
      - "tests/qt_phase2_smoke.py"
      - "tests/qt_phase3_smoke.py"
      - ".github/workflows/qt6-phase3-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-qt-runtime-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      VIDEOBATCH_CI_ALLOW_PUBLIC_PYPI: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal Qt system runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libfontconfig1 \
            libxkbcommon0

      - name: Build verified runtime wheelhouse with explicit CI consent
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test "${VIDEOBATCH_CI_ALLOW_PUBLIC_PYPI:-}" = "1"
          python scripts/build_toolchain_wheelhouse.py --scope runtime
          python scripts/toolchain.py verify --scope runtime

      - name: Install runtime strictly offline from wheelhouse
        run: |
          set -Eeuo pipefail
          PIP_NO_INDEX=1 python scripts/toolchain.py install --scope runtime --replace
          RUNTIME_PY="$(python scripts/toolchain.py path --scope runtime --quiet | tail -n 1)"
          test -x "$RUNTIME_PY"
          "$RUNTIME_PY" - <<'PY'
          import importlib.metadata as metadata
          import cryptography
          import cffi
          import pycparser
          import PySide6
          import shiboken6
          from PIL import Image
          from PySide6 import QtCore, QtGui, QtWidgets

          expected = {
              "PySide6": "6.11.2",
              "PySide6-Addons": "6.11.2",
              "PySide6-Essentials": "6.11.2",
              "shiboken6": "6.11.2",
          }
          actual = {name: metadata.version(name) for name in expected}
          assert actual == expected, (actual, expected)
          assert QtCore.qVersion() == "6.11.2", QtCore.qVersion()
          print("OFFLINE_QT_RUNTIME_IMPORTS_OK")
          PY
          python scripts/toolchain.py gate --scope runtime

      - name: Prove offline install flags and consent contract
        run: |
          set -Eeuo pipefail
          python tests/test_qt_runtime_toolchain_contract.py

      - name: Derive exact compact release manifest
        run: |
          set -Eeuo pipefail
          python scripts/build_release_manifest.py --compact
          cat RELEASE_MANIFEST.json
          if [[ "${GITHUB_HEAD_REF:-}" != tmp/qt6-offline-runtime-gate-* ]]; then
            git diff --exit-code -- RELEASE_MANIFEST.json
          fi

  qt-phase3-offscreen-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal Qt system runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libfontconfig1 \
            libxkbcommon0

      - name: Install locked Qt runtime and test runner
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qt.txt
          python -m pip install pytest==8.4.2

      - name: Compile Phase 2 and Phase 3 Qt modules
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            src/videobatch_fast/qt_ui.py \
            src/videobatch_fast/qt_phase2.py \
            src/videobatch_fast/qt_phase2_components.py \
            src/videobatch_fast/qt_phase3.py \
            src/videobatch_fast/qt_phase3_components.py

      - name: Run Phase 2 regression and Phase 3 architecture contracts
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            tests/test_qt_phase2_contract.py \
            tests/test_qt_phase3_contract.py \
            tests/test_qt_runtime_toolchain_contract.py

      - name: Run real Phase 2 regression smoke
        run: |
          set -Eeuo pipefail
          python tests/qt_phase2_smoke.py

      - name: Run real Phase 3 project workspace smoke
        run: |
          set -Eeuo pipefail
          python tests/qt_phase3_smoke.py
