name: Qt6 Phase 3 project workspace smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements.lock"
      - "requirements-toolchain.lock"
      - "requirements-qt.txt"
      - "TOOLCHAIN_CONTRACT.json"
      - "STARTUP_CONTRACT.json"
      - "RELEASE_MANIFEST.json"
      - "scripts/build_release_manifest.py"
      - "scripts/build_toolchain_wheelhouse.py"
      - "scripts/toolchain.py"
      - "src/videobatch_fast/qt_*.py"
      - "src/videobatch_fast/project_state.py"
      - "src/videobatch_fast/assurance.py"
      - "src/videobatch_fast/diagnostics_service.py"
      - "src/videobatch_fast/fault_lab.py"
      - "tests/test_qt_phase2_contract.py"
      - "tests/test_qt_phase3_contract.py"
      - "tests/test_qt_runtime_toolchain_contract.py"
      - "tests/test_quality_wheelhouse_2_8_3.py"
      - "tests/qt_phase2_smoke.py"
      - "tests/qt_phase3_smoke.py"
      - ".github/workflows/qt6-phase3-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-qt-runtime-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      VIDEOBATCH_CI_ALLOW_PUBLIC_PYPI: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal Qt system runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libfontconfig1 \
            libxkbcommon0

      - name: Build canonical runtime and isolated Qt wheelhouses
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS:-}" = "true"
          test "${VIDEOBATCH_CI_ALLOW_PUBLIC_PYPI:-}" = "1"

          python scripts/build_toolchain_wheelhouse.py --scope runtime
          python scripts/toolchain.py verify --scope runtime

          QT_WHEELHOUSE="$RUNNER_TEMP/videobatch-qt-wheelhouse"
          QT_HASH_LOCK="$RUNNER_TEMP/requirements-qt-resolved.lock"
          QT_HASH_MANIFEST="$RUNNER_TEMP/qt-wheelhouse-sha256.json"
          rm -rf "$QT_WHEELHOUSE"
          mkdir -p "$QT_WHEELHOUSE"

          python -m pip download \
            --disable-pip-version-check \
            --progress-bar off \
            --only-binary=:all: \
            --dest "$QT_WHEELHOUSE" \
            --requirement requirements-qt.txt

          QT_WHEELHOUSE="$QT_WHEELHOUSE" \
          QT_HASH_LOCK="$QT_HASH_LOCK" \
          QT_HASH_MANIFEST="$QT_HASH_MANIFEST" \
          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          wheelhouse = Path(os.environ["QT_WHEELHOUSE"])
          lock_path = Path(os.environ["QT_HASH_LOCK"])
          manifest_path = Path(os.environ["QT_HASH_MANIFEST"])
          wheels = sorted(wheelhouse.glob("*.whl"))
          assert wheels, "Qt-Wheelhouse ist leer"
          assert not [path for path in wheelhouse.iterdir() if not path.name.endswith(".whl")]

          entries = []
          lock_lines = [
              "# CI-erzeugt aus requirements-qt.txt; Installation erfolgt strikt offline.",
              "# Jede Wheel-Datei ist mit SHA-256 gebunden.",
          ]
          for path in wheels:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              with zipfile.ZipFile(path) as archive:
                  metadata_names = [
                      name for name in archive.namelist()
                      if name.endswith(".dist-info/METADATA")
                  ]
                  assert len(metadata_names) == 1, path.name
                  message = Parser().parsestr(
                      archive.read(metadata_names[0]).decode("utf-8", errors="strict")
                  )
              name = str(message["Name"])
              version = str(message["Version"])
              assert name and version
              entries.append(
                  {"filename": path.name, "name": name, "version": version, "sha256": digest}
              )
              lock_lines.append(f"{name}=={version} --hash=sha256:{digest}")

          lock_path.write_text("\n".join(lock_lines) + "\n", encoding="utf-8")
          manifest_path.write_text(
              json.dumps(
                  {"schema_version": 1, "source": "requirements-qt.txt", "wheels": entries},
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          print(f"QT_WHEELHOUSE_HASH_BOUND={len(entries)}")
          PY

          echo "QT_WHEELHOUSE=$QT_WHEELHOUSE" >> "$GITHUB_ENV"
          echo "QT_HASH_LOCK=$QT_HASH_LOCK" >> "$GITHUB_ENV"
          echo "QT_HASH_MANIFEST=$QT_HASH_MANIFEST" >> "$GITHUB_ENV"

      - name: Install runtime and Qt strictly offline
        run: |
          set -Eeuo pipefail
          PIP_NO_INDEX=1 python scripts/toolchain.py install --scope runtime --replace
          RUNTIME_PY="$(python scripts/toolchain.py path --scope runtime --quiet | tail -n 1)"
          test -x "$RUNTIME_PY"

          PIP_NO_INDEX=1 "$RUNTIME_PY" -m pip install \
            --disable-pip-version-check \
            --no-index \
            --find-links "$QT_WHEELHOUSE" \
            --require-hashes \
            --only-binary=:all: \
            --requirement "$QT_HASH_LOCK"
          PIP_NO_INDEX=1 "$RUNTIME_PY" -m pip check

          QT_WHEELHOUSE="$QT_WHEELHOUSE" \
          QT_HASH_MANIFEST="$QT_HASH_MANIFEST" \
          "$RUNTIME_PY" - <<'PY'
          import hashlib
          import importlib.metadata as metadata
          import json
          import os
          from pathlib import Path

          import PySide6
          import shiboken6
          from PySide6 import QtCore, QtGui, QtWidgets

          manifest = json.loads(Path(os.environ["QT_HASH_MANIFEST"]).read_text(encoding="utf-8"))
          wheelhouse = Path(os.environ["QT_WHEELHOUSE"])
          for item in manifest["wheels"]:
              path = wheelhouse / item["filename"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"], path.name

          expected = {
              "PySide6": "6.11.2",
              "PySide6-Addons": "6.11.2",
              "PySide6-Essentials": "6.11.2",
              "shiboken6": "6.11.2",
          }
          actual = {name: metadata.version(name) for name in expected}
          assert actual == expected, (actual, expected)
          assert QtCore.qVersion() == "6.11.2", QtCore.qVersion()
          print("OFFLINE_QT_RUNTIME_IMPORTS_OK")
          PY

          python scripts/toolchain.py gate --scope runtime

      - name: Prove isolation, offline flags and consent contract
        run: |
          set -Eeuo pipefail
          python tests/test_qt_runtime_toolchain_contract.py

      - name: Derive exact compact release manifest from clean HEAD
        run: |
          set -Eeuo pipefail
          git restore --source=HEAD --staged --worktree -- toolchain_wheelhouse
          git diff --exit-code -- toolchain_wheelhouse
          RUNTIME_PY="$(python scripts/toolchain.py path --scope runtime --quiet | tail -n 1)"
          test -x "$RUNTIME_PY"
          "$RUNTIME_PY" scripts/build_release_manifest.py --compact
          cat RELEASE_MANIFEST.json
          if [[ "${GITHUB_HEAD_REF:-}" != tmp/qt6-offline-runtime-gate-* ]]; then
            git diff --exit-code -- RELEASE_MANIFEST.json
          fi

  qt-phase3-offscreen-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal Qt system runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libfontconfig1 \
            libxkbcommon0

      - name: Install locked Qt runtime and test runner
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qt.txt
          python -m pip install pytest==8.4.2

      - name: Compile Phase 2 and Phase 3 Qt modules
        run: |
          set -Eeuo pipefail
          python -m py_compile \
            src/videobatch_fast/qt_ui.py \
            src/videobatch_fast/qt_phase2.py \
            src/videobatch_fast/qt_phase2_components.py \
            src/videobatch_fast/qt_phase3.py \
            src/videobatch_fast/qt_phase3_components.py

      - name: Run Phase 2 regression and Phase 3 architecture contracts
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            tests/test_qt_phase2_contract.py \
            tests/test_qt_phase3_contract.py \
            tests/test_qt_runtime_toolchain_contract.py

      - name: Run real Phase 2 regression smoke
        run: |
          set -Eeuo pipefail
          python tests/qt_phase2_smoke.py

      - name: Run real Phase 3 project workspace smoke
        run: |
          set -Eeuo pipefail
          python tests/qt_phase3_smoke.py
