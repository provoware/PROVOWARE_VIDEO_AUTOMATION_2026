name: One-shot contract regression validation

on:
  push:
    branches:
      - fix/post-merge-contract-regressions-20260904

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/post-merge-contract-regressions-20260904
          fetch-depth: 0

      - name: Prepare pinned Python toolchain
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Install repository-locked test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            --requirement requirements-toolchain.lock

      - name: Refresh manifest and run full regression suite
        run: |
          set -Eeuo pipefail
          git rm --cached --ignore-unmatch .github/workflows/refresh-contract-regression-manifest-once.yml
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json
          python scripts/check_release_literal_hygiene.py --report "$RUNNER_TEMP/release-literal-hygiene.json"
          python -m pytest -q | tee "$RUNNER_TEMP/full-pytest.log"
          python scripts/validate_release_manifest.py
          git restore --staged .github/workflows/refresh-contract-regression-manifest-once.yml 2>/dev/null || true

          git config user.name 'provoware-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --quiet -- RELEASE_MANIFEST.json; then
            git add RELEASE_MANIFEST.json
            git commit -m 'chore: refresh manifest for contract regressions'
            git push origin HEAD:fix/post-merge-contract-regressions-20260904
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-regression-validation
          path: |
            ${{ runner.temp }}/full-pytest.log
            ${{ runner.temp }}/release-literal-hygiene.json
          if-no-files-found: warn
          retention-days: 14
