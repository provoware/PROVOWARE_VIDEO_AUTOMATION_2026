name: One-shot contract regression validation

on:
  push:
    branches:
      - fix/post-merge-contract-regressions-20260904

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src
      XDG_SESSION_TYPE: x11
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/post-merge-contract-regressions-20260904
          fetch-depth: 0

      - name: Prepare cached Kubuntu dependencies
        uses: ./.github/actions/kubuntu-package-cache
        with:
          os: ubuntu-24.04
          session: x11
          mode: matrix

      - name: Start deterministic X11 display
        run: |
          set -Eeuo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          sleep 2

      - name: Bind system FFmpeg runtime
        run: |
          set -Eeuo pipefail
          ffmpeg_path="$(readlink -f "$(command -v ffmpeg)")"
          ffprobe_path="$(readlink -f "$(command -v ffprobe)")"
          test -x "$ffmpeg_path"
          test -x "$ffprobe_path"
          media_dir="$RUNNER_TEMP/ffmpeg-system/bin"
          mkdir -p "$media_dir"
          ln -sfn "$ffmpeg_path" "$media_dir/ffmpeg"
          ln -sfn "$ffprobe_path" "$media_dir/ffprobe"
          echo "VIDEOBATCH_STATIC_MEDIA_DIR=$media_dir" >> "$GITHUB_ENV"

      - name: Prepare pinned Python toolchain
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Install repository-locked test dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            --requirement requirements-toolchain.lock

      - name: Refresh manifest and run full regression suite
        run: |
          set -Eeuo pipefail
          git rm --cached --ignore-unmatch .github/workflows/refresh-contract-regression-manifest-once.yml
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json
          python scripts/check_release_literal_hygiene.py --report "$RUNNER_TEMP/release-literal-hygiene.json"
          python -m pytest -q | tee "$RUNNER_TEMP/full-pytest.log"
          python scripts/validate_release_manifest.py
          git restore --staged .github/workflows/refresh-contract-regression-manifest-once.yml 2>/dev/null || true

          git config user.name 'provoware-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --quiet -- RELEASE_MANIFEST.json; then
            git add RELEASE_MANIFEST.json
            git commit -m 'chore: refresh manifest for contract regressions'
            git push origin HEAD:fix/post-merge-contract-regressions-20260904
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-regression-validation
          path: |
            ${{ runner.temp }}/full-pytest.log
            ${{ runner.temp }}/release-literal-hygiene.json
            /tmp/xvfb.log
          if-no-files-found: warn
          retention-days: 14
