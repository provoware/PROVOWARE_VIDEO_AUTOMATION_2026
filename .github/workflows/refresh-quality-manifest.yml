name: Temporary quality manifest refresh

on:
  push:
    branches:
      - quality/offline-toolchain-gates-20260805

permissions:
  contents: write

concurrency:
  group: refresh-quality-manifest
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out quality branch
        uses: actions/checkout@v4
        with:
          ref: quality/offline-toolchain-gates-20260805
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned project dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --user --requirement requirements-toolchain.lock

      - name: Remove temporary workflow before manifest generation
        run: rm -- .github/workflows/refresh-quality-manifest.yml

      - name: Rebuild and verify release manifest
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          rm -rf matrix-logs matrix-status quality-toolchain-evidence toolchain_wheelhouse
          rm -f CI_PACKAGE_METRICS.json FFMPEG_TOOLCHAIN.json RELEASE_LITERAL_HYGIENE.json
          python3 scripts/build_release_manifest.py
          python3 scripts/validate_release_manifest.py
          test "$(python3 - <<'PY'
          import json
          print(json.load(open('RELEASE_MANIFEST.json', encoding='utf-8'))['file_count'])
          PY
          )" = 366

      - name: Commit verified manifest and remove temporary workflow
        run: |
          set -Eeuo pipefail
          git config user.name "provoware-release-bot"
          git config user.email "provoware.one@gmail.com"
          git add RELEASE_MANIFEST.json .github/workflows/refresh-quality-manifest.yml
          git diff --cached --check
          git commit -m "Refresh manifest for exact offline quality gates"
          git push origin HEAD:quality/offline-toolchain-gates-20260805
