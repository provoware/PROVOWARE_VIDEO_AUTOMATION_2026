name: Repack VideoBatch runtime compact

on:
  pull_request:
    paths:
      - runtime-repack-request.txt
      - .github/workflows/repack-videobatch-runtime.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: "30731057075"
  SOURCE_ARTIFACT: "videobatch-runtime-payload-rc7-v3"

jobs:
  repack-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download verified source artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p input output
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir input
          find input -maxdepth 2 -type f -printf '%p %s bytes\n'
          test "$(find input -maxdepth 2 -type f -name '*.zip' | wc -l)" -eq 1

      - name: Recompress runtime payload and verify content identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, stat, zipfile
          from pathlib import Path

          source = next(Path('input').rglob('*.zip'))
          output = Path('output') / source.name
          fixed = (2026, 8, 2, 0, 0, 0)
          source_records = []
          with zipfile.ZipFile(source) as zin, zipfile.ZipFile(output, 'w', allowZip64=True, compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
              names = zin.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('duplicate source archive entries')
              for info in sorted(zin.infolist(), key=lambda i: i.filename):
                  data = zin.read(info.filename)
                  source_records.append((info.filename, len(data), hashlib.sha256(data).hexdigest(), (info.external_attr >> 16) & 0o777))
                  out_info = zipfile.ZipInfo(info.filename, fixed)
                  out_info.external_attr = info.external_attr
                  out_info.create_system = 3
                  out_info.compress_type = zipfile.ZIP_DEFLATED
                  zout.writestr(out_info, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          with zipfile.ZipFile(output) as check:
              target_records = [(i.filename, i.file_size, hashlib.sha256(check.read(i.filename)).hexdigest(), (i.external_attr >> 16) & 0o777) for i in sorted(check.infolist(), key=lambda i: i.filename)]
          if source_records != target_records:
              raise SystemExit('repacked content differs from verified source')
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          sidecar = output.with_suffix(output.suffix + '.sha256')
          sidecar.write_text(f'{digest}  {output.name}\n', encoding='utf-8')
          report = {
              'status': 'passed',
              'source_run_id': os.environ['SOURCE_RUN_ID'],
              'source_artifact': os.environ['SOURCE_ARTIFACT'],
              'payload': output.name,
              'sha256': digest,
              'size': output.stat().st_size,
              'file_count': len(target_records),
              'content_identity_verified': True,
              'recompression': 'deflate-9-all-files',
          }
          output.with_suffix(output.suffix + '.report.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          if output.stat().st_size >= 500 * 1024 * 1024:
              raise SystemExit('repacked payload still exceeds safe transport size')
          PY

      - name: Upload compact runtime payload
        uses: actions/upload-artifact@v4
        with:
          name: videobatch-runtime-payload-rc7-compact
          path: |
            output/*.zip
            output/*.sha256
            output/*.report.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
