name: Temporary repository release audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inventory:
    name: Export tracked repository for release audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out audited revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build tracked-file inventory
        run: |
          set -Eeuo pipefail
          mkdir -p release-audit
          git ls-files | LC_ALL=C sort > release-audit/TRACKED_FILES.txt
          git ls-files -z | tar --null --files-from=- -czf release-audit/TRACKED_SOURCE.tar.gz
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('.')
          files = []
          for line in Path('release-audit/TRACKED_FILES.txt').read_text(encoding='utf-8').splitlines():
              path = root / line
              try:
                  stat = path.stat()
              except OSError:
                  continue
              files.append({
                  'path': line,
                  'size': stat.st_size,
                  'suffix': path.suffix,
                  'executable': bool(stat.st_mode & 0o111),
              })
          report = {
              'schema_version': 2,
              'commit': os.environ['GITHUB_SHA'],
              'tree_sha': __import__('subprocess').check_output(
                  ['git', 'rev-parse', 'HEAD^{tree}'], text=True
              ).strip(),
              'file_count': len(files),
              'total_bytes': sum(item['size'] for item in files),
              'files': files,
          }
          Path('release-audit/REPOSITORY_INVENTORY.json').write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload audit package
        uses: actions/upload-artifact@v4
        with:
          name: repository-release-audit
          path: release-audit/*
          if-no-files-found: error
          retention-days: 1
