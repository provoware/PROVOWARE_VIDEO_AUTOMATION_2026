name: Stable gate - offline Ruff 0.16.1

on:
  pull_request:
    paths:
      - .github/workflows/stable-offline-ruff.yml
      - pyproject.toml
      - requirements-toolchain.lock
      - src/**
      - scripts/**
      - tests/**
      - RELEASE_MANIFEST.json
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'

jobs:
  prepare-wheelhouse:
    name: Prepare exact Ruff wheelhouse
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify repository pin
        run: |
          set -Eeuo pipefail
          test "$(grep -cx 'ruff==0.16.1' requirements-toolchain.lock)" = "1"

      - name: Download exact standalone Ruff wheel
        run: |
          set -Eeuo pipefail
          wheelhouse="$RUNNER_TEMP/ruff-wheelhouse"
          mkdir -p "$wheelhouse"
          python -m pip download \
            --only-binary=:all: \
            --no-deps \
            --dest "$wheelhouse" \
            ruff==0.16.1
          count="$(find "$wheelhouse" -maxdepth 1 -type f -name 'ruff-0.16.1-*.whl' | wc -l)"
          test "$count" = "1"
          sha256sum "$wheelhouse"/*.whl > "$wheelhouse/WHEELHOUSE_SHA256.txt"

      - name: Upload immutable wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: ruff-0.16.1-wheelhouse-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ruff-wheelhouse/
          if-no-files-found: error
          retention-days: 14

  offline-ruff:
    name: Run complete Ruff gate offline
    needs: prepare-wheelhouse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_NO_INDEX: '1'
      PIP_FIND_LINKS: ${{ runner.temp }}/ruff-wheelhouse
      RUFF_NO_CACHE: '1'

    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download prepared wheelhouse
        uses: actions/download-artifact@v4
        with:
          name: ruff-0.16.1-wheelhouse-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ruff-wheelhouse

      - name: Verify wheelhouse before offline install
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/ruff-wheelhouse"
          sha256sum -c WHEELHOUSE_SHA256.txt
          test "$(find . -maxdepth 1 -type f -name 'ruff-0.16.1-*.whl' | wc -l)" = "1"

      - name: Install Ruff with package index disabled
        run: |
          set -Eeuo pipefail
          venv="$RUNNER_TEMP/ruff-offline-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install \
            --no-index \
            --find-links "$RUNNER_TEMP/ruff-wheelhouse" \
            ruff==0.16.1
          test "$("$venv/bin/ruff" --version)" = "ruff 0.16.1"
          echo "RUFF_BIN=$venv/bin/ruff" >> "$GITHUB_ENV"

      - name: Run complete repository Ruff contract
        id: ruff
        run: |
          set -Eeuo pipefail
          result="$RUNNER_TEMP/RUFF_STABLE_GATE_FINDINGS.json"
          set +e
          "$RUFF_BIN" check . \
            --no-cache \
            --output-format=json \
            > "$result"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          python - "$result" "$status" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          findings_path = Path(sys.argv[1])
          exit_code = int(sys.argv[2])
          findings = json.loads(findings_path.read_text(encoding="utf-8") or "[]")
          wheel_sha = Path(
              os.environ["RUNNER_TEMP"],
              "ruff-wheelhouse",
              "WHEELHOUSE_SHA256.txt",
          ).read_text(encoding="utf-8").strip()
          evidence = {
              "schema_version": 1,
              "gate": "ruff_0_16_1",
              "status": "passed" if exit_code == 0 and not findings else "failed",
              "tool": "ruff",
              "tool_version": "0.16.1",
              "repository_pin": "requirements-toolchain.lock: ruff==0.16.1",
              "install_mode": "offline-pip-no-index-from-verified-wheelhouse",
              "wheel_sha256_record": wheel_sha,
              "configuration": "pyproject.toml",
              "scope": ".",
              "findings": len(findings),
              "exit_code": exit_code,
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path(os.environ["RUNNER_TEMP"], "RUFF_STABLE_GATE_EVIDENCE.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True))
          PY
          test "$status" = "0"

      - name: Prove gate left repository unchanged
        if: always()
        run: |
          set -Eeuo pipefail
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error title=Offline Ruff gate changed repository::Stable-gate validation must remain read-only."
            exit 1
          fi

      - name: Upload Ruff stable-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-stable-gate-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/RUFF_STABLE_GATE_EVIDENCE.json
            ${{ runner.temp }}/RUFF_STABLE_GATE_FINDINGS.json
            ${{ runner.temp }}/ruff-wheelhouse/WHEELHOUSE_SHA256.txt
          if-no-files-found: error
          retention-days: 30
