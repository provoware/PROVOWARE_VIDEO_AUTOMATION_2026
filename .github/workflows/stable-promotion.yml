name: Stable 2.8.3 promotion

on:
  push:
    branches: [main]
    paths:
      - ".release/stable-2.8.3.json"
      - "scripts/finalize_release.py"
      - "scripts/promote_stable_workspace.py"
      - "scripts/validate_operator_stable_acceptance.py"
      - "stable_release.sh"
      - "registries/CODE_QUALITY_REGISTRY.json"
      - ".github/workflows/design-manifest-gate.yml"
      - ".github/workflows/stable-promotion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-2.8.3-promotion
  cancel-in-progress: false

env:
  PYTHONPATH: src
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  VIDEOBATCH_CI_ALLOW_PUBLIC_PYPI: "1"

jobs:
  promote:
    name: Verify, promote, package and publish 2.8.3
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install desktop and media runtime
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus-daemon ffmpeg gh kdialog python3-tk rsync weston wl-clipboard xauth xvfb \
            xdg-desktop-portal xdg-desktop-portal-kde libegl1 libgl1 libfontconfig1 \
            libwayland-client0 libxkbcommon0
          python -m pip install -r requirements-toolchain.lock

      - name: Start isolated X11 and native Wayland displays
        run: |
          set -Eeuo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/xdg"
          chmod 700 "$RUNNER_TEMP/xdg"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=wayland-stable" >> "$GITHUB_ENV"
          echo "XDG_SESSION_TYPE=wayland" >> "$GITHUB_ENV"
          echo "XDG_CURRENT_DESKTOP=KDE" >> "$GITHUB_ENV"
          echo "DESKTOP_SESSION=plasmawayland" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg" weston \
            --backend=headless-backend.so \
            --socket=wayland-stable \
            --idle-time=0 >"$RUNNER_TEMP/weston.log" 2>&1 &
          for _ in $(seq 1 30); do
            test -S "$RUNNER_TEMP/xdg/wayland-stable" && break
            sleep 0.25
          done
          test -S "$RUNNER_TEMP/xdg/wayland-stable"

      - name: Validate explicit operator acceptance
        run: |
          set -Eeuo pipefail
          CANDIDATE="$(python -c 'import json; print(json.load(open("VERSION.json"))["build"])')"
          DIGEST="$(sha256sum RELEASE_MANIFEST.json | awk '{print $1}')"
          python scripts/validate_operator_stable_acceptance.py \
            --source-root . --candidate "$CANDIDATE" --manifest-sha256 "$DIGEST" --json

      - name: Prove native Qt Wayland on promotion runner
        env:
          QT_QPA_PLATFORM: wayland
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          backend = app.platformName().lower()
          print(f"QT_QPA_BACKEND={backend}")
          assert "wayland" in backend, backend
          app.quit()
          PY

      - name: Finalize Stable 2.8.3
        run: |
          set -Eeuo pipefail
          python scripts/finalize_release.py \
            --operator-acceptance \
            --output "$RUNNER_TEMP/release" \
            --stable-workspace "$RUNNER_TEMP/VideoBatch_Fast_2.8.3"

      - name: Verify deterministic artifact metadata
        run: |
          set -Eeuo pipefail
          ZIP="$RUNNER_TEMP/release/VideoBatch_Fast_2.8.3.zip"
          REPORT="$RUNNER_TEMP/release/VideoBatch_Fast_2.8.3_FINAL_REPORT.json"
          test -s "$ZIP"
          test -s "$ZIP.sha256"
          test -s "$REPORT"
          sha256sum -c "$ZIP.sha256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"], "release", "VideoBatch_Fast_2.8.3_FINAL_REPORT.json").read_text())
          assert report["status"] == "passed"
          assert report["stable_version"] == "2.8.3"
          assert report["acceptance_mode"] == "explicit_operator_signoff"
          PY

      - name: Create immutable stable branch and tag
        id: stable_ref
        run: |
          set -Eeuo pipefail
          if git ls-remote --exit-code --heads origin stable/2.8.3 >/dev/null 2>&1; then
            echo "stable/2.8.3 already exists" >&2
            exit 21
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v2.8.3 >/dev/null 2>&1; then
            echo "v2.8.3 already exists" >&2
            exit 22
          fi
          git config user.name "provoware-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B stable/2.8.3 "${GITHUB_SHA}"
          rsync -a --delete --exclude=.git/ "$RUNNER_TEMP/VideoBatch_Fast_2.8.3/" "$GITHUB_WORKSPACE/"
          git add -A
          git commit -m "Release: VideoBatch Fast 2.8.3 stable"
          STABLE_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/stable/2.8.3
          git tag -a v2.8.3 -m "VideoBatch Fast 2.8.3"
          git push origin refs/tags/v2.8.3
          echo "stable_sha=$STABLE_SHA" >> "$GITHUB_OUTPUT"

      - name: Write release metadata
        env:
          STABLE_SHA: ${{ steps.stable_ref.outputs.stable_sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          zip_path = root / "release" / "VideoBatch_Fast_2.8.3.zip"
          report_path = root / "release" / "VideoBatch_Fast_2.8.3_FINAL_REPORT.json"
          payload = {
              "schema_version": 1,
              "status": "passed",
              "stable_version": "2.8.3",
              "tag": "v2.8.3",
              "source_commit": os.environ["GITHUB_SHA"],
              "stable_commit": os.environ["STABLE_SHA"],
              "zip_sha256": hashlib.sha256(zip_path.read_bytes()).hexdigest(),
              "final_report_sha256": hashlib.sha256(report_path.read_bytes()).hexdigest(),
              "acceptance_mode": "explicit_operator_signoff",
          }
          target = root / "release" / "VideoBatch_Fast_2.8.3_RELEASE_METADATA.json"
          target.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create v2.8.3 \
            "$RUNNER_TEMP/release/VideoBatch_Fast_2.8.3.zip#VideoBatch Fast 2.8.3 Stable ZIP" \
            "$RUNNER_TEMP/release/VideoBatch_Fast_2.8.3.zip.sha256#SHA-256" \
            "$RUNNER_TEMP/release/VideoBatch_Fast_2.8.3_FINAL_REPORT.json#Final release report" \
            "$RUNNER_TEMP/release/VideoBatch_Fast_2.8.3_RELEASE_METADATA.json#Release metadata" \
            --title "VideoBatch Fast 2.8.3" \
            --notes "Stable 2.8.3 promoted from 2.8.3-rc24 after green repository, quality, Wayland, desktop and deterministic packaging gates."

      - name: Upload release artifact for CI retrieval
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VideoBatch_Fast_2.8.3_stable
          path: |
            ${{ runner.temp }}/release/VideoBatch_Fast_2.8.3.zip
            ${{ runner.temp }}/release/VideoBatch_Fast_2.8.3.zip.sha256
            ${{ runner.temp }}/release/VideoBatch_Fast_2.8.3_FINAL_REPORT.json
            ${{ runner.temp }}/release/VideoBatch_Fast_2.8.3_RELEASE_METADATA.json
          if-no-files-found: error
          retention-days: 90
