name: Synchronize Checkpoint 2 with current main once

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: sync-checkpoint2-main-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge-current-main:
    name: Merge exact main without conflict resolution
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/canonical-design-manifest-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_MAIN_SHA: 049376fc8273a17f97d8b211d550ec8e9b6be4ca
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src

    steps:
      - name: Check out exact writable PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable inputs
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge exact main fail-closed
        run: |
          set -Eeuo pipefail
          if ! git merge --no-ff --no-commit "$EXPECTED_MAIN_SHA"; then
            git status --short
            git merge --abort || true
            echo "::error title=Main synchronization failed::The exact main commit could not be merged; no automatic conflict resolution is permitted."
            exit 1
          fi
          test -f .git/MERGE_HEAD
          test "$(cat .git/MERGE_HEAD)" = "$EXPECTED_MAIN_SHA"
          rm -- .github/workflows/sync-checkpoint2-with-main.yml

      - name: Regenerate and validate merged release contract
        run: |
          set -Eeuo pipefail
          python3 scripts/build_release_manifest.py
          python3 scripts/build_release_manifest.py --check --json \
            | tee "$RUNNER_TEMP/release-manifest-after-main.json"
          python3 scripts/validate_design_manifest.py --json \
            | tee "$RUNNER_TEMP/design-manifest-after-main.json"
          python3 -m compileall -q -f \
            scripts/validate_design_manifest.py \
            src/videobatch_fast/app.py \
            src/videobatch_fast/canonical_ui.py \
            src/videobatch_fast/canonical_shell_contract.py \
            src/videobatch_fast/canonical_shell_chrome.py \
            src/videobatch_fast/canonical_shell_workspace.py

      - name: Enforce bounded merge content
        run: |
          set -Eeuo pipefail
          git add -A
          mapfile -t changed < <(git diff --cached --name-only)
          printf '%s\n' "${changed[@]}"
          allowed='^(.github/workflows/kubuntu-main-comment-dispatch.yml|.github/workflows/pr-ancestry-owner-finalizer.yml|.github/workflows/sync-checkpoint2-with-main.yml|RELEASE_MANIFEST.json)$'
          for path in "${changed[@]}"; do
            if [[ ! "$path" =~ $allowed ]]; then
              echo "::error title=Unexpected main merge path::$path is outside the approved synchronization set."
              exit 1
            fi
          done
          test "${#changed[@]}" -ge 3
          git diff --cached --check

      - name: Create verified two-parent merge commit
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          git commit -m "merge: synchronize Checkpoint 2 branch with current main"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          python3 scripts/build_release_manifest.py --check --json
          python3 scripts/validate_design_manifest.py --json
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
