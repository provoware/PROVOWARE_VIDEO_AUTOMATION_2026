name: Synchronize final recovery consistency manifest

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sync-final-recovery-manifest.yml'

permissions:
  contents: write

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove helper, build exact manifest and commit atomically
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/sync-final-recovery-manifest.yml
          PYTHONPATH=src python3 scripts/build_release_manifest.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          if manifest.get('file_count') != 371:
              raise SystemExit(f"Expected exactly 371 files, got {manifest.get('file_count')!r}")
          paths = {item.get('path') for item in manifest.get('files', [])}
          required = {
              'src/videobatch_fast/recovery_consistency.py',
              'tests/test_recovery_consistency.py',
              'videobatch.sh',
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f'Manifest misses required files: {missing!r}')
          if '.github/workflows/sync-final-recovery-manifest.yml' in paths:
              raise SystemExit('Temporary synchronization workflow leaked into manifest')
          print('FINAL MANIFEST VERIFIED · 371 files')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_MANIFEST.json
          git commit -m 'Synchronize 371-file recovery consistency manifest'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
