name: One-shot canonical release manifest sync

on:
  push:
    branches:
      - cleanup/ui-design-system-20260904
    paths:
      - .github/workflows/sync-release-manifest-once.yml

permissions:
  contents: write

concurrency:
  group: one-shot-release-manifest-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONPATH: src

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/ui-design-system-20260904
          fetch-depth: 1

      - name: Prepare pinned Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-toolchain.lock

      - name: Install pinned toolchain
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-input --requirement requirements-toolchain.lock

      - name: Generate manifest for final tree and remove this helper
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/sync-release-manifest-once.yml
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check --json
          git status --short

      - name: Commit exact manifest and helper removal
        run: |
          set -Eeuo pipefail
          git config user.name 'provoware-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add RELEASE_MANIFEST.json .github/workflows/sync-release-manifest-once.yml
          git diff --cached --check
          git commit -m 'build: synchronize canonical release manifest'
          git push origin HEAD:cleanup/ui-design-system-20260904
