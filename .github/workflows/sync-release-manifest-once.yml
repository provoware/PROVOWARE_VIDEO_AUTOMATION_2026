name: One-shot release manifest sync

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/sync-release-manifest-once.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Remove helper and regenerate canonical manifest
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/sync-release-manifest-once.yml
          python3 scripts/build_release_manifest.py
          python3 scripts/build_release_manifest.py --check --json
          git status --short

      - name: Commit exact generated manifest and helper removal
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_MANIFEST.json
          git diff --cached --check
          git commit -m 'chore: sync release manifest after shell matrix fix'
          git push origin "HEAD:${{ github.head_ref }}"
