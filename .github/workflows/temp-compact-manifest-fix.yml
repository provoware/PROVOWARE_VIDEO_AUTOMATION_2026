name: TEMP Compact Manifest Fix

on:
  push:
    branches:
      - debug/failure-intelligence-20260907

permissions:
  contents: write

jobs:
  compact-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -e .

      - name: Generate compact manifest for final tracked source set
        env:
          PYTHONPATH: src
        run: |
          git rm .github/workflows/temp-compact-manifest-fix.yml
          python scripts/build_release_manifest.py --compact
          python scripts/build_release_manifest.py --check --compact
          git diff --check

      - name: Audit exact finalization scope and self-remove
        run: |
          git add RELEASE_MANIFEST.json
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            ".github/workflows/temp-compact-manifest-fix.yml"
            "RELEASE_MANIFEST.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#staged[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${staged[@]}")
          git config user.name "provoware-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "DEBUG-REGRESSION-001: preserve compact release manifest"
          git push origin HEAD:debug/failure-intelligence-20260907
