name: TEMP Failure Intelligence Validation

on:
  push:
    branches:
      - debug/failure-intelligence-20260907

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest==9.0.2

      - name: Compile changed Python files
        run: |
          python -m py_compile \
            src/videobatch_fast/failure_intelligence.py \
            src/videobatch_fast/canonical_ui.py \
            tests/test_failure_intelligence.py \
            tests/test_debug_runtime_contract.py

      - name: Run failure-intelligence regression tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_failure_intelligence.py --tb=long

      - name: Run existing debug and recovery regression tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_debug_runtime_contract.py \
            tests/test_event_registry.py \
            tests/test_retry_queue_diagnostics.py \
            tests/test_retry_queue_resilience.py \
            tests/test_recovery_consistency.py \
            --tb=long

      - name: Run event architecture checks
        env:
          PYTHONPATH: src
        run: |
          python scripts/check_event_registry.py
          python scripts/check_event_architecture.py

      - name: Prepare final release manifest without temporary gate
        env:
          PYTHONPATH: src
        run: |
          git rm .github/workflows/temp-failure-intelligence-validate.yml
          python scripts/build_release_manifest.py
          python scripts/build_release_manifest.py --check
          git diff --check

      - name: Audit and commit exact finalization scope
        run: |
          git add RELEASE_MANIFEST.json
          printf '%s\n' '--- staged files ---'
          git diff --cached --name-status
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            ".github/workflows/temp-failure-intelligence-validate.yml"
            "RELEASE_MANIFEST.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#staged[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${staged[@]}")
          git config user.name "provoware-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "DEBUG-REGRESSION-001: finalize manifest and remove temp validation"
          git push origin HEAD:debug/failure-intelligence-20260907
