name: TEMP Final F1 Help Fixed Package

on:
  push:
    branches:
      - automation/help-f1-fixed-20260907

permissions:
  contents: read

jobs:
  build-fixed-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify base lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor af2093b867686b383fcab372e29b11399c1ffbba HEAD
          echo "BASE-LINEAGE PASS"

      - name: Install minimal Tk runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-tk xvfb

      - name: Apply isolated F1 shortcut and help appearance polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          canonical = Path("src/videobatch_fast/canonical_ui.py")
          source = canonical.read_text(encoding="utf-8")
          marker = '    """VB-GFX-1.0 shell around the complete VideoBatch implementation."""\n\n\n'
          replacement = '''    """VB-GFX-1.0 shell around the complete VideoBatch implementation."""\n\n    def _open_help_from_keyboard(self, _event=None) -> str:\n        self._show_help_center()\n        return "break"\n\n\n'''
          if source.count(marker) != 1:
              raise SystemExit("F1-PATCH BLOCKIERT: Klassenmarker nicht eindeutig")
          source = source.replace(marker, replacement, 1)
          old_construct = '        CanonicalVideoBatchFastUI(root)\n        root.update_idletasks()\n'
          new_construct = '        app = CanonicalVideoBatchFastUI(root)\n        root.bind("<F1>", app._open_help_from_keyboard, add="+")\n        root.update_idletasks()\n'
          if source.count(old_construct) != 1:
              raise SystemExit("F1-PATCH BLOCKIERT: App-Konstruktionsblock nicht eindeutig")
          canonical.write_text(source.replace(old_construct, new_construct, 1), encoding="utf-8")

          components = Path("src/videobatch_fast/ui_components.py")
          source = components.read_text(encoding="utf-8")
          old = '''        buttons = ttk.Frame(outer)\n        buttons.pack(fill=X, pady=(10, 0))\n        refresh_button = ttk.Button(buttons, text=text("help_center.refresh"), command=self._refresh)\n        refresh_button.pack(side=LEFT)\n        Tooltip(refresh_button, text("help_center.tooltip.refresh"))\n        self.copy_label = StringVar(value=text("help_center.copy_status"))\n        copy_button = ttk.Button(buttons, textvariable=self.copy_label, command=self._copy_status)\n        copy_button.pack(side=LEFT, padx=(6, 0))\n        Tooltip(copy_button, text("help_center.tooltip.copy"))\n        logs_button = ttk.Button(buttons, text=text("help_center.logs"), command=on_open_logs)\n        logs_button.pack(side=LEFT, padx=(6, 0))\n        Tooltip(logs_button, text("help_center.tooltip.logs"))\n        manual_button = ttk.Button(buttons, text=text("help_center.manual"), command=on_open_manual)\n        manual_button.pack(side=LEFT, padx=(6, 0))\n        Tooltip(manual_button, text("help_center.tooltip.manual"))\n        if on_run_fault_lab is not None:\n            fault_button = ttk.Button(buttons, text=text("help_center.fault_lab"), command=on_run_fault_lab)\n            fault_button.pack(side=LEFT, padx=(6, 0))\n            Tooltip(fault_button, text("help_center.tooltip.fault_lab"))\n        close_button = ttk.Button(buttons, text=text("help_center.close"), style="Accent.TButton", command=self.window.destroy)\n        close_button.pack(side=RIGHT)\n        Tooltip(close_button, text("help_center.tooltip.close"))\n        self.window.bind("<Escape>", lambda _event: self.window.destroy())\n'''
          new = '''        buttons = ttk.Frame(outer)\n        buttons.pack(fill=X, pady=(10, 0))\n        for column in range(2):\n            buttons.columnconfigure(column, weight=1)\n\n        refresh_button = ttk.Button(buttons, text=text("help_center.refresh"), command=self._refresh)\n        refresh_button.grid(row=0, column=0, sticky="ew", padx=(0, 3), pady=3)\n        Tooltip(refresh_button, text("help_center.tooltip.refresh"))\n        self.copy_label = StringVar(value=text("help_center.copy_status"))\n        copy_button = ttk.Button(buttons, textvariable=self.copy_label, command=self._copy_status)\n        copy_button.grid(row=0, column=1, sticky="ew", padx=(3, 0), pady=3)\n        Tooltip(copy_button, text("help_center.tooltip.copy"))\n        logs_button = ttk.Button(buttons, text=text("help_center.logs"), command=on_open_logs)\n        logs_button.grid(row=1, column=0, sticky="ew", padx=(0, 3), pady=3)\n        Tooltip(logs_button, text("help_center.tooltip.logs"))\n        manual_button = ttk.Button(buttons, text=text("help_center.manual"), command=on_open_manual)\n        manual_button.grid(row=1, column=1, sticky="ew", padx=(3, 0), pady=3)\n        Tooltip(manual_button, text("help_center.tooltip.manual"))\n        if on_run_fault_lab is not None:\n            fault_button = ttk.Button(buttons, text=text("help_center.fault_lab"), command=on_run_fault_lab)\n            fault_button.grid(row=2, column=0, sticky="ew", padx=(0, 3), pady=3)\n            Tooltip(fault_button, text("help_center.tooltip.fault_lab"))\n        close_button = ttk.Button(buttons, text=text("help_center.close"), style="Accent.TButton", command=self.window.destroy)\n        close_button.grid(row=2, column=1, sticky="ew", padx=(3, 0), pady=3)\n        Tooltip(close_button, text("help_center.tooltip.close"))\n        self.window.bind("<Escape>", lambda _event: self.window.destroy())\n'''
          if source.count(old) != 1:
              raise SystemExit("UI-POLISH BLOCKIERT: Hilfeaktionsblock nicht eindeutig")
          components.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Compile and static contract validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/videobatch_fast/canonical_ui.py src/videobatch_fast/ui_components.py src/videobatch_fast/canonical_shell_chrome.py
          python3 - <<'PY'
          from pathlib import Path
          canonical = Path("src/videobatch_fast/canonical_ui.py").read_text(encoding="utf-8")
          shell = Path("src/videobatch_fast/canonical_shell_chrome.py").read_text(encoding="utf-8")
          components = Path("src/videobatch_fast/ui_components.py").read_text(encoding="utf-8")
          assert 'root.bind("<F1>", app._open_help_from_keyboard, add="+")' in canonical
          assert 'bind_all("<F1>"' not in canonical
          assert 'command=self._show_help_center' in shell
          assert 'search.bind("<Return>", self._run_shell_search)' in shell
          assert 'self.window.bind("<Escape>", lambda _event: self.window.destroy())' in components
          for marker in (
              'refresh_button.grid(row=0, column=0', 'copy_button.grid(row=0, column=1',
              'logs_button.grid(row=1, column=0', 'manual_button.grid(row=1, column=1',
              'fault_button.grid(row=2, column=0', 'close_button.grid(row=2, column=1',
          ):
              assert marker in components
          print("STATIC CONTRACT PASS")
          PY

      - name: Exact Tk keyboard and HelpCenter runtime validation
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          xvfb-run -a python3 - <<'PY'
          import ast
          from pathlib import Path
          from types import MethodType
          from tkinter import Tk, Toplevel, ttk
          from videobatch_fast.ui_components import HelpCenterDialog

          # Use the exact implemented F1 method from canonical_ui.py without importing the full app graph.
          source = Path("src/videobatch_fast/canonical_ui.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == "CanonicalVideoBatchFastUI")
          method = next(n for n in cls.body if isinstance(n, ast.FunctionDef) and n.name == "_open_help_from_keyboard")
          module = ast.Module(body=[method], type_ignores=[])
          ast.fix_missing_locations(module)
          ns = {}
          exec(compile(module, "<canonical-f1>", "exec"), ns)

          root = Tk()
          root.geometry("680x520")
          root.tk.call("tk", "scaling", 1.4)
          root.update()

          class FakeApp:
              def __init__(self, master):
                  self.master = master
                  self.help_windows = []
              def _show_help_center(self):
                  window = Toplevel(self.master)
                  window.title("Hilfe")
                  self.help_windows.append(window)

          app = FakeApp(root)
          app._open_help_from_keyboard = MethodType(ns["_open_help_from_keyboard"], app)
          root.bind("<F1>", app._open_help_from_keyboard, add="+")

          entry = ttk.Entry(root)
          entry.pack()
          return_calls = []
          entry.bind("<Return>", lambda _event: return_calls.append("return"))
          entry.focus_force()
          root.update()
          entry.event_generate("<Return>")
          root.update()
          assert return_calls == ["return"], "Return-Binding im Eingabefeld wurde beeinträchtigt"
          assert not app.help_windows, "Return darf die Hilfe nicht öffnen"

          entry.event_generate("<F1>")
          root.update()
          assert len(app.help_windows) == 1 and app.help_windows[0].winfo_exists(), "F1 öffnet Hilfe nicht"
          app.help_windows[0].destroy()

          dialog = HelpCenterDialog(
              root,
              system_status="Bereit",
              on_refresh=lambda: "Bereit",
              on_open_logs=lambda: None,
              on_open_manual=lambda: None,
              on_run_fault_lab=lambda: None,
          )
          dialog.window.geometry("680x520")
          dialog.window.deiconify()
          dialog.window.update()

          def descendants(widget):
              for child in widget.winfo_children():
                  yield child
                  yield from descendants(child)

          candidates = []
          for frame in [w for w in descendants(dialog.window) if isinstance(w, ttk.Frame)]:
              direct = [c for c in frame.winfo_children() if isinstance(c, ttk.Button)]
              if len(direct) >= 5:
                  candidates.append((frame, direct))
          assert len(candidates) == 1
          action_frame, buttons = candidates[0]
          assert len(buttons) == 6
          positions = {(int(b.grid_info()["row"]), int(b.grid_info()["column"])) for b in buttons}
          assert positions == {(0,0),(0,1),(1,0),(1,1),(2,0),(2,1)}
          dialog.window.update_idletasks()
          assert action_frame.winfo_width() > 400, action_frame.winfo_width()
          assert all(b.winfo_width() >= b.winfo_reqwidth() for b in buttons), [
              (b.cget("text"), b.winfo_width(), b.winfo_reqwidth()) for b in buttons
          ]

          window = dialog.window
          window.event_generate("<Escape>")
          root.update()
          assert not window.winfo_exists(), "Escape schließt Hilfezentrum nicht"
          root.destroy()
          print("F1 OPENS HELP RUNTIME PASS")
          print("ENTRY RETURN UNCHANGED RUNTIME PASS")
          print("HELP 680x520 @ 140% LAYOUT PASS")
          print("ESCAPE CLOSES HELP RUNTIME PASS")
          PY

      - name: Regenerate and validate canonical release manifest
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-help-f1-package.yml .github/workflows/temp-help-f1-package-final.yml
          python3 scripts/build_release_manifest.py | tee /tmp/manifest-build.txt
          python3 scripts/build_release_manifest.py --check | tee /tmp/manifest-check.txt
          python3 scripts/validate_documentation.py | tee /tmp/documentation-check.txt

      - name: Verify exact final diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort | tee /tmp/final-diff.txt
          python3 - <<'PY'
          from pathlib import Path
          actual = set(Path("/tmp/final-diff.txt").read_text(encoding="utf-8").splitlines())
          allowed = {
              ".github/workflows/temp-help-f1-package.yml",
              ".github/workflows/temp-help-f1-package-final.yml",
              "RELEASE_MANIFEST.json",
              "src/videobatch_fast/canonical_ui.py",
              "src/videobatch_fast/ui_components.py",
          }
          required = {
              "RELEASE_MANIFEST.json",
              "src/videobatch_fast/canonical_ui.py",
              "src/videobatch_fast/ui_components.py",
          }
          assert not (actual - allowed), sorted(actual - allowed)
          assert required.issubset(actual), sorted(required - actual)
          print("FINAL DIFF SCOPE PASS")
          PY

      - name: Build complete fixed project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          import stat, time, zipfile
          root = Path.cwd()
          name = "PROVOWARE_VIDEO_AUTOMATION_2026_F1_HELP_UI_FIXED_2026-09-07"
          out = root / "dist" / f"{name}.zip"
          skip_parts = {".git", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", "dist"}
          helpers = {
              Path(".github/workflows/temp-help-f1-package.yml"),
              Path(".github/workflows/temp-help-f1-package-final.yml"),
          }
          files = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if rel in helpers or any(part in skip_parts for part in rel.parts):
                  continue
              files.append((rel, path))
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for rel, path in sorted(files, key=lambda x: x[0].as_posix()):
                  info = zipfile.ZipInfo(f"{name}/{rel.as_posix()}")
                  info.date_time = time.localtime(path.stat().st_mtime)[:6]
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IMODE(path.stat().st_mode) & 0xFFFF) << 16
                  zf.writestr(info, path.read_bytes())
          with zipfile.ZipFile(out) as zf:
              assert zf.testzip() is None
              names = zf.namelist()
              assert not any("temp-help-f1-package" in n for n in names)
              assert any(n.endswith("src/videobatch_fast/canonical_ui.py") for n in names)
              assert any(n.endswith("RELEASE_MANIFEST.json") for n in names)
          print(f"ZIP PASS · {out.name} · {len(files)} Dateien · {out.stat().st_size} Byte")
          PY
          {
            echo "PROVOWARE VIDEO AUTOMATION 2026 · HELP-F1-SHORTCUT-001"
            echo "Base SHA: af2093b867686b383fcab372e29b11399c1ffbba"
            echo "PASS · F1 öffnet Hilfe als echtes Tk-Ereignis"
            echo "PASS · Escape schließt Hilfezentrum"
            echo "PASS · bestehender Hilfe-Button unverändert"
            echo "PASS · Return-Binding eines Eingabefeldes unverändert"
            echo "PASS · keine bind_all-F1-Bindung"
            echo "PASS · Hilfeaktionen 2 Spalten x 3 Reihen bei 680x520 und 140%"
            echo "PASS · Release-Manifest kanonisch regeneriert und geprüft"
            echo "PASS · Dokumentationsvalidator"
            echo "PASS · ZIP-Integrität und Helper-Ausschluss"
            echo ""
            cat /tmp/final-diff.txt
          } > dist/VALIDATION_HELP_F1_FIXED_2026-09-07.txt
          sha256sum dist/PROVOWARE_VIDEO_AUTOMATION_2026_F1_HELP_UI_FIXED_2026-09-07.zip > dist/PROVOWARE_VIDEO_AUTOMATION_2026_F1_HELP_UI_FIXED_2026-09-07.zip.sha256

      - name: Upload fixed package
        uses: actions/upload-artifact@v4
        with:
          name: PROVOWARE_VIDEO_AUTOMATION_2026_F1_HELP_UI_FIXED_2026-09-07_FINAL
          path: |
            dist/PROVOWARE_VIDEO_AUTOMATION_2026_F1_HELP_UI_FIXED_2026-09-07.zip
            dist/PROVOWARE_VIDEO_AUTOMATION_2026_F1_HELP_UI_FIXED_2026-09-07.zip.sha256
            dist/VALIDATION_HELP_F1_FIXED_2026-09-07.txt
          if-no-files-found: error
          retention-days: 7
