name: TEMP PR121 Evidence Manifest Count Sync

on:
  push:
    branches:
      - fix/post-merge-workflow-repair-001

permissions:
  contents: write

jobs:
  sync-evidence-count:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -e .

      - name: Bind canonical evidence to verified manifest count
        env:
          PYTHONPATH: src:scripts
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/temp-pr121-evidence-count-sync.yml
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path('RELEASE_MANIFEST.json')
          evidence_path = Path('diagnostics/release_readiness/RELEASE_EVIDENCE.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          count = manifest.get('file_count')
          if not isinstance(count, int) or count <= 0:
              raise SystemExit('Ungültige file_count im geprüften RELEASE_MANIFEST.json')
          evidence_manifest = evidence.get('manifest')
          if not isinstance(evidence_manifest, dict):
              raise SystemExit('RELEASE_EVIDENCE.manifest fehlt oder ist ungültig')
          evidence_manifest['file_count'] = count
          evidence_path.write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'Evidence-Manifest-Dateizahl synchronisiert: {count}')
          PY
          python diagnostics/release_readiness/generate_from_evidence.py --write
          python diagnostics/release_readiness/generate_from_evidence.py --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "README.md"
            "QUALITY_ENVIRONMENT_STATUS.json"
            "VideoBatch_Fast_2.8.3-rc24_BUILD_REPORT_save_.json"
            "diagnostics/release_readiness/RELEASE_EVIDENCE.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Rebuild and cross-check release manifest
        env:
          PYTHONPATH: src:scripts
        run: |
          set -Eeuo pipefail
          python scripts/build_release_manifest.py --compact
          python scripts/build_release_manifest.py --check --compact
          python diagnostics/release_readiness/generate_from_evidence.py --check
          git diff --check
          python - <<'PY'
          import json
          m=json.load(open('RELEASE_MANIFEST.json', encoding='utf-8'))
          e=json.load(open('diagnostics/release_readiness/RELEASE_EVIDENCE.json', encoding='utf-8'))
          assert e['manifest']['file_count'] == m['file_count'], (e['manifest']['file_count'], m['file_count'])
          print('Cross-Contract PASS:', m['file_count'])
          PY

      - name: Commit exact synchronized scope and self-removal
        run: |
          set -Eeuo pipefail
          git add README.md QUALITY_ENVIRONMENT_STATUS.json RELEASE_MANIFEST.json VideoBatch_Fast_2.8.3-rc24_BUILD_REPORT_save_.json diagnostics/release_readiness/RELEASE_EVIDENCE.json
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            ".github/workflows/temp-pr121-evidence-count-sync.yml"
            "README.md"
            "QUALITY_ENVIRONMENT_STATUS.json"
            "RELEASE_MANIFEST.json"
            "VideoBatch_Fast_2.8.3-rc24_BUILD_REPORT_save_.json"
            "diagnostics/release_readiness/RELEASE_EVIDENCE.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#staged[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${staged[@]}")
          git config user.name "provoware-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "POST-MERGE-WORKFLOW-REPAIR-001: Evidence an aktuellen Manifestbestand binden"
          git push origin HEAD:fix/post-merge-workflow-repair-001
