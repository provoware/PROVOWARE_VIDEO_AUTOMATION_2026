name: TEMP PR121 Evidence Sync

on:
  push:
    branches:
      - fix/post-merge-workflow-repair-001

permissions:
  contents: write

jobs:
  sync-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -e .

      - name: Regenerate only canonical derived outputs
        env:
          PYTHONPATH: src:scripts
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/temp-pr121-evidence-sync.yml
          python diagnostics/release_readiness/generate_from_evidence.py
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            "README.md"
            "RELEASE_FILE_STATUS.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          python diagnostics/release_readiness/generate_from_evidence.py --check

      - name: Rebuild and verify compact release manifest
        env:
          PYTHONPATH: src:scripts
        run: |
          set -Eeuo pipefail
          python scripts/build_release_manifest.py --compact
          python scripts/build_release_manifest.py --check --compact
          python diagnostics/release_readiness/generate_from_evidence.py --check
          git diff --check

      - name: Commit exact generated scope and self-removal
        run: |
          set -Eeuo pipefail
          git add README.md RELEASE_FILE_STATUS.json RELEASE_MANIFEST.json
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            ".github/workflows/temp-pr121-evidence-sync.yml"
            "README.md"
            "RELEASE_FILE_STATUS.json"
            "RELEASE_MANIFEST.json"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#staged[@]}" -eq "${#expected_sorted[@]}"
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${staged[@]}")
          git config user.name "provoware-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "POST-MERGE-WORKFLOW-REPAIR-001: abgeleitete Release-Evidence synchronisieren"
          git push origin HEAD:fix/post-merge-workflow-repair-001
