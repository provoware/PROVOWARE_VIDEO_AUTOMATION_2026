name: TEMP Responsive UI Upgrade v2

on:
  push:
    branches:
      - ui/compact-responsive-zoom-recovery-20260907

permissions:
  contents: write

jobs:
  upgrade-and-validate-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact base
        run: git merge-base --is-ancestor af2093b867686b383fcab372e29b11399c1ffbba HEAD

      - name: Install exact test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-tk xvfb python3-pytest

      - name: Reuse the reviewed patch body from v1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/temp-responsive-ui-upgrade.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Compile and targeted regression tests"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          patch = textwrap.dedent(source[start:end])
          exec(compile(patch, '<responsive-ui-patch>', 'exec'), {})
          print('PATCH REUSED EXACTLY FROM REVIEWED V1')
          PY

      - name: Compile and targeted regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -euo pipefail
          python3 -m py_compile src/videobatch_fast/canonical_ui.py src/videobatch_fast/ui_components.py src/videobatch_fast/ui_area_zoom_mixin.py src/videobatch_fast/ui_recovery_mixin.py src/videobatch_fast/canonical_dashboard_mixin.py src/videobatch_fast/canonical_shell_chrome.py
          python3 -m pytest -q tests/test_compact_responsive_ui_contract.py tests/test_canonical_layout_resilience.py tests/test_rc19_visibility_zoom_slideshow.py tests/test_recovery_consistency.py tests/test_canonical_application_shell_contract.py

      - name: Tk Help Escape runtime gate
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          xvfb-run -a python3 - <<'PY'
          from tkinter import Tk, ttk
          from videobatch_fast.ui_components import HelpCenterDialog
          root = Tk(); root.geometry('1280x720'); root.tk.call('tk', 'scaling', 1.4); root.update()
          dialog = HelpCenterDialog(root, system_status='Bereit', on_refresh=lambda:'Bereit', on_open_logs=lambda:None, on_open_manual=lambda:None, on_run_fault_lab=lambda:None)
          dialog.window.geometry('680x520'); dialog.window.update()
          buttons=[]
          def walk(w):
              for child in w.winfo_children():
                  if isinstance(child, ttk.Button): buttons.append(child)
                  walk(child)
          walk(dialog.window)
          assert len(buttons) >= 6
          window=dialog.window; window.event_generate('<Escape>'); root.update(); assert not window.winfo_exists()
          root.destroy()
          print('TK HELP ESCAPE PASS')
          PY

      - name: Regenerate release manifest and validate docs
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
        run: |
          rm -f .github/workflows/temp-responsive-ui-upgrade.yml .github/workflows/temp-responsive-ui-upgrade-v2.yml
          python3 scripts/build_release_manifest.py
          python3 scripts/build_release_manifest.py --check
          python3 scripts/validate_documentation.py

      - name: Audit and commit validated changes
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name 'provoware-ui-validation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'ux: compact responsive desktop shell and safe recovery controls'
          git push origin HEAD:ui/compact-responsive-zoom-recovery-20260907
