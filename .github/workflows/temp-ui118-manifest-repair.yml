name: TEMP PR118 Manifest Repair

on:
  push:
    branches:
      - ui/compact-responsive-zoom-recovery-20260907

permissions:
  contents: write

jobs:
  repair-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify validated parent
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9d7d852da1327ce03f09156731119e07aaa03220 HEAD
      - name: Remove temporary workflow from tracked tree
        run: git rm -f .github/workflows/temp-ui118-manifest-repair.yml
      - name: Regenerate manifest from committed product tree
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          python3 scripts/build_release_manifest.py
          python3 scripts/build_release_manifest.py --check --json | tee /tmp/manifest-check.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          assert int(manifest.get('file_count', -1)) == 444, manifest.get('file_count')
          files=manifest.get('files', [])
          paths={item.get('path') for item in files if isinstance(item, dict)}
          assert 'tests/test_compact_responsive_ui_contract.py' in paths
          assert '.github/workflows/temp-ui118-manifest-repair.yml' not in paths
          print('MANIFEST 444 + RESPONSIVE UI CONTRACT PASS')
          PY
      - name: Validate documentation and exact diff
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          python3 scripts/validate_documentation.py
          git diff --check
          git status --short
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD'], text=True).splitlines())
          expected={'.github/workflows/temp-ui118-manifest-repair.yml','RELEASE_MANIFEST.json'}
          assert changed == expected, (changed, expected)
          print('MANIFEST REPAIR DIFF SCOPE PASS')
          PY
      - name: Commit manifest repair only
        run: |
          set -euo pipefail
          git config user.name 'provoware-ui-validation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: refresh release manifest for responsive UI contract'
          git push origin HEAD:ui/compact-responsive-zoom-recovery-20260907
