name: Temporary AppEvent manifest sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-app-event-manifest-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/crash-resilience-fault-lab-20260805
          fetch-depth: 0
      - name: Generate exact manifest and remove synchronizer
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-app-event-manifest-sync.yml
          PYTHONPATH=src python3 scripts/build_release_manifest.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          if payload.get('file_count') != 373 or len(payload.get('files', [])) != 373:
              raise SystemExit(f"Manifest count mismatch: {payload.get('file_count')} / {len(payload.get('files', []))}")
          paths = {item.get('path') for item in payload['files']}
          required = {
              'src/videobatch_fast/app_events.py',
              'src/videobatch_fast/event_buffer.py',
              'tests/test_app_events.py',
          }
          if not required.issubset(paths):
              raise SystemExit(f"Manifest missing AppEvent files: {sorted(required - paths)}")
          if '.github/workflows/temporary-app-event-manifest-sync.yml' in paths:
              raise SystemExit('Temporary workflow leaked into release manifest')
          PY
          git add RELEASE_MANIFEST.json
          git diff --cached --check
          git commit -m 'Synchronize AppEvent release manifest'
          git push origin HEAD:agent/crash-resilience-fault-lab-20260805
