name: Temporary export canonical evidence branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/scripts/release-evidence-payload.b64
      - .github/workflows/temporary-apply-release-evidence.yml

permissions:
  contents: read

jobs:
  export:
    name: Export exact PR tree for local deterministic generation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Package tracked source and Git metadata
        run: |
          set -Eeuo pipefail
          mkdir -p branch-export
          git rev-parse HEAD > branch-export/HEAD_SHA.txt
          git rev-parse 'HEAD^{tree}' > branch-export/TREE_SHA.txt
          git ls-files | LC_ALL=C sort > branch-export/TRACKED_FILES.txt
          git ls-files -z | tar --null --files-from=- -czf branch-export/TRACKED_SOURCE.tar.gz
          sha256sum branch-export/TRACKED_SOURCE.tar.gz > branch-export/TRACKED_SOURCE.sha256

      - name: Upload exact branch export
        uses: actions/upload-artifact@v4
        with:
          name: canonical-release-evidence-branch-export
          path: branch-export/*
          if-no-files-found: error
          retention-days: 1
