name: Temporary apply canonical release evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/scripts/release-evidence-payload.b64
      - .github/workflows/temporary-apply-release-evidence.yml

permissions:
  contents: write

concurrency:
  group: apply-release-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Generate, verify, and commit canonical release evidence
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: 'src:.'

    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Restore trusted workflow and install verified payload
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          git show FETCH_HEAD:.github/workflows/kubuntu-pr-matrix.yml \
            > .github/workflows/kubuntu-pr-matrix.yml
          base64 --decode .github/scripts/release-evidence-payload.b64 \
            > "$RUNNER_TEMP/release-evidence.tar.gz"
          echo 'd1a1c0d46b04b0ac102cf2fdbf78e7fba4c8b4186753f7cf9135b66df011f08c  '"$RUNNER_TEMP/release-evidence.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/release-evidence.tar.gz" -C .
          rm -f .github/scripts/release-evidence-payload.b64
          rm -f .github/workflows/temporary-apply-release-evidence.yml

      - name: Generate canonical derived evidence
        run: |
          set -Eeuo pipefail
          python3 -m py_compile diagnostics/release_readiness/*.py
          python3 diagnostics/release_readiness/generate_from_evidence.py --write
          python3 - <<'PY'
          from pathlib import Path

          path = Path('FAIL_MEMORY_PASS.md')
          text = path.read_text(encoding='utf-8')
          begin = '<!-- release-evidence-memory:start -->'
          end = '<!-- release-evidence-memory:end -->'
          block = '''<!-- release-evidence-memory:start -->
## Aktuelle Folge-Iteration – kanonische Release-Evidence

### Ziel

`diagnostics/release_readiness/RELEASE_EVIDENCE.json` ist die einzige Primärquelle für Testzahlen, Manifestzahl, Matrixnachweis, Release-Dateistatus und Stable-Blocker.

### Bestätigter Stand

- 325/325 automatisierte Tests bestanden
- Release-Manifest: 365 Dateien
- Kubuntu-CI-Matrix: 4/4 Kombinationen bestanden, Workflow-Run 30966067548
- README, Buildbericht, Entwicklungsstatus, Qualitätsstatus und Release-Dateistatus werden deterministisch aus der Primärquelle erzeugt
- jede manuelle Abweichung wird durch `generate_from_evidence.py --check` und das Dashboard als Fehler blockiert
- Stable bleibt gesperrt: Ruff, MyPy, Bandit, pip-audit, physische KDE-Abnahme und Langzeitrender sind getrennt offen

### Neue Schutzregel

Freigabezahlen niemals direkt in abgeleiteten Dateien ändern. Zuerst `RELEASE_EVIDENCE.json` mit nachvollziehbarer Provenienz aktualisieren, danach Generator, Manifestregeneration und Dashboardprüfung ausführen.

### Nächster bevorzugter Entwicklungspunkt

Die exakt gepinnte Offline-Qualitätswerkzeugkette ausführen und deren Resultate ausschließlich in `RELEASE_EVIDENCE.json` übernehmen.
<!-- release-evidence-memory:end -->'''
          if begin in text and end in text:
              start = text.index(begin)
              finish = text.index(end, start) + len(end)
              text = text[:start] + block + text[finish:]
          else:
              text = text.rstrip() + '\n\n' + block + '\n'
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/build_release_manifest.py

      - name: Verify drift, manifest, and readiness
        run: |
          set -Eeuo pipefail
          python3 diagnostics/release_readiness/generate_from_evidence.py --check
          python3 scripts/validate_release_manifest.py
          python3 diagnostics/release_readiness/selftest.py
          python3 diagnostics/release_readiness/running_status_selftest.py
          set +e
          python3 diagnostics/release_readiness/release_readiness_dashboard.py \
            --root . \
            --ci-file diagnostics/release_readiness/ci_status.example.json
          code=$?
          set -e
          test "$code" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('build/release-readiness/RELEASE_READINESS_STATUS.json').read_text(encoding='utf-8'))
          evidence = json.loads(Path('diagnostics/release_readiness/RELEASE_EVIDENCE.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          assert evidence['tests']['passed'] == 325, evidence['tests']
          assert result['overall_status'] == 'yellow', result
          assert result['summary']['errors'] == 0, result
          assert result['read_only_inputs_verified'] is True, result
          assert manifest['file_count'] == 365, manifest['file_count']
          print('CANONICAL EVIDENCE PASS · 325 tests · 365 files · yellow without contradictions')
          PY

      - name: Commit verified canonical evidence
        run: |
          set -Eeuo pipefail
          git config user.name 'provoware-release-bot'
          git config user.email 'provoware.one@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Unify release evidence into one canonical source'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
