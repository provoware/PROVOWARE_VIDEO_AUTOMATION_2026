name: Temporary release readiness dashboard audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - diagnostics/release_readiness/**
      - .github/workflows/temporary-release-readiness-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: Validate read-only dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out dashboard branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compile dashboard modules
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            diagnostics/release_readiness/engine.py \
            diagnostics/release_readiness/release_readiness_dashboard.py \
            diagnostics/release_readiness/selftest.py

      - name: Run red yellow green self-test
        run: |
          set -Eeuo pipefail
          python3 diagnostics/release_readiness/selftest.py

      - name: Audit current repository evidence
        run: |
          set -Eeuo pipefail
          set +e
          python3 diagnostics/release_readiness/release_readiness_dashboard.py \
            --root . \
            --ci-file diagnostics/release_readiness/ci_status.example.json
          code=$?
          set -e
          test "$code" -eq 2
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path('build/release-readiness/RELEASE_READINESS_STATUS.json').read_text(encoding='utf-8')
          )
          assert result['overall_status'] == 'red', result
          codes = {item['code'] for item in result['findings']}
          assert 'MANIFEST_COUNT_MISMATCH' in codes, codes
          assert 'TEST_COUNT_MISMATCH' in codes, codes
          assert result['read_only_inputs_verified'] is True, result
          print('CURRENT EVIDENCE AUDIT PASS · contradictions correctly blocked · inputs unchanged')
          PY

      - name: Publish dashboard in job summary
        if: always()
        run: |
          if [[ -f build/release-readiness/RELEASE_READINESS_DASHBOARD.md ]]; then
            cat build/release-readiness/RELEASE_READINESS_DASHBOARD.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload dashboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-dashboard-audit
          path: build/release-readiness/*
          if-no-files-found: error
          retention-days: 7
