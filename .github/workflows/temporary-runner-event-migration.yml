name: Temporary typed runner event migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-runner-event-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/crash-resilience-fault-lab-20260805
          fetch-depth: 0
      - name: Apply verified migration and publish one atomic commit
        shell: bash
        env:
          BASE_SHA: 1d885bdf7197f3b04679cb1a78daaa9bc8f85ada
          ARCHIVE_SHA256: 015f17eae5c7b63b3a6ffa675afe523e251b6cab7dcb938cd74a37920d1d12f4
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD | sort)
          expected=(
            .github/workflows/temporary-runner-event-migration.yml
            matrix-logs/runner-event-migration.part00
            matrix-logs/runner-event-migration.part01
            matrix-logs/runner-event-migration.part02
            matrix-logs/runner-event-migration.part03
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${changed[*]}" == "${expected_sorted[*]}" ]] || {
            printf 'Unerwartete parallele Änderungen:\n%s\n' "${changed[*]}" >&2
            exit 42
          }

          cat matrix-logs/runner-event-migration.part{00,01,02,03} | base64 --decode > "$RUNNER_TEMP/runner-event-migration.tar.gz"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/runner-event-migration.tar.gz" | sha256sum --check --strict

          ARCHIVE="$RUNNER_TEMP/runner-event-migration.tar.gz" python3 - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath

          archive = os.environ['ARCHIVE']
          expected = {
              'AGENTS.md',
              'CHANGELOG.md',
              'TODO.md',
              'UPDATE_SYSTEM.md',
              'registries/CODE_QUALITY_REGISTRY.json',
              'test.sh',
              'src/videobatch_fast/app_events.py',
              'src/videobatch_fast/event_buffer.py',
              'src/videobatch_fast/runner.py',
              'src/videobatch_fast/runner_events.py',
              'src/videobatch_fast/selection_preview_controller.py',
              'src/videobatch_fast/ui.py',
              'src/videobatch_fast/ui_services_mixin.py',
              'src/videobatch_fast/ui_slideshow_mixin.py',
              'scripts/check_event_architecture.py',
              'tests/test_app_events.py',
              'tests/test_event_architecture_gate.py',
              'tests/test_hardening_2_8_2.py',
              'tests/test_rc24_selected_media_crash.py',
              'tests/test_release_hardening_2_8_3_rc7.py',
              'tests/test_retry_queue_resilience.py',
              'tests/test_runner_app_events.py',
          }
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              names = {member.name for member in members}
              if names != expected:
                  raise SystemExit(f'Archivinhalt weicht ab: missing={sorted(expected-names)} extra={sorted(names-expected)}')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or not member.isfile():
                      raise SystemExit(f'Unsicherer Archiveintrag: {member.name}')
          PY

          tar -xzf "$RUNNER_TEMP/runner-event-migration.tar.gz" -C .
          chmod 755 test.sh scripts/check_event_architecture.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('UPDATE_SYSTEM.md')
          path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git rm \
            .github/workflows/temporary-runner-event-migration.yml \
            matrix-logs/runner-event-migration.part00 \
            matrix-logs/runner-event-migration.part01 \
            matrix-logs/runner-event-migration.part02 \
            matrix-logs/runner-event-migration.part03

          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH="$PWD/src"
          export VIDEOBATCH_DIAGNOSTICS_DIR="$RUNNER_TEMP/diagnostics"
          python3 scripts/check_event_architecture.py
          python3 scripts/verify_compile_isolated.py
          python3 scripts/build_release_manifest.py

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          files = payload.get('files', [])
          if payload.get('file_count') != 377 or len(files) != 377:
              raise SystemExit(f"Manifestzahl falsch: {payload.get('file_count')} / {len(files)}")
          paths = {item.get('path') for item in files if isinstance(item, dict)}
          required = {
              'src/videobatch_fast/runner_events.py',
              'scripts/check_event_architecture.py',
              'tests/test_event_architecture_gate.py',
              'tests/test_runner_app_events.py',
          }
          if not required.issubset(paths):
              raise SystemExit(f'Manifestdateien fehlen: {sorted(required - paths)}')
          forbidden = {
              '.github/workflows/temporary-runner-event-migration.yml',
              'matrix-logs/runner-event-migration.part00',
              'matrix-logs/runner-event-migration.part01',
              'matrix-logs/runner-event-migration.part02',
              'matrix-logs/runner-event-migration.part03',
          }
          if paths & forbidden:
              raise SystemExit(f'Temporäre Dateien im Manifest: {sorted(paths & forbidden)}')
          PY

          git add -A
          git diff --cached --check
          git commit -m 'Migrate BatchRunner to typed AppEvent contracts'
          git push origin HEAD:agent/crash-resilience-fault-lab-20260805
