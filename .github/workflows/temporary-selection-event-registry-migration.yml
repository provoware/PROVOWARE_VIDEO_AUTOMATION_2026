name: Temporary selection event registry migration

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/temporary-selection-event-registry-migration.yml']

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crash-resilience-fault-lab-20260805
          fetch-depth: 0
      - name: Apply verified event migration atomically
        shell: bash
        env:
          BASE_SHA: b08516bb9d83a7cc4235eac8f489901b0a8c9657
          ARCHIVE_SHA256: ad4b5e09a2f0ccf5b4816e5e7b80d78e180b560224a7d6f163534865ab23bfee
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          mapfile -t changed < <(git diff --name-only "$BASE_SHA" HEAD | sort)
          expected=(
            .github/workflows/temporary-selection-event-registry-migration.yml
            matrix-logs/selection-event-registry.x00
            matrix-logs/selection-event-registry.x01
            matrix-logs/selection-event-registry.y00
            matrix-logs/selection-event-registry.y01
            matrix-logs/selection-event-registry.y02
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${changed[*]}" == "${expected_sorted[*]}" ]] || exit 42

          cat matrix-logs/selection-event-registry.{x00,x01,y00,y01,y02} \
            | base64 --decode > "$RUNNER_TEMP/patch.tar.gz"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$RUNNER_TEMP/patch.tar.gz" \
            | sha256sum --check --strict

          ARCHIVE="$RUNNER_TEMP/patch.tar.gz" python3 - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath
          expected = {
              'AGENTS.md', 'CHANGELOG.md', 'TODO.md', 'UPDATE_SYSTEM.md',
              'registries/CODE_QUALITY_REGISTRY.json',
              'scripts/check_event_architecture.py', 'scripts/check_event_registry.py',
              'src/videobatch_fast/app_events.py', 'src/videobatch_fast/event_registry.py',
              'src/videobatch_fast/selection_preview_controller.py',
              'src/videobatch_fast/selection_preview_events.py', 'src/videobatch_fast/ui.py',
              'src/videobatch_fast/ui_event_handlers_mixin.py', 'test.sh',
              'tests/test_app_events.py', 'tests/test_event_architecture_gate.py',
              'tests/test_event_registry.py', 'tests/test_rc24_selected_media_crash.py',
              'tests/test_release_hardening_2_8_3_rc7.py',
              'tests/test_selection_preview_app_events.py',
          }
          with tarfile.open(os.environ['ARCHIVE'], 'r:gz') as handle:
              members = handle.getmembers()
              names = {item.name for item in members}
              if names != expected:
                  raise SystemExit(f'Archivinhalt weicht ab: {sorted(names ^ expected)}')
              for item in members:
                  path = PurePosixPath(item.name)
                  if path.is_absolute() or '..' in path.parts or not item.isfile():
                      raise SystemExit(f'Unsicherer Archiveintrag: {item.name}')
          PY

          tar -xzf "$RUNNER_TEMP/patch.tar.gz" -C .
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/videobatch_fast/app_events.py')
          source = path.read_text(encoding='utf-8')
          old_import = 'from .event_registry import (\n    EventRegistryError,\n'
          new_import = 'from .event_registry import (\n    EventPayloadMode,\n    EventRegistryError,\n'
          old_mode = '        payload: Mapping[str, object]\n        if isinstance(self.payload, TypedEventPayload):\n'
          new_mode = '        payload: Mapping[str, object]\n        mode: EventPayloadMode\n        if isinstance(self.payload, TypedEventPayload):\n'
          if source.count(old_import) != 1 or source.count(old_mode) != 1:
              raise SystemExit('Unerwarteter AppEvent-Typisierungskontext.')
          path.write_text(source.replace(old_import, new_import).replace(old_mode, new_mode), encoding='utf-8')

          path = Path('src/videobatch_fast/selection_preview_controller.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('import threading\n', 'import threading\nimport time\n', 1)
          source = source.replace(
              'from .preview_service import build_preview\n',
              'from .preview_service import PreviewError, build_preview\n',
              1,
          )
          marker = '''    def _worker(self) -> None:\n'''
          helper = '''    def _build_preview(self, request: SelectionPreviewRequest) -> Path | None:\n        if not request.include_image:\n            return None\n        for attempt in range(2):\n            try:\n                return self._preview_builder(request.path, request.width)\n            except PreviewError:\n                if attempt or not self._is_current(request):\n                    raise\n                time.sleep(0.05)\n        raise RuntimeError("Vorschauwiederholung endete ohne Ergebnis.")\n\n'''
          old_worker = '''                preview_path = (\n                    self._preview_builder(request.path, request.width)\n                    if request.include_image\n                    else None\n                )\n'''
          if source.count(marker) != 1 or source.count(old_worker) != 1:
              raise SystemExit('Unerwarteter Controller-Härtungskontext.')
          source = source.replace(marker, helper + marker, 1)
          source = source.replace(old_worker, '                preview_path = self._build_preview(request)\n', 1)
          path.write_text(source, encoding='utf-8')

          path = Path('tests/test_selection_preview_app_events.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'from videobatch_fast.models import MediaInfo\n',
              'from videobatch_fast.models import MediaInfo\nfrom videobatch_fast.preview_service import PreviewError\n',
              1,
          )
          marker = '\ndef test_callback_failure_is_isolated_and_recorded'
          added = '''\n\ndef test_transient_preview_error_is_retried_once(tmp_path: Path) -> None:\n    source = tmp_path / "image.png"\n    source.write_bytes(b"image")\n    preview = tmp_path / "preview.png"\n    events: list[AppEvent] = []\n    done = threading.Event()\n    attempts = 0\n\n    def builder(_path: Path, _width: int) -> Path:\n        nonlocal attempts\n        attempts += 1\n        if attempts == 1:\n            raise PreviewError("temporary cache race")\n        return preview\n\n    def emit(event: AppEvent) -> None:\n        events.append(event)\n        done.set()\n\n    controller = SelectionPreviewController(\n        emit,\n        preview_builder=builder,\n        media_prober=lambda path: MediaInfo(path, "image", size_bytes=path.stat().st_size),\n    )\n    controller.request(source, 640, include_image=True)\n    _wait_for_event(done, controller)\n\n    assert attempts == 2\n    assert [event.name for event in events] == ["selection_preview_ready"]\n\n\ndef test_non_preview_error_is_not_retried(tmp_path: Path) -> None:\n    source = tmp_path / "image.png"\n    source.write_bytes(b"image")\n    events: list[AppEvent] = []\n    done = threading.Event()\n    attempts = 0\n\n    def builder(_path: Path, _width: int) -> Path:\n        nonlocal attempts\n        attempts += 1\n        raise RuntimeError("programming error")\n\n    def emit(event: AppEvent) -> None:\n        events.append(event)\n        done.set()\n\n    controller = SelectionPreviewController(emit, preview_builder=builder)\n    controller.request(source, 640, include_image=True)\n    _wait_for_event(done, controller)\n\n    assert attempts == 1\n    assert [event.name for event in events] == ["selection_preview_failed"]\n'''
          if source.count(marker) != 1:
              raise SystemExit('Unerwarteter Vorschautest-Kontext.')
          path.write_text(source.replace(marker, added + marker, 1), encoding='utf-8')

          path = Path('tests/test_rc24_selected_media_crash.py')
          source = path.read_text(encoding='utf-8')
          old = '''    root = Tk()\n    root.geometry("1280x820+0+0")\n    app = VideoBatchFastUI(root)\n'''
          new = '''    root = Tk()\n    root.geometry("1280x820+0+0")\n    app = VideoBatchFastUI(root)\n    preview_errors: list[str] = []\n    app._show_solution_dialog = (\n        lambda _definition, detail="": preview_errors.append(str(detail))\n    )\n'''
          assertion = '    assert app.preview_status.get() == "Vorschau bereit"\n'
          if source.count(old) != 1 or source.count(assertion) != 1:
              raise SystemExit('Unerwarteter Schnellklicktest-Kontext.')
          source = source.replace(old, new, 1)
          source = source.replace(
              assertion,
              '    assert app.preview_status.get() == "Vorschau bereit", preview_errors\n',
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY

          chmod 755 test.sh scripts/check_event_architecture.py scripts/check_event_registry.py
          git rm .github/workflows/temporary-selection-event-registry-migration.yml \
            matrix-logs/selection-event-registry.x00 matrix-logs/selection-event-registry.x01 \
            matrix-logs/selection-event-registry.y00 matrix-logs/selection-event-registry.y01 \
            matrix-logs/selection-event-registry.y02

          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
          python3 scripts/toolchain.py prepare --scope quality --auto-repair --quiet
          ENV_PYTHON="$(python3 scripts/toolchain.py path --scope quality --quiet)"
          BIN="$(dirname "$ENV_PYTHON")"
          export PYTHONPATH="$PWD/src" PYTHONDONTWRITEBYTECODE=1
          export VIDEOBATCH_DIAGNOSTICS_DIR="$RUNNER_TEMP/diagnostics"
          export MYPY_CACHE_DIR="$RUNNER_TEMP/mypy-cache" RUFF_CACHE_DIR="$RUNNER_TEMP/ruff-cache"

          "$ENV_PYTHON" scripts/check_event_architecture.py
          "$ENV_PYTHON" scripts/check_event_registry.py
          "$ENV_PYTHON" scripts/verify_compile_isolated.py
          "$ENV_PYTHON" scripts/validate_registries.py
          "$ENV_PYTHON" scripts/internal_quality_gate.py
          "$BIN/ruff" check src scripts tests
          "$BIN/mypy" src/videobatch_fast/app_events.py src/videobatch_fast/event_registry.py \
            src/videobatch_fast/event_buffer.py src/videobatch_fast/selection_preview_events.py \
            src/videobatch_fast/selection_preview_controller.py src/videobatch_fast/runner_events.py \
            src/videobatch_fast/runner.py src/videobatch_fast/runner_process.py
          xvfb-run -a "$ENV_PYTHON" -m pytest -q -p no:cacheprovider \
            tests/test_app_events.py tests/test_event_architecture_gate.py \
            tests/test_event_registry.py tests/test_selection_preview_app_events.py \
            tests/test_rc24_selected_media_crash.py tests/test_release_hardening_2_8_3_rc7.py \
            tests/test_runner_app_events.py

          [[ -e toolchain_wheelhouse/README.md ]] || git checkout "$BASE_SHA" -- toolchain_wheelhouse/README.md
          "$ENV_PYTHON" scripts/build_release_manifest.py
          "$ENV_PYTHON" scripts/validate_release_manifest.py
          "$ENV_PYTHON" - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          files = data.get('files', [])
          if data.get('file_count') != 382 or len(files) != 382:
              raise SystemExit(f"Manifestzahl falsch: {data.get('file_count')} / {len(files)}")
          paths = {item.get('path') for item in files if isinstance(item, dict)}
          required = {
              'src/videobatch_fast/event_registry.py',
              'src/videobatch_fast/selection_preview_events.py',
              'scripts/check_event_registry.py', 'tests/test_event_registry.py',
              'tests/test_selection_preview_app_events.py',
          }
          if not required <= paths:
              raise SystemExit(f'Manifestdateien fehlen: {sorted(required - paths)}')
          if any(path.startswith('matrix-logs/selection-event-registry.') for path in paths):
              raise SystemExit('Transferdatei im Manifest.')
          PY
          git add -A
          git diff --cached --check
          git commit -m 'Migrate selection previews and enforce event registry'
          git push origin HEAD:agent/crash-resilience-fault-lab-20260805
