name: Temporary typed runner MyPy fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-typed-runner-mypy-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/crash-resilience-fault-lab-20260805
          fetch-depth: 0
      - name: Apply minimal typed runner fixes
        shell: bash
        env:
          EXPECTED_HEAD: 9a249caa8af721c5ffa7bbe4403683608b577fcc
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 - <<'PY'
          from pathlib import Path

          runner = Path('src/videobatch_fast/runner.py')
          source = runner.read_text(encoding='utf-8')
          old = '            emit=self._emit,\n'
          new = '            emit=self._publish_mapping,\n'
          if source.count(old) != 1:
              raise SystemExit(f'Unerwartete Runner-Trefferzahl: {source.count(old)}')
          runner.write_text(source.replace(old, new), encoding='utf-8')

          consistency = Path('src/videobatch_fast/recovery_consistency.py')
          source = consistency.read_text(encoding='utf-8')
          old = '''def _safe_int(value: object, default: int = 0) -> int:\n    try:\n        return int(value)\n    except (TypeError, ValueError, OverflowError):\n        return default\n'''
          new = '''def _safe_int(value: object, default: int = 0) -> int:\n    if not isinstance(value, (str, bytes, bytearray, int, float)):\n        return default\n    try:\n        return int(value)\n    except (TypeError, ValueError, OverflowError):\n        return default\n'''
          if source.count(old) != 1:
              raise SystemExit(f'Unerwartete _safe_int-Trefferzahl: {source.count(old)}')
          consistency.write_text(source.replace(old, new), encoding='utf-8')
          PY

          git rm .github/workflows/temporary-typed-runner-mypy-fix.yml
          export PYTHONPATH="$PWD/src"
          export PYTHONDONTWRITEBYTECODE=1
          export VIDEOBATCH_DIAGNOSTICS_DIR="$RUNNER_TEMP/diagnostics"
          python3 scripts/check_event_architecture.py
          python3 scripts/verify_compile_isolated.py
          python3 -m pytest -q -p no:cacheprovider \
            tests/test_runner_app_events.py \
            tests/test_event_architecture_gate.py \
            tests/test_retry_queue_resilience.py \
            tests/test_recovery_consistency.py
          python3 scripts/build_release_manifest.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('RELEASE_MANIFEST.json').read_text(encoding='utf-8'))
          if payload.get('file_count') != 377 or len(payload.get('files', [])) != 377:
              raise SystemExit('377-Dateien-Manifest wurde nicht erhalten.')
          PY
          git add -A
          git diff --cached --check
          git commit -m 'Complete typed BatchRunner migration'
          git push origin HEAD:agent/crash-resilience-fault-lab-20260805
