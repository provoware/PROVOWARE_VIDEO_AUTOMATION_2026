[project]
name = "provoware-videoautomation-2026"
version = "2.8.3rc24"
requires-python = ">=3.10"
dependencies = [
  "cryptography==50.0.0",
  "Pillow==12.3.0",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.coverage.run]
source = ["videobatch_fast"]
branch = true
omit = [
  "*/ui.py",
  "*/ui_*.py",
  "*/app.py",
  "*/theme.py",
  "*/workflow_dialogs.py",
  "*/media_import_dialog.py",
  "*/text_resources.py",
  "*/plugin_host.py",
  "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 77

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["tests/baselines", "diagnostics", "visual_inspection"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B011"]
"src/videobatch_fast/plugin_host.py" = ["S102"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_any_generics = false
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "^(tests/baselines|diagnostics|visual_inspection)/"

[tool.bandit]
exclude_dirs = ["tests", "diagnostics", "visual_inspection"]
skips = ["B101", "B110", "B311", "B404", "B603", "B607"]
